<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高職會計學歷屆模擬考 & 白話解題助手</title>
    <link rel="stylesheet" href="assets/share.css">
    <script src="assets/share.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap gap-3 items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-calculator text-2xl text-yellow-300"></i>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight">高職模擬考｜會計學歷屆試題</h1>
            </div>
            <button type="button" class="share-button" data-share-url="https://homelux-huang.github.io/7581707/Gemini%20Canvas%E6%9C%83%E8%A8%88%E6%A8%A1%E6%93%AC%E8%80%83.html" aria-label="分享會計模擬考"><span aria-hidden="true">↗</span> 分享</button>
            <div class="flex items-center space-x-2 text-xs sm:text-sm bg-indigo-700/60 px-3 py-1.5 rounded-full border border-indigo-500">
                <i class="fa-solid fa-graduation-cap text-yellow-300"></i>
                <span>理論觀念 + 白話文解題</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- 左側：篩選與題目列表區塊 (7 欄) -->
        <section class="lg:col-span-7 flex flex-col space-y-4">
            
            <!-- 年份與單元篩選器 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex flex-wrap gap-3 items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <label for="yearSelect" class="text-sm font-semibold text-slate-600">年度：</label>
                        <select id="yearSelect" onchange="filterQuestions()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="all">近5年全部 (112-108)</option>
                            <option value="112">112學年度</option>
                            <option value="111">111學年度</option>
                            <option value="110">110學年度</option>
                            <option value="109">109學年度</option>
                            <option value="108">108學年度</option>
                        </select>
                    </div>

                    <div class="flex items-center space-x-2">
                        <label for="categorySelect" class="text-sm font-semibold text-slate-600">單元：</label>
                        <select id="categorySelect" onchange="filterQuestions()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="all">所有單元</option>
                            <option value="分錄與傳票">分錄與借貸</option>
                            <option value="調整與結算">調整與期末結算</option>
                            <option value="存貨估價">存貨與成本</option>
                            <option value="折舊與資產">固定資產與折舊</option>
                            <option value="公司會計">公司權益與股票</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 題目卡片容器 -->
            <div id="questionsContainer" class="space-y-4 custom-scrollbar overflow-y-auto max-h-[calc(100vh-220px)] pr-1">
                <!-- 題目將由 JavaScript 動態呈現 -->
            </div>
        </section>

        <!-- 右側：會計理論與國小級白話文 AI 解題區塊 (5 欄) -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            
            <!-- AI 白話文解說面板 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full min-h-[500px]">
                <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-4 rounded-t-xl flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-face-smile text-yellow-300 text-xl"></i>
                        <h2 class="font-bold text-lg">理論觀念 & 超簡單白話解說</h2>
                    </div>
                    <span class="text-xs bg-emerald-700/80 px-2.5 py-1 rounded-full">國小白話版</span>
                </div>

                <!-- 導覽切換列 (上一題 / 下一題) -->
                <div class="bg-slate-100 px-4 py-2 border-b border-slate-200 flex items-center justify-between text-xs font-semibold text-slate-600">
                    <button onclick="prevQuestion()" id="btnPrev" class="px-3 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300 transition flex items-center space-x-1 disabled:opacity-40">
                        <i class="fa-solid fa-chevron-left"></i>
                        <span>上一題</span>
                    </button>
                    <span id="questionProgressText">第 1 / 5 題</span>
                    <button onclick="nextQuestion()" id="btnNext" class="px-3 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300 transition flex items-center space-x-1 disabled:opacity-40">
                        <span>下一題</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div id="explanationContent" class="p-5 flex-grow overflow-y-auto custom-scrollbar space-y-4">
                    <div class="text-center py-12 text-slate-400 space-y-3">
                        <i class="fa-regular fa-comments text-5xl"></i>
                        <p class="text-sm font-medium">點擊左側選項回答後<br>這裡會自動出現超級白話文解析喔！</p>
                    </div>
                </div>

                <!-- 提問互動框 -->
                <div class="p-4 bg-slate-50 border-t border-slate-200 rounded-b-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <label for="userQuestion" class="text-xs font-semibold text-slate-600">聽不懂沒關係，小學老師隨時問：</label>
                    </div>
                    <div class="flex space-x-2">
                        <input type="text" id="userQuestion" placeholder="例如：什麼是權責發生？" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" onkeydown="if(event.key === 'Enter') askAI()">
                        <button onclick="askAI()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                            <span>提問</span>
                        </button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <script>
        // 近5年高職模擬考精選試題 (108-112)
        const questionsData = [
            {
                id: 1,
                year: "112",
                category: "分錄與傳票",
                title: "112年模擬考 - 永續盤存制與權責發生",
                question: "甲公司賒購商品 $50,000，付款條件為 2/10, n/30。請問在「永續盤存制」下，購買當時的正確分錄為何？",
                options: [
                    "A. 借：進貨 50,000 / 貸：應付帳款 50,000",
                    "B. 借：銷貨成本 50,000 / 貸：應付帳款 50,000",
                    "C. 借：商品存貨 50,000 / 貸：應付帳款 50,000",
                    "D. 借：商品存貨 49,000 / 貸：應付帳款 49,000"
                ],
                answer: "C",
                theory: "【會計理論觀念】\n1. **永續盤存制 (Perpetual Inventory System)**：買進商品時，直接記為資產（商品存貨），隨時都能算出家裡剩多少貨。\n2. **歷史成本原則 (Historical Cost Principle)**：買東西當天，要用原本說好的總價（全額）記帳。",
                plainExplanation: "🎈 **國小超級白話解析：**\n\n想像你去玩具店開小雜貨店：\n1. **永續盤存制**就是：「只要買了新玩具進來，就立刻記在小本本上，說家裡多了這批玩具（資產：商品存貨）。」\n2. 你跟批發商說「我先搬貨，下個月再給錢」（這叫**賒購**），所以你欠別人錢，欠錢叫**「應付帳款」**。\n3. 雖然批發商說早點給錢可以打折，但**今天還沒給錢**，所以小本本上記原價 50,000 元！\n\n👉 記帳方法：玩具變多了（借：商品存貨 50,000），欠別人的錢也變多了（貸：應付帳款 50,000）。選 **C**！"
            },
            {
                id: 2,
                year: "111",
                category: "折舊與資產",
                title: "111年模擬考 - 配合原則與資產折舊",
                question: "乙公司於 111 年 1 月 1 日購買機器一台，成本 $100,000，預計殘值 $10,000，估計可用 5 年。採用「直線法」計提折舊，請問 111 年底應提列的折舊費用是多少？",
                options: [
                    "A. $18,000",
                    "B. $20,000",
                    "C. $10,000",
                    "D. $90,000"
                ],
                answer: "A",
                theory: "【會計理論觀念】\n1. **費用配合原則 (Matching Principle)**：機器可以用好幾年，不能在買的第一天就把錢一次扣光，要按年份把磨損的費用平分在每一年。\n2. **應計基礎**：雖然買機器一次給了錢，但「機器被用舊」的損耗要一年一年算。",
                plainExplanation: "🎈 **國小超級白話解析：**\n\n這就像你買了一台腳踏車：\n1. 你花 10 萬元買腳踏車，騎了 5 年後太舊了賣給收廢鐵的，還能拿回 1 萬元。\n2. 算算看你這 5 年**真正騎掉、損耗掉的價值**是：`10萬 - 1萬 = 9萬元`。\n3. **「直線法」**就是平分！把這 9 萬元平分給 5 年，每年騎掉：`9萬 ÷ 5年 = 18,000元`。\n\n👉 這 18,000 元就是今年腳踏車被你騎舊的代價（折舊費用）。選 **A**！"
            },
            {
                id: 3,
                year: "110",
                category: "調整與結算",
                title: "110年模擬考 - 應計基礎下調整（先資後費／已過帳調整）",
                question: "丙公司 110 年 10 月 1 日預付一年期保險費 $24,000，當時全額記為「預付保險費」。110 年 12 月 31 日期末調整時，應借記「保險費」多少金額？",
                options: [
                    "A. $24,000",
                    "B. $6,000",
                    "C. $18,000",
                    "D. $2,000"
                ],
                answer: "B",
                theory: "【會計理論觀念】\n1. **權責發生制 / 應計基礎 (Accrual Basis)**：時間到了、真的用掉了才算成「費用」，沒用到的算「資產（預付權利）」。\n2. **先資後費法 / 已過帳調整**：一開始先記為資產，年底到了要把**「已經用掉的時間」**轉變成費用。",
                plainExplanation: "🎈 **國小超級白話解析：**\n\n這就像你一次買了 12 個月的卡通頻道訂閱：\n1. 總共花了 24,000 元，等於**每個月要 2,000 元** (`24,000 ÷ 12`)。\n2. 從 10月1日 到 12月31日 年底，你已經看了 **10月、11月、12月，一共 3 個月**。\n3. 已經看完的這 3 個月，就真正變成今年用掉的錢（費用）：`2,000元 × 3個月 = 6,000元`。\n\n👉 年底調整要把看掉的 6,000 元算成今年的開銷（借：保險費 6,000）。選 **B**！"
            },
            {
                id: 4,
                year: "109",
                category: "存貨估價",
                title: "109年模擬考 - 先進先出法與成本流轉假設",
                question: "丁商店實施定期盤存制，期初存貨 10 件 @$10，期間進貨：第一次 10 件 @$12，第二次 10 件 @$15。期末經實地盤點剩餘 10 件，若採「先進先出法」，期末存貨成本為多少？",
                options: [
                    "A. $100",
                    "B. $120",
                    "C. $150",
                    "D. $130"
                ],
                answer: "C",
                theory: "【會計理論觀念】\n1. **成本流轉假設 (Cost Flow Assumption)**：假設商品的賣出順序，先進來的商品先賣掉。\n2. **先進先出法 (FIFO)**：因為舊貨先賣光了，所以最後留在倉庫裡的，一定是最新買進的高價商品。",
                plainExplanation: "🎈 **國小超級白話解析：**\n\n「先進先出法」就像賣鮮奶：**舊的鮮奶要先賣給客人，最後留在冰箱裡的，一定是最新進貨的那批！**\n\n1. 倉庫裡有：舊鮮奶 10瓶($10)、中期鮮奶 10瓶($12)、最新鮮奶 10瓶($15)。\n2. 舊鮮奶都被客人買走了，最後冰箱只剩 10 瓶，那這 10 瓶**一定是最後一次買的最新鮮奶**！\n3. 最新鮮奶一瓶 $15，所以剩下的總金額是：`10 瓶 × $15 = $150`。\n\n👉 剩下的鮮奶價值就是 $150。選 **C**！"
            },
            {
                id: 5,
                year: "108",
                category: "公司會計",
                title: "108年模擬考 - 股本與資本公積（企業主體概念）",
                question: "戊公司發行面額 $10 的普通股 1,000 股，發行價格為每股 $15，收到現金 $15,000。請問貸方「資本公積－普通股股票溢價」應記多少？",
                options: [
                    "A. $15,000",
                    "B. $10,000",
                    "C. $5,000",
                    "D. $0"
                ],
                answer: "C",
                theory: "【會計理論觀念】\n1. **法定股本 (Legal Capital)**：股票印的表面金額（面額），是法律規定的基本資本額（記在「普通股股本」）。\n2. **資本公積 (Capital Surplus)**：買家因為搶手多給的錢，不是賺到的營業收入，而是多收到的資本儲蓄。",
                plainExplanation: "🎈 **國小超級白話解析：**\n\n這就像是賣限量超人公仔：\n1. **公仔原價**：公仔盒子上標價 10 元，1,000 個基本價值是 `10 × 1,000 = 10,000元`（這叫股本）。\n2. **大家搶著買**：因為太熱門，大家願意一個花 15 元買，你總共收到 `15 × 1,000 = 15,000元` 的現金。\n3. **多賺的紅利**：多收到的金額 `15,000 - 10,000 = 5,000元`，就是多拿到的獎金！在會計上記為**「資本公積－股票溢價」**。\n\n👉 多收到的差額就是 5,000 元。選 **C**！"
            }
        ];

        let currentFilteredList = [...questionsData];
        let currentIndex = 0;

        // 渲染題目列表
        function renderQuestions(list) {
            const container = document.getElementById('questionsContainer');
            if (!container) return;

            currentFilteredList = list;

            if (list.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-500 font-medium border border-slate-200">沒有符合條件的題目！</div>`;
                return;
            }

            container.innerHTML = list.map((q, index) => `
                <div id="q-card-${q.id}" class="bg-white p-5 rounded-xl border ${index === currentIndex ? 'border-indigo-500 ring-2 ring-indigo-200' : 'border-slate-200'} shadow-sm hover:shadow-md transition space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md">${q.year} 學年</span>
                            <span class="bg-slate-100 text-slate-600 text-xs font-medium px-2.5 py-1 rounded-md">${q.category}</span>
                        </div>
                        <button onclick="selectQuestionByIndex(${index})" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold px-3 py-1.5 rounded-lg border border-amber-200 transition flex items-center space-x-1">
                            <i class="fa-solid fa-eye"></i>
                            <span>看題目與觀念</span>
                        </button>
                    </div>

                    <h3 class="font-bold text-slate-800 text-base leading-snug">${q.title}</h3>
                    <p class="text-slate-700 text-sm leading-relaxed">${q.question}</p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                        ${q.options.map(opt => {
                            const optionKey = opt.trim().charAt(0);
                            return `
                                <button onclick="answerQuestion(${index}, '${optionKey}')" class="text-left text-xs sm:text-sm p-2.5 bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 hover:border-indigo-300 border border-slate-200 rounded-lg transition font-medium text-slate-700">
                                    ${opt}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');

            updateNavigation();
        }

        // 依據下拉選單篩選題目
        function filterQuestions() {
            const yearVal = document.getElementById('yearSelect').value;
            const categoryVal = document.getElementById('categorySelect').value;

            const filtered = questionsData.filter(q => {
                const matchYear = yearVal === 'all' || q.year === yearVal;
                const matchCategory = categoryVal === 'all' || q.category === categoryVal;
                return matchYear && matchCategory;
            });

            currentIndex = 0;
            renderQuestions(filtered);
            if (filtered.length > 0) {
                showExplanation(filtered[0].id);
            }
        }

        // 當使用者點擊選項做題時自動顯示白話文
        function answerQuestion(index, userChoice) {
            currentIndex = index;
            const q = currentFilteredList[index];
            if (!q) return;
            renderQuestions(currentFilteredList);
            showExplanation(q.id, userChoice);
        }

        // 選擇某題
        function selectQuestionByIndex(index) {
            currentIndex = index;
            const q = currentFilteredList[index];
            if (!q) return;
            renderQuestions(currentFilteredList);
            showExplanation(q.id);
        }

        // 切換上一題 / 下一題
        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                selectQuestionByIndex(currentIndex);
            }
        }

        function nextQuestion() {
            if (currentIndex < currentFilteredList.length - 1) {
                currentIndex++;
                selectQuestionByIndex(currentIndex);
            }
        }

        // 更新導覽按鈕狀態
        function updateNavigation() {
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const progressText = document.getElementById('questionProgressText');

            if (currentFilteredList.length === 0) {
                if (btnPrev) btnPrev.disabled = true;
                if (btnNext) btnNext.disabled = true;
                if (progressText) progressText.innerText = "無題目";
                return;
            }

            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === currentFilteredList.length - 1);
            if (progressText) progressText.innerText = `第 ${currentIndex + 1} / ${currentFilteredList.length} 題`;
        }

        // 呈現特定題目的觀念與解析
        function showExplanation(qId, userChoice = null) {
            const q = questionsData.find(item => item.id === qId);
            const panel = document.getElementById('explanationContent');
            if (!q || !panel) return;

            let alertBox = '';
            if (userChoice) {
                const isCorrect = userChoice === q.answer;
                alertBox = isCorrect ? 
                    `<div class="p-3 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-lg text-sm font-semibold flex items-center space-x-2">
                        <i class="fa-solid fa-face-laugh-beam text-lg text-emerald-600"></i>
                        <span>太棒了！你答對了！標準答案是 (${q.answer})</span>
                     </div>` :
                    `<div class="p-3 bg-rose-100 border border-rose-300 text-rose-800 rounded-lg text-sm font-semibold flex items-center space-x-2">
                        <i class="fa-solid fa-face-sad-cry text-lg text-rose-600"></i>
                        <span>答錯了沒關係！你選了 (${userChoice})，標準答案是 (${q.answer})</span>
                     </div>`;
            }

            panel.innerHTML = `
                ${alertBox}
                <div class="border-b pb-3">
                    <span class="text-xs text-indigo-600 font-bold tracking-wide uppercase">${q.year} 學年度 · ${q.category}</span>
                    <h3 class="font-bold text-slate-800 text-base mt-1">${q.title}</h3>
                </div>

                <!-- 會計理論觀念方塊 -->
                <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-4 text-slate-800 text-xs sm:text-sm leading-relaxed">
                    <div class="font-bold text-indigo-900 border-b border-indigo-200 pb-1.5 mb-2 flex items-center space-x-1.5">
                        <i class="fa-solid fa-graduation-cap text-indigo-600"></i>
                        <span>考試必考的「會計理論觀念」：</span>
                    </div>
                    <div class="whitespace-pre-line text-indigo-950 font-medium">${q.theory}</div>
                </div>

                <!-- 國小等級超簡單白話文解析 -->
                <div class="bg-amber-50/90 border border-amber-200 rounded-xl p-4 text-slate-800 text-sm whitespace-pre-line leading-relaxed">
                    ${q.plainExplanation}
                </div>
            `;

            // 自動將解析面板捲動到最上方
            panel.scrollTop = 0;
        }

        // 發送給 AI 助教
        async function askAI() {
            const input = document.getElementById('userQuestion');
            if (!input) return;
            const questionText = input.value.trim();
            if (!questionText) return;

            const panel = document.getElementById('explanationContent');
            const currentQ = currentFilteredList[currentIndex] || questionsData[0];

            // 顯示載入動畫
            const loadingId = 'loading-' + Date.now();
            panel.innerHTML += `
                <div id="${loadingId}" class="p-4 bg-indigo-50 border border-indigo-200 rounded-xl space-y-2">
                    <div class="flex items-center space-x-2 text-indigo-700 text-sm font-semibold">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <span>小學老師正在用最簡單的故事回答你...</span>
                    </div>
                </div>
            `;
            input.value = '';

            const systemPrompt = `你是一位講故事高手的小學老師。請回答學生關於高職會計的提問。請做到：
1. 【會計理論觀念】：清楚列出考試專有名詞（如：權責發生制/應計基礎、費用配合原則等）。
2. 【國小學生聽得懂的超白話解說】：完全用國小生聽得懂的生活用語、比喻（如分糖果、買零食、租漫畫）。不可以使用複雜難懂的詞彙。`;

            const userPrompt = `
當前討論的題目：
${currentQ.title}
題目內容：${currentQ.question}
答案：${currentQ.answer}
理論基礎：${currentQ.theory}

學生的疑問：${questionText}

請明確指出相關的【會計理論觀念】，並同時用國小低年級、中年級聽得懂的超級白話故事為學生解答。`;

            try {
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || "老師剛剛出神了，可以再問一次嗎？";

                document.getElementById(loadingId)?.remove();
                panel.innerHTML += `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-slate-800 text-sm space-y-2">
                        <div class="flex items-center space-x-2 text-emerald-800 font-bold border-b border-emerald-200 pb-2">
                            <i class="fa-solid fa-chalkboard-user"></i>
                            <span>老師的超白話解答：</span>
                        </div>
                        <div class="whitespace-pre-line leading-relaxed">${aiText}</div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                panel.innerHTML += `
                    <div class="p-3 bg-rose-100 border border-rose-300 text-rose-800 rounded-lg text-sm">
                        連線發生錯誤，請稍後再試。
                    </div>
                `;
            }
        }

        // 頁面載入初始化
        window.onload = function() {
            renderQuestions(questionsData);
            showExplanation(questionsData[0].id);
        };
    </script>
</body>
</html>
