name: 108 seven original-pixel option-boundary refinements v3 (DRAFT NO RELEASE)
on:
  push:
    branches:
      - qa/114-115-official-visual-review
    paths:
      - scripts/refine_108_seven_option_boundary_crops_v3.py
      - .github/workflows/108-seven-crop-boundary-v3-no-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa108-seven-boundaries-v3
  cancel-in-progress: false
jobs:
  refine:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pillow for lossless TCTE page pixel comparison
        run: python -m pip install 'Pillow>=10,<12'
      - name: Pin QA branch SHA and check prior v2 candidates unchanged
        run: |
          echo "QA_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m py_compile scripts/refine_108_seven_option_boundary_crops_v3.py
          python scripts/refine_108_seven_option_boundary_crops_v3.py
      - name: Produce seven v3 crops and isolated SQLite G5
        run: python scripts/refine_108_seven_option_boundary_crops_v3.py --stage
      - name: Verify seven versioned SHA pairs and no QA promotion
        run: |
          python - <<'PY_ASSERT'
          import json,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from audit_105_115_sqlite_readonly import audit_year
          b=Path('sudu/data/processed/108')
          def rd(n):return json.loads((b/n).read_text('utf8'))
          inv=rd('inventory.json');m=rd('webp-manifest.json')
          bank=rd('questions.json');v=rd('VISUAL_QA.json')
          val=rd('VALIDATION.json');rel=rd('release-manifest.json')
          ev=rd('qa-drafts/DRAFT_108_SEVEN_CROP_BOUNDARY_V3_20261024.json')
          assert len(ev['revisions'])==7
          assert inv['webpGeneratedDrafts']==204 and inv['visualQaPass']==v['passCount']==val['imageVisualQaPass']==0
          assert inv['ocrTextIndependentlyVerified']==val['ocrTextVerified']==0
          assert inv['answerOfficialFinalVerified']==val['answerOfficialFinalVerified']==0
          assert ev['newG1']==ev['newG2']==ev['newAnswerVerified']==0
          mm={z['questionId']:z for z in m['items']}
          qs={z['questionId']:z for z in bank['questions']}
          for item in ev['revisions']:
              id=item['questionId'];img=mm[id]
              assert img['qaStatus']==qs[id]['imageQaStatus']=='DRAFT_NEEDS_DIRECT_VISUAL_QA'
              assert img['output']==item['newCandidate']
              assert hashlib.sha256(Path(item['oldCandidate']).read_bytes()).hexdigest()==item['oldSha256']
              assert hashlib.sha256(Path(item['newCandidate']).read_bytes()).hexdigest()==item['newSha256']==img['outputSha256']
              assert not qs[id]['questionVerified'] and not qs[id]['answerVerified'] and not qs[id]['integrationReady']
          assert not rel['releaseAllowed'] and not rel['integrationReady']
          assert all(audit_year(y)['g5Pass'] and audit_year(y)['sandboxImportPasses']==2 for y in range(105,116))
          print('108 revised 7 v3 candidate images, old v2 preserved, G5 11/11, G1 0, NO RELEASE')
          PY_ASSERT
      - name: Save seven versioned WebPs, JSON, DB evidence with nonforce lease
        run: |
          set -eu
          git add sudu/data/processed/108/qa-drafts/webp-v3/
          git add sudu/data/processed/108/qa-drafts/DRAFT_108_SEVEN_CROP_BOUNDARY_V3_20261024.json
          git add sudu/data/processed/108/questions.json
          git add sudu/data/processed/108/webp-manifest.json
          git add sudu/data/processed/108/ocr-raw-candidates.json
          git add sudu/data/processed/108/VISUAL_QA.json
          git add sudu/data/processed/108/inventory.json
          git add sudu/data/processed/108/VALIDATION.json
          git add sudu/data/processed/108/question-bank.sqlite3
          git add sudu/data/processed/105-115-SQLITE_G5_READONLY_AUDIT.json
          git diff --cached --check
          git fetch origin qa/114-115-official-visual-review
          if [ "$(git rev-parse FETCH_HEAD)" != "$QA_BASE" ]; then
            echo "QA head changed; refusing stale push"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(data108): seven v3 source-pixel crop boundaries DRAFT, G5 unchanged"
          git push origin HEAD:refs/heads/qa/114-115-official-visual-review
