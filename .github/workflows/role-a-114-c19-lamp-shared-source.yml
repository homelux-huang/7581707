name: ROLE A 114 C19 correct original single and lamp shared source link (NO RELEASE)
on:
  push:
    branches:
      - qa/role-a-114-c19-lamp-source-link-20261103
    paths:
      - sudu/data/processed/114/webp-v2/00-C/114-00-C-19.webp
      - sudu/data/processed/114/qa-drafts/DIRECT_VISUAL_114_C19_23_SHARED_20261023.json
      - sudu/data/processed/114/qa-drafts/OCR_VISUAL_114_C19_C23_20261023.json
      - sudu/data/processed/114/review-evidence/114-00-C-19-lamp-shared-link-20261103.json
      - tests/test_role_a_114_c19_lamp_shared_source.py
      - .github/workflows/role-a-114-c19-lamp-shared-source.yml
      - docs/ROLE_A_114_C19_LAMP_SHARED_SOURCE_20261103.md
  workflow_dispatch:

permissions:
  contents: read
jobs:
  q19_lamp_original:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-114-c19-lamp-source-link-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Strict Q19 correct original source / true lamp shared / official notice / negative gates
        run: |
          set -euo pipefail
          python -m py_compile tests/test_role_a_114_c19_lamp_shared_source.py
          python -m unittest discover -s tests -p test_role_a_114_c19_lamp_shared_source.py -v
      - name: Fail closed against mutation and unintended release
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo "Only Q19 missing source link evidence; no G2/G3/master student READY."
