name: MASTER PR211 frozen-source, code-commit, and G8 ZIP fail-closed tests (NO RELEASE)
on:
  push:
    branches:
      - fix/master-pr211-g8-security-hardening-20261115
  pull_request:
    branches:
      - fix/work-authenticated-g8-bridge-20261115
permissions:
  contents: read
jobs:
  security_hardening_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable bridge regression dependencies (no providers or secrets)
        run: python -m pip install -q pillow requests beautifulsoup4 cryptography
      - name: Compile patched code and negative tests
        run: python -m compileall -q scripts/sudu_g8_release_bridge.py tests/test_sudu_g8_release_bridge.py
      - name: Actual synthetic fail-closed source/G6/ZIP/code tests
        run: python -m unittest discover -s tests -p 'test_sudu_g8_release_bridge.py' -v
      - name: Existing independent E/native publisher safety regressions
        run: python -m unittest discover -s tests -p 'test_sudu*.py' -v
      - name: No writes to source, approved, policy, or artifact output
        run: git diff --exit-code
