name: ROLE A 115 MB23 original 2x3 table and 205 SQLite G2/G3 source-only admission (NO RELEASE)
on:
  push:
    branches: [qa/role-a-115-mb23-canonical-table-20261110]
    paths:
      - scripts/role_a_115_mb23_source_table_admission_20261110.py
      - .github/workflows/role-a-115-mb23-source-admission-20261110.yml
permissions:
  contents: write
concurrency:
  group: role-a-115-mb23-source-admission-20261110
  cancel-in-progress: false
jobs:
  real_mb23_original_table_and_binary_sqlite:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-115-mb23-canonical-table-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
          sparse-checkout: |
            sudu/data/processed/115
            sudu/data/original/115/00-MB
            sudu/data/original/115/00-MB-answers
            scripts
            tests
            docs
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Read original ROLE A MB23 2x3 source proof stage only
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: a0e8ea8e5d7cde6fc0f13430037c242771809938
          path: _role_a_stage
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/115/source-stage
            sudu/data/processed/115/review-evidence
          sparse-checkout-cone-mode: true
      - name: Read original C-author PR143 verified table source and teaching digest
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: afaba171eec77cc27c3171b8bc8282f68ade74b9
          path: _role_c_author
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-115-20261025
          sparse-checkout-cone-mode: true
      - name: Check real protected-main original publisher source-only
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 5546a603abfe0af2e62c0e5f63f775be0bfb24cf
          path: _publisher_main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            sudu/release-governance
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real WebP image codec for publisher source G1
        run: python -m pip install -q pillow
      - name: Pin exact official QA MB21 MB22 merged source baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 15108e8e657d070724889f1df3d3a6ae6da96d97 HEAD
          test "$(git rev-parse HEAD:sudu/data/processed/115/questions.json)" = '696ec3cba5ffd54717ae1b07985b2d332ecf1a19'
          test "$(git rev-parse HEAD:sudu/data/processed/115/question-bank.sqlite3)" = '758e2ebc993291ed8101549a750aa635a979f16b'
          test "$(git rev-parse HEAD:sudu/data/processed/115/webp-manifest.json)" = '2e204b1cca4caf8dea494bd0d8ecfccf5b93f84b'
      - name: Import exact Q23 original table G1 G2 G3 and update 14-column 205 DB one row
        run: |
          set -euo pipefail
          python scripts/role_a_115_mb23_source_table_admission_20261110.py --apply
          python scripts/role_a_115_mb23_source_table_admission_20261110.py --verify
      - name: Commit only exact Q23 source and original G2/G3 evidence (not student release)
        run: |
          set -euo pipefail
          git add -- sudu/data/processed/115/questions.json sudu/data/processed/115/question-bank.sqlite3 sudu/data/processed/115/inventory.json sudu/data/processed/115/source-stage/115-00-MB-23-staged-20261104.json sudu/data/processed/115/review-evidence/115-00-MB-23-table-source-20261103.json sudu/data/processed/115/review-evidence/115-00-MB-23-ocr-publisher-20261110.json sudu/data/processed/115/review-evidence/115-00-MB-23-official-publisher-20261110.json sudu/data/processed/115/review-evidence/115-00-MB-23-source-admission-20261110.json sudu/data/processed/115/SQLITE_QA_MB23_TABLE_BRIDGE_20261110.json
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'source(A): original 115 MB23 full 2x3 table and 205 SQLite one QID (NO RELEASE)'
          python scripts/role_a_115_mb23_source_table_admission_20261110.py --verify
          git push origin HEAD:refs/heads/qa/role-a-115-mb23-canonical-table-20261110
          echo 'SOURCE_ONLY G1 G2 G3 / ROLE E TRUST and D emitted UI HOLD'
