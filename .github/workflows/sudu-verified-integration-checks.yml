name: Test 114/115 verified V4 integration
on:
  push:
    branches:
      - integration/114-115-auto-verified-pages
      - feature/partial-qa-preview-114-115-20261022
      - release/114-115-qa-incremental-20261022
      - feature/115-math-b-audited-student-release-20261023
      - fix/fast-chromium-qa-20261023
      - fix/v4-inline-webp-reader-20261023
      - fix/v4-single-question-only-20261023
      - integration/128-p0-p1-pr22-mb23-final-20261025
  pull_request:
    branches: [main]
    paths:
      - sudu/v4-115-multisubject-review-demo.html
      - sudu/verified-questions-runtime.js
      - sudu/demo-subject-learning.js
      - tests/sudu_demo_acceptance.cjs
      - tests/sudu_certified_positive_browser.cjs
      - tests/sudu_browser_smoke.cjs
      - .github/workflows/sudu-verified-integration-checks.yml
      - scripts/sudu_verified_publish.py
      - tests/test_sudu_verified_publish.py
      - tests/sudu_real_reviewed_browser.cjs
      - tests/sudu_verified_integration_browser.cjs
      - .github/workflows/sudu-release-checks.yml
      - .github/workflows/sudu-browser-test.yml
      - .github/workflows/pages.yml
      - .github/workflows/sudu-verified-autopublish.yml
  workflow_dispatch:
permissions:
  contents: read
# Cancel only obsolete PR/branch checks; never interrupt Pages releases.
concurrency:
  group: sudu-v4-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -q pillow cryptography
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
          node -e "const p=require('playwright'); p.chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close())"
      - name: Test exact public allowlist, 35 Demo and 114/115 yearly UI
        run: |
          set -e
          python -m unittest discover -s tests -p 'test_sudu_verified_publish.py' -v
          python -m unittest discover -s tests -p 'test_public_build.py' -v
          python scripts/sudu_verified_publish.py check
          node --check sudu/verified-questions-runtime.js
          python -m py_compile scripts/check_live_release.py
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/sudu-dev-test.log 2>&1 &
          trap 'kill $!' EXIT
          node tests/sudu_verified_integration_browser.cjs
          node tests/sudu_certified_positive_browser.cjs
          node tests/sudu_demo_acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-v4-staging-qa
          path: test-results/
          if-no-files-found: ignore

  real_source_preview:
    name: Stage current 114/115 QA branch without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          path: _source_qa
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/114
            sudu/data/processed/115
            sudu/DEMO_VISUAL_QA.md
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read original QA evidence and independently fail closed
        run: |
          set -e
          python -m pip install -q pillow cryptography
          python scripts/sudu_verified_publish.py stage --source _source_qa --dest . --sha "$(git -C _source_qa rev-parse HEAD)"
          python scripts/sudu_verified_publish.py check
          PYTHONPATH=. python tests/sudu_staging_student_certificates.py
          mkdir -p _qa_real_student_fixture
          cp sudu/data/approved/115.json _qa_real_student_fixture/115.json
          cp sudu/data/approved/progress.json _qa_real_student_fixture/progress.json
      - uses: actions/upload-artifact@v4
        with:
          name: actual-114-115-qa-admission-preview
          path: sudu/data/approved/progress.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-student-ui-fixture-ci-only
          path: _qa_real_student_fixture/

  verify_real_student_ui:
    name: Browser test all 5 actual approved Math B students and explanations
    needs: [real_source_preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: real-student-ui-fixture-ci-only
          path: _qa_real_student_fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium headless and required image build dependencies
        run: |
          python -m pip install -q pillow cryptography
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Exercise actual per-question student UI against source QA records (CI only)
        run: |
          set -euo pipefail
          cp _qa_real_student_fixture/115.json sudu/data/approved/115.json
          cp _qa_real_student_fixture/progress.json sudu/data/approved/progress.json
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/qa-real-ui-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node tests/sudu_real_reviewed_browser.cjs
  full_release_gates:
    name: Run complete same-SHA Pages release gate (no deployment)
    uses: ./.github/workflows/sudu-release-checks.yml
    with:
      # PR events use a synthetic merge SHA in github.sha; pin the real PR head
      # so Browser Smoke and release gates prove the exact feature commit.
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}
