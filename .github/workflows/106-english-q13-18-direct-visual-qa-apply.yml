name: 106 English Q13-Q18 direct original-WebP QA apply (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/apply_106_english_q13_18_direct_visual_qa.py
      - .github/workflows/106-english-q13-18-direct-visual-qa-apply.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-106-en-q13-q18-direct-qa
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Recheck direct visual evidence, SHA-pinned originals and all six source pixels
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/114-115-official-visual-review"
          python -m py_compile scripts/apply_106_english_q13_18_direct_visual_qa.py
          python scripts/apply_106_english_q13_18_direct_visual_qa.py --check
      - name: Promote only six directly reviewed image assets, not answers, no teaching
        run: |
          set -euo pipefail
          python scripts/apply_106_english_q13_18_direct_visual_qa.py --stage
          sha256sum sudu/data/processed/106/{questions.json,webp-manifest.json,VISUAL_QA.json,inventory.json,VALIDATION.json,release-manifest.json,question-bank.sqlite3} > /tmp/106-pass1.sha
          python scripts/apply_106_english_q13_18_direct_visual_qa.py --stage
          sha256sum sudu/data/processed/106/{questions.json,webp-manifest.json,VISUAL_QA.json,inventory.json,VALIDATION.json,release-manifest.json,question-bank.sqlite3} > /tmp/106-pass2.sha
          diff -u /tmp/106-pass1.sha /tmp/106-pass2.sha
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("sudu/data/processed/106")
          inv=json.loads((d/"inventory.json").read_text())
          val=json.loads((d/"VALIDATION.json").read_text())
          m=json.loads((d/"webp-manifest.json").read_text())
          qs=json.loads((d/"questions.json").read_text())
          assert inv["webpGeneratedDrafts"]==188 and inv["visualQaPass"]==6
          assert val["imageVisualQaPass"]==6
          assert sum(x["qaStatus"]=="PASS" for x in m["items"])==6
          assert inv["answerOfficialFinalVerified"]==0 and val["answerOfficialFinalVerified"]==0
          assert all(not (x.get("answerVerified") or x.get("questionVerified") or x.get("integrationReady")) for x in qs["questions"])
          assert val["releaseAllowed"] is False and inv["integrationReady"] is False
          print("PASS: 106 English six image QA PASS, source and isolated DB consistent; no answer, OCR or release approval")
          PY
      - name: Commit only isolated QA metadata and JSON SQLite, no images/main/LIVE
        run: |
          set -euo pipefail
          git config user.name "7581707 QA Image Ledger"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add sudu/data/processed/106/{questions.json,webp-manifest.json,VISUAL_QA.json,inventory.json,VALIDATION.json,release-manifest.json,question-bank.sqlite3}
          if ! git diff --cached --quiet; then
            git commit -m "qa(106): 6 newly recovered English image visual QA PASS; answer still unverified"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 106-English-Q13-18-sha-direct-QA-ledger
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/106/qa-drafts/QA_106_EN_Q13_18_DIRECT_VISUAL_SHA_20261023.json
            sudu/data/processed/106/inventory.json
            sudu/data/processed/106/VALIDATION.json
