name: 115 Role C Chinese14 English36-37 source-bound author QA (NO RELEASE)
on:
  push:
    branches:
      - teaching/115-role-c-chinese14-english36-37-20261025
    paths:
      - 'sudu/teaching-candidates/115-role-c-chinese14-english36-37-20261025/**'
      - 'tests/test_115_role_c_chinese14_english36_37.py'
      - '.github/workflows/115-role-c-chinese14-english36-37.yml'
  pull_request:
    paths:
      - 'sudu/teaching-candidates/115-role-c-chinese14-english36-37-20261025/**'
      - 'tests/test_115_role_c_chinese14_english36_37.py'
      - '.github/workflows/115-role-c-chinese14-english36-37.yml'
permissions:
  contents: read
jobs:
  author-draft-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_115_role_c_chinese14_english36_37.py' -v
