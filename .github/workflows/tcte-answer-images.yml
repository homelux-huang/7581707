name: Original official answer images - NO OCR
on:
  push:
    paths:
      - scripts/tcte_answer_images.py
      - .github/workflows/tcte-answer-images.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: tcte-corpus-update
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests pymupdf pillow
      - run: python scripts/tcte_answer_images.py
      - name: Recompute corpus provenance and decode every referenced image
        run: |
          python scripts/tcte_manifest.py
          python scripts/check_tcte_corpus.py --decode-images --json sudu/data/corpus-audit.json --markdown docs/SUDU_CORPUS_AUDIT.md
      - name: Commit official answer WebP without changing question/answer fields
        run: |
          git config user.name '7581707 original answer image bot'
          git config user.email '7581707-bot@users.noreply.github.com'
          git add sudu/data/original sudu/data/years sudu/data/index.json sudu/data/corpus-audit.json docs/SUDU_CORPUS_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add original official answer sheet WebP, no OCR'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish original answer images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f target_sha="$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-image-report
          path: sudu/data/original/answers.json
