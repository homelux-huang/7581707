name: Role A 114 C23 original official D/notice QA & exact one 205 SQL row (NO RELEASE)
on:
  push:
    branches:
      - qa/role-a-114-c23-final-answer-20261026
    paths:
      - scripts/role_a_114_c23_final_official.py
      - tests/test_role_a_114_c23_final_official.py
      - docs/ROLE_A_114_C23_FINAL_OFFICIAL_20261026.md
      - .github/workflows/role-a-114-c23-final-official.yml
      - sudu/data/processed/114/questions.json
      - sudu/data/processed/114/question-bank.sqlite3
      - sudu/data/processed/114/review-evidence/114-00-C-23-official.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: role-a-114-c23-original-official-source-20261026
  cancel-in-progress: false

jobs:
  source_exact_one_question_only:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-114-c23-final-answer-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out exact isolated Role A branch
        uses: actions/checkout@v4
        with:
          ref: qa/role-a-114-c23-final-answer-20261026
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decode actual original question/shared and published-answer images
        run: python -m pip install -q pillow==11.3.0
      - name: Apply and verify strict 114 C23 source official D/annual corrections/one SQL row
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/role-a-114-c23-final-answer-20261026"
          python -m py_compile scripts/role_a_114_c23_final_official.py tests/test_role_a_114_c23_final_official.py
          python -m scripts.role_a_114_c23_final_official --apply
          python -m scripts.role_a_114_c23_final_official --verify
          python -m unittest discover -s tests -p test_role_a_114_c23_final_official.py -v
          # Original 8 strict PR98 tests require precisely THREE historical
          # changes and MUST run on the original 114 C20-22 exact SHA.
          # The current next-stage C23 test independently requires precisely
          # ONE additional C23 change vs that immutable PR98 Git snapshot.
          olddir="$(mktemp -d)"
          rmdir "$olddir"
          git worktree add --detach "$olddir" e448bf0c814ae3a2075faea23ba75b244519928d
          (cd "$olddir" && python -m unittest discover -s tests -p test_role_a_114_c20_c22_official.py -v)
          git worktree remove --force "$olddir"
      - name: Only own isolated source/DB/C23 evidence, no other sessions or main
        run: |
          set -euo pipefail
          git add -- sudu/data/processed/114/questions.json sudu/data/processed/114/question-bank.sqlite3
          git add -- sudu/data/processed/114/review-evidence/114-00-C-23-official.json
          expected="$(printf '%s\n' 'sudu/data/processed/114/question-bank.sqlite3' 'sudu/data/processed/114/questions.json' 'sudu/data/processed/114/review-evidence/114-00-C-23-official.json')"
          changed="$(git diff --cached --name-only)"
          if test -n "$changed"; then
            test "$changed" = "$expected" || { echo "Unleased files rejected"; git diff --cached --name-only; exit 1; }
            git diff --cached --check
            test -z "$(git diff --name-only)" || { echo "Unstaged files modified"; exit 1; }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "data(role A): 114 C23 original official D and 5-page notice QA, update only one SQLite payload [NO RELEASE]"
            git push origin HEAD:refs/heads/qa/role-a-114-c23-final-answer-20261026
          else
            echo "IDEMPOTENT C23 SOURCE NO WRITE"
          fi
          test "$(git ls-remote origin refs/heads/qa/role-a-114-c23-final-answer-20261026 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "NO E/teacher, no independent UI claim, no main, Pages or LIVE"
