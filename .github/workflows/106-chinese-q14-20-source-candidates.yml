name: 106 Chinese Q14-20 source-page singles and three shared drafts (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/stage_106_chinese_q14_20_p004_candidates.py
      - .github/workflows/106-chinese-q14-20-source-candidates.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-106-chinese-q14-20-source-drafts
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'Pillow>=10,<12'
      - name: Verify source Git blob SHA and blocked missing 106 question status
        run: |
          set -euo pipefail
          python -m py_compile scripts/stage_106_chinese_q14_20_p004_candidates.py
          python scripts/stage_106_chinese_q14_20_p004_candidates.py --check
      - name: Stage missing seven only plus three independent shared drafts; prove SHA idempotence
        run: |
          set -euo pipefail
          python scripts/stage_106_chinese_q14_20_p004_candidates.py --stage
          sha256sum sudu/data/processed/106/qa-drafts/webp-v2/00-C/106-00-C-{14,15,16,17,18,19,20}.webp \
            sudu/data/processed/106/qa-drafts/webp-v2/shared/*.webp \
            sudu/data/processed/106/qa-drafts/DRAFT_106_CHINESE_Q14_20_SHARED_SOURCE_P004_20261023.json > /tmp/q106-before
          python scripts/stage_106_chinese_q14_20_p004_candidates.py --stage
          sha256sum sudu/data/processed/106/qa-drafts/webp-v2/00-C/106-00-C-{14,15,16,17,18,19,20}.webp \
            sudu/data/processed/106/qa-drafts/webp-v2/shared/*.webp \
            sudu/data/processed/106/qa-drafts/DRAFT_106_CHINESE_Q14_20_SHARED_SOURCE_P004_20261023.json > /tmp/q106-after
          diff -u /tmp/q106-before /tmp/q106-after
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("sudu/data/processed/106")
          ledger=json.loads((d/"qa-drafts/DRAFT_106_CHINESE_Q14_20_SHARED_SOURCE_P004_20261023.json").read_text())
          bank=json.loads((d/"questions.json").read_text())
          assert ledger["questionCandidates"]==7 and ledger["sharedCandidates"]==3
          assert ledger["newImageQaPass"]==0 and ledger["newSharedQaPass"]==0
          assert not any(q.get("integrationReady") for q in bank["questions"])
          print("PASS: 7 missing candidate singles + 3 shared, all pending direct visual QA")
          PY
      - name: Commit draft-only candidates; never touch QA PASS, student records or main
        run: |
          set -euo pipefail
          git config user.name "7581707 Historical Draft WebP"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add -- sudu/data/processed/106/qa-drafts/webp-v2/00-C/106-00-C-{14,15,16,17,18,19,20}.webp \
            sudu/data/processed/106/qa-drafts/webp-v2/shared/ \
            sudu/data/processed/106/qa-drafts/DRAFT_106_CHINESE_Q14_20_SHARED_SOURCE_P004_20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "data(106): seven missing source-only Chinese singles and 3 shared WebPs, QA PENDING"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 106-Chinese-Q14-Q20-plus-shared-raw-drafts
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/106/qa-drafts/webp-v2/00-C/106-00-C-{14,15,16,17,18,19,20}.webp
            sudu/data/processed/106/qa-drafts/webp-v2/shared/*.webp
            sudu/data/processed/106/qa-drafts/DRAFT_106_CHINESE_Q14_20_SHARED_SOURCE_P004_20261023.json
