name: 115 09-1 ten final official answers and no-objection QA (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/apply_115_09_1_q01_10_official_final_answers.py
      - .github/workflows/115-09-1-first-10-official-answers-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-115-09-1-final-answer-ten
  cancel-in-progress: false
jobs:
  official-answer:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate final TCTE answer image SHA, candidate values and no-objection notice
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/114-115-official-visual-review"
          python -m py_compile scripts/apply_115_09_1_q01_10_official_final_answers.py
          python scripts/apply_115_09_1_q01_10_official_final_answers.py --check
      - name: Record 10 individually matched official answers and double-run idempotence
        run: |
          set -euo pipefail
          python scripts/apply_115_09_1_q01_10_official_final_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/answer-before.sha
          python scripts/apply_115_09_1_q01_10_official_final_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/answer-after.sha
          diff -u /tmp/answer-before.sha /tmp/answer-after.sha
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("sudu/data/processed/115")
          q=json.loads((r/"questions.json").read_text())
          a=json.loads((r/"official-answer-evidence.json").read_text())
          v=json.loads((r/"VALIDATION.json").read_text())
          m=json.loads((r/"release-manifest.json").read_text())
          assert sum(x.get("answerVerified") is True for x in q["questions"])==16
          assert a["answerVerifiedCount"]==16
          assert all(not x.get("integrationReady") for x in q["questions"])
          assert m["releaseAllowed"] is False and m["integrationReady"] is False
          assert v["integrationReady"] is False
          print("PASS: 10 more verified final answers, 16/205 total; G6 release remains blocked")
          PY
      - name: Commit only G3 evidence and isolated SQLite, never main
        run: |
          set -euo pipefail
          git config user.name "7581707 TCTE Final Answer QA"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add -- sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3}
          if ! git diff --cached --quiet; then
            git commit -m "qa(115): verify final official no-objection 09-1 answers Q01-Q10, no release"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 115-09-1-ten-TCTE-final-answer-visual-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/115/QA_115_09_1_Q01_10_OFFICIAL_FINAL_ANSWERS_20261023.json
            sudu/data/processed/115/official-confirmation-status.json
            sudu/data/processed/115/release-manifest.json
