name: ROLE D actual emitter 114 E12 E11 115 MB21 MB22 MB23 preflight (NO RELEASE)
on:
  push:
    branches:
      - qa/role-d-emitted-only-preflight-20261106
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-emitted-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_publisher_only_formal_hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUDU_D_MODE: precheck
      SUDU_D_EXPECT_SHA: ${{ github.sha }}
      SUDU_D_REQUIRE_PROTECTED_ROOT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin remote protected main trust root (read-only)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          echo "SUDU_D_PROTECTED_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_ENV"
      - name: Verify exact tested commit, syntax and no staged source mutation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --version
          node --check tests/sudu_role_d_emitted_only_8x2_20261106.cjs
          node --check tests/sudu_role_d_e12_trusted_receipt_negatives_20261107.cjs
          node --check tests/sudu_role_d_114_e12_unreleased_chromium_20261107.cjs
          test "$(git hash-object sudu/data/approved/114.json)" = "$(git rev-parse refs/remotes/origin/main:sudu/data/approved/114.json)"
          test "$(git hash-object sudu/data/approved/115.json)" = "$(git rev-parse refs/remotes/origin/main:sudu/data/approved/115.json)"
          test "$(git hash-object sudu/release-governance/independent-review-policy.json)" = "$(git rev-parse refs/remotes/origin/main:sudu/release-governance/independent-review-policy.json)"
          git diff --exit-code
      - name: Checkout original immutable PR107 ROLE B teaching (read-only)
        uses: actions/checkout@v4
        with:
          ref: 57d969888c57fdcd2b16c933e92c7a2c9eebb3a5
          path: _role_b_e12
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025-batch02/114-00-E-12.json
      - name: Negative receipts + actual PR107 canonical-vs-composed teaching SHA
        run: |
          set -euo pipefail
          node tests/sudu_role_d_e12_trusted_receipt_negatives_20261107.cjs
      - name: Fail-closed source-and-trust preflight (expected HOLD, never PASS)
        run: |
          set -euo pipefail
          node tests/sudu_role_d_emitted_only_8x2_20261106.cjs
          node -e "const a=require('./test-results/role-d-emitted-only-20261106/formal-uiqa-report.json');if(a.status!=='HOLD_UPSTREAM_ADMISSION')throw Error('unreviewed QID unexpectedly admissible');for(const q of ['114-00-E-12','114-00-E-11','115-00-MB-21','115-00-MB-22','115-00-MB-23']){if(a.outcomes[q].status!=='HOLD'||!a.outcomes[q].missing.some(x=>x.includes('trustedAiReviewReceipts')))throw Error('missing protected E gate for '+q)}if(a.cases.length||a.qaOnly||!a.noInterception)throw Error('invalid formal precheck');console.log('EXPECTED HOLD 5/5: NO REAL UIQA PASS, NO READY/LIVE')"
      - name: Negative gate - cannot run formal without source/E/current digest
        run: |
          set -euo pipefail
          if SUDU_D_MODE=formal SUDU_D_QID=114-00-E-12 node tests/sudu_role_d_emitted_only_8x2_20261106.cjs; then
            echo "FAIL: unadmitted E12 unexpectedly produced formal PASS"
            exit 1
          fi
          node -e "const a=require('./test-results/role-d-emitted-only-20261106/formal-uiqa-report.json');if(a.status!=='FAIL'||a.cases.length)throw Error('formal missing-receipt negative gate unexpectedly passed');console.log('PASS negative: formal E12 rejected, no screenshots counted')"
      - name: Restore unmodified HOLD report
        if: always()
        run: |
          SUDU_D_MODE=precheck node tests/sudu_role_d_emitted_only_8x2_20261106.cjs || true
      - name: Archive honest admission blockers and negative proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-emitter-formal-HOLD-${{ github.run_id }}
          path: test-results/role-d-emitted-only-20261106/
          if-no-files-found: error
          retention-days: 14

  actual_e12_unreleased_8x2_chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUDU_D_MODE: hold-browser
      SUDU_D_EXPECT_SHA: ${{ github.sha }}
      SUDU_D_SITE: http://127.0.0.1:8765/sudu/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual Chromium and Traditional Chinese fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Build real approved-only student V4; prove E12 cannot leak into student answer UI
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d-e12-hold-browser.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/sudu/v4-115-multisubject-review-demo.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_114_e12_unreleased_chromium_20261107.cjs
          node -e "const a=require('./test-results/role-d-114-e12-actual-v4-hold-20261107/114-E12-actual-HOLD-report.json');if(a.status!=='HOLD_NEGATIVE_CHROMIUM_16_OF_16_PASS_NOT_UIQA'||a.screenshots.length!==16||a.formalUiqaPassed!==false||a.studentLive!==false||a.interception!==false)throw Error('actual Chromium HOLD mislabeled');console.log('Verified 16 Chromium screenshot SHAs, ZERO formal UIQA PASS')"
      - name: Archive real 8x2 hold screenshots, SHA and browser errors (never formal PASS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-114-e12-actual-Chromium-HOLD-ONLY-${{ github.run_id }}
          path: test-results/role-d-114-e12-actual-v4-hold-20261107/
          if-no-files-found: warn
          retention-days: 14
