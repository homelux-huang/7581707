name: Role D 114 E12 exact official source and B lesson 8x2 V4 QA ONLY
on:
  push:
    branches:
      - qa/role-d-114-e12-source-exact-v4-20261103
  pull_request:
    branches:
      - main
    paths:
      - 'tests/sudu_role_d_114_e12_source_exact_8x2.cjs'
      - '.github/workflows/role-d-114-e12-source-exact-v4.yml'
      - 'docs/ROLE_D_114_E12_SOURCE_EXACT_20261103.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-e12-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original_real_source_e12_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact D branch and syntactically valid source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check tests/sudu_role_d_114_e12_source_exact_8x2.cjs
          node --check sudu/verified-questions-runtime.js
          git diff --exit-code
      - name: Pin immutable ROLE A PR116 actual official source and SHA evidence
        uses: actions/checkout@v4
        with:
          ref: a25a6e43de1a8f8179d84cc2257998d3c4ad4f58
          path: _role_a_e12
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/114/questions.json
            sudu/data/processed/114/webp-manifest.json
            sudu/data/processed/114/webp-v1/00-E
            sudu/data/processed/114/review-evidence/114-00-E-12-official-20261102.json
      - name: Pin immutable ROLE B PR107 actual author JSON and batch
        uses: actions/checkout@v4
        with:
          ref: 57d969888c57fdcd2b16c933e92c7a2c9eebb3a5
          path: _role_b_e12
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025-batch02
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and Noto CJK authentic glyphs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1 | grep -Eq '^Noto (Sans|Serif) CJK'
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: True 114 E12 original WebP and author staged 8x2 V4 (NO RELEASE)
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d114-e12.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/data/approved/114.json >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_114_e12_source_exact_8x2.cjs
      - name: Archive actual screenshot PASS or FAIL and SHA JSON (QA ONLY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-114-E12-real-source-8x2-QA-ONLY-${{ github.run_id }}
          path: test-results/role-d-114-e12-exact-v4/
          if-no-files-found: warn
          retention-days: 14
