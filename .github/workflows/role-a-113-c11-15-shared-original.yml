name: Role A 113 Chinese C11-15 exact shared multi-page and per-question original pixels (NO RELEASE)
on:
  push:
    branches:
      - data/role-a-113-c11-15-shared-20261025
    paths:
      - scripts/role_a_113_c11_15_shared_original.py
      - tests/test_role_a_113_c11_15_shared_original.py
      - docs/ROLE_A_113_C11_15_SHARED_ORIGINAL_20261025.md
      - .github/workflows/role-a-113-c11-15-shared-original.yml
      - sudu/data/processed/113/role-a-c11-15/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: role-a-113-c11-15-shared-exclusive-20261025
  cancel-in-progress: false
jobs:
  shared_original_pixels_and_sql_source_only:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/data/role-a-113-c11-15-shared-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated Role A branch without deploying
        uses: actions/checkout@v4
        with:
          ref: data/role-a-113-c11-15-shared-20261025
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual original-source WebP decoding, not OCR/AI image generation
        run: python -m pip install -q Pillow==11.3.0
      - name: Verify two original archived exam pages and only five questions plus one full reading
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "data/role-a-113-c11-15-shared-20261025"
          python -m py_compile scripts/role_a_113_c11_15_shared_original.py tests/test_role_a_113_c11_15_shared_original.py
          python -m scripts.role_a_113_c11_15_shared_original --apply
          python -m scripts.role_a_113_c11_15_shared_original --verify
          python -m unittest discover -s tests -p test_role_a_113_c11_15_shared_original.py -v
          python -m unittest discover -s tests -p test_role_a_113_c07_10_source_figures.py -v
          python -m unittest discover -s tests -p test_role_a_113_c06_source_diagram.py -v
          python -m unittest discover -s tests -p test_role_a_113_c01_05_source_receipts.py -v
      - name: Commit ONLY eight owned original source WebPs/shared/manifest/five-row SQLite (never main)
        run: |
          set -euo pipefail
          git add -- sudu/data/processed/113/role-a-c11-15/manifest.json
          git add -- sudu/data/processed/113/role-a-c11-15/question-bank.sqlite3
          git add -- sudu/data/processed/113/role-a-c11-15/shared/113-00-C-SHARED-11-15.webp
          git add -- sudu/data/processed/113/role-a-c11-15/webp/113-00-C-11.webp
          git add -- sudu/data/processed/113/role-a-c11-15/webp/113-00-C-12.webp
          git add -- sudu/data/processed/113/role-a-c11-15/webp/113-00-C-13.webp
          git add -- sudu/data/processed/113/role-a-c11-15/webp/113-00-C-14.webp
          git add -- sudu/data/processed/113/role-a-c11-15/webp/113-00-C-15.webp
          expected="$(printf '%s\n' 'sudu/data/processed/113/role-a-c11-15/manifest.json' 'sudu/data/processed/113/role-a-c11-15/question-bank.sqlite3' 'sudu/data/processed/113/role-a-c11-15/shared/113-00-C-SHARED-11-15.webp' 'sudu/data/processed/113/role-a-c11-15/webp/113-00-C-11.webp' 'sudu/data/processed/113/role-a-c11-15/webp/113-00-C-12.webp' 'sudu/data/processed/113/role-a-c11-15/webp/113-00-C-13.webp' 'sudu/data/processed/113/role-a-c11-15/webp/113-00-C-14.webp' 'sudu/data/processed/113/role-a-c11-15/webp/113-00-C-15.webp')"
          changes="$(git diff --cached --name-only)"
          if test -n "$changes"; then
            test "$changes" = "$expected" || { echo 'Only eight own original-source candidate paths may change'; git diff --cached --name-only; exit 1; }
            git diff --cached --check
            test -z "$(git diff --name-only)" || { echo 'Unexpected tracked changes'; exit 1; }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data(role A): 113 C11-15 original shared reading + five source question crops and canonical SQL [NO RELEASE]'
            git push origin HEAD:refs/heads/data/role-a-113-c11-15-shared-20261025
          else
            echo 'IDEMPOTENT SOURCE SHA, no original-source recropping or SQL rewrite'
          fi
          test "$(git ls-remote origin refs/heads/data/role-a-113-c11-15-shared-20261025 | cut -f1)" = "$(git rev-parse HEAD)"
          echo 'No official final correction approval, no independent Role E content signoff, no Pages/main.'
