name: 106 Chinese Q01-Q06 six missing immutable WebP (DRAFT NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/stage_106_chinese_q01_06_missing_webp.py
      - .github/workflows/106-chinese-q01-06-generate-webp-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-106-c-six-immutable
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Strict source sha and exact local-reviewed WebP SHA
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/114-115-official-visual-review"
          python -m py_compile scripts/stage_106_chinese_q01_06_missing_webp.py
          python scripts/stage_106_chinese_q01_06_missing_webp.py --check
      - name: Generate six original-pixel draft files idempotently
        run: |
          set -euo pipefail
          python scripts/stage_106_chinese_q01_06_missing_webp.py --stage
          sha256sum sudu/data/processed/106/qa-drafts/webp-v2/00-C/*.webp > /tmp/first.sha
          python scripts/stage_106_chinese_q01_06_missing_webp.py --stage
          sha256sum sudu/data/processed/106/qa-drafts/webp-v2/00-C/*.webp > /tmp/second.sha
          diff -u /tmp/first.sha /tmp/second.sha
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          base=Path("sudu/data/processed/106/qa-drafts")
          m=json.loads((base/"UNVERIFIED_106_CHINESE_Q01_06_20261023.json").read_text())
          assert len(m["items"])==6 and m["newImageQaPass"]==0 and not m["integrationReady"]
          for x in m["items"]:
              path=Path(x["output"])
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==x["outputSha256"]
          print("PASS: six Chinese WebP drafts with original pixel SHA, image QA not promoted")
          PY
      - name: Commit only new drafts on QA branch
        run: |
          set -euo pipefail
          git config user.name '7581707 QA Drafts'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/106/qa-drafts/webp-v2/00-C/ sudu/data/processed/106/qa-drafts/UNVERIFIED_106_CHINESE_Q01_06_20261023.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(106): six missing Chinese original-question WebP candidates, no approval'
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 106-Chinese-Q01-06-six-WebP-draft-checks
          retention-days: 21
          if-no-files-found: ignore
          path: |
            sudu/data/processed/106/qa-drafts/UNVERIFIED_106_CHINESE_Q01_06_20261023.json
            sudu/data/processed/106/qa-drafts/webp-v2/00-C/
