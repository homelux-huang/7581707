name: Validate 114 TCTE official notice ledger without approving students (NO DEPLOY)
on:
  push:
    branches: [evidence/114-115-tcte-official-notice-20261024]
    paths:
      - sudu/data/processed/114/official-confirmation-status.json
      - sudu/data/processed/114/QA_114_TCTE_OFFICIAL_CONFIRMATION_PDFS_20261024.json
      - scripts/check_tcte_114_confirmation_evidence.py
      - .github/workflows/tcte-114-confirmation-ledger-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice_ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate official notice source, per-question confirmation scope, SHA and fail-closed negatives
        run: python scripts/check_tcte_114_confirmation_evidence.py
