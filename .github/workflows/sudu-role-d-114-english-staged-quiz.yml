name: Role D real 114 English year-quiz QA-only 3x8x2 (NO RELEASE)
on:
  pull_request:
    branches:
      - main
      - integration/114-115-first-batch-v4-receipts-20261025
    paths:
      - 'tests/sudu_role_d_114_english_staged_real_quiz.cjs'
      - '.github/workflows/sudu-role-d-114-english-staged-quiz.yml'
      - 'docs/ROLE_D_114_ENGLISH_STAGED_REAL_QUIZ_20261025.md'
      - 'sudu/v4-115-multisubject-review-demo.html'
      - 'sudu/verified-questions-runtime.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-real114-staged-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  staged_v4_original_question_interaction_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_AUTHOR_CHECKOUT: _role_b_current
      SUDU_D_STAGE_OUT: test-results/role-d-114-english-staged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Ensure exact Role D HEAD and syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check tests/sudu_role_d_114_english_staged_real_quiz.cjs
          git diff --exit-code
      - uses: actions/checkout@v4
        with:
          ref: 32256dd286bd95ea78ae26938cf8184b4ec72949
          path: _role_b_current
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025
      - name: Verify immutable latest Role B author policy and lesson HEAD
        run: |
          set -euo pipefail
          test "$(git -C _role_b_current rev-parse HEAD)" = 32256dd286bd95ea78ae26938cf8184b4ec72949
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual browser, source-image processing and CJK glyph fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1 | grep -Eq '^Noto (Sans|Serif) CJK'
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Build real V4, never publish unapproved real candidates
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d114-staged.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/v4-115-multisubject-review-demo.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_114_english_staged_real_quiz.cjs
      - name: Archive real original-question 48 browser screenshots, exact byte SHA and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-114-original-english-STAGED-QA-${{ github.run_id }}
          path: test-results/role-d-114-english-staged/
          if-no-files-found: warn
          retention-days: 14
