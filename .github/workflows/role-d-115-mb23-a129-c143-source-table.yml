name: ROLE D 115 MathB23 official original 2x3 table PR129 and C143 SHA 16 Chromium QA-only
on:
  push:
    branches:
      - qa/role-d-115-mb23-original-table-8x2-20261104
  pull_request:
    branches:
      - qa/role-d-115-mb23-new-digest-8x2-20261104
    paths:
      - 'tests/sudu_role_d_115_mb23_a129_c143_table_8x2.cjs'
      - '.github/workflows/role-d-115-mb23-a129-c143-source-table.yml'
      - 'docs/ROLE_D_115_MB23_ORIGINAL_TABLE_8X2_20261104.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-115-mb23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original_real_115_mathb23_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_A_DIR: _role_a_115_mb23
      SUDU_D_C_DIR: _role_c_115_mb23
      SUDU_D_TABLE_DIR: _role_a_115_mb23_table
      SUDU_D_OUT: test-results/role-d-115-mb23-new-digest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin D current unique V4 and javascript test exact HEAD
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check tests/sudu_role_d_115_mb23_a129_c143_table_8x2.cjs
          node --check sudu/verified-questions-runtime.js
          git diff --exit-code
      - name: Read immutable original 115 MB23 p8 2x3 table WebP and historical official answers
        uses: actions/checkout@v4
        with:
          ref: fbd7756b995e3d27dc31a99ecc54fe66af4d82c6
          path: _role_a_115_mb23
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/115/questions.json
            sudu/data/processed/115/webp-manifest.json
            sudu/data/processed/115/webp-v2/00-MB
            sudu/data/processed/115/QA_115_MATH_B_Q01_25_OFFICIAL_FINAL_ANSWERS_20261023.json
      - name: Pin immutable ROLE C PR143 MB23 table-revision-author SHA
        uses: actions/checkout@v4
        with:
          ref: afaba171eec77cc27c3171b8bc8282f68ade74b9
          path: _role_c_115_mb23
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-115-20261025
      - name: Pin immutable A PR129 original 2x3 table source and official-answer SHA evidence
        uses: actions/checkout@v4
        with:
          ref: cd6fea6682554e4b0f25d41dca79a1532de92482
          path: _role_a_115_mb23_table
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/115/review-evidence/115-00-MB-23-table-source-20261103.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine Chromium and Traditional Chinese fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1 | grep -Eq '^Noto (Sans|Serif) CJK'
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Check real approved 5 and launch MB23 2x3 source-table 16 Chrome cases QA-only
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d-115-mb23.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/data/approved/115.json >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_115_mb23_a129_c143_table_8x2.cjs
      - name: Archive QA-only screenshots and source-digest JSON even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-115-MB23-16SCREEN-TABLE-A129-C143-QA-ONLY-${{ github.run_id }}
          path: test-results/role-d-115-mb23-new-digest/
          if-no-files-found: warn
          retention-days: 14
