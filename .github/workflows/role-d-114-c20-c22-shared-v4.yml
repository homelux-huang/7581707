name: Role D 114 C20-C22 ORIGINAL shared reading V4 3x8x2 and negative routing
on:
  push:
    branches:
      - qa/role-d-114-c20-c22-shared-v4-20261026
  pull_request:
    branches:
      - qa/role-d-114-e11-e13-e14-pr94-source-v4-20261026
    paths:
      - 'sudu/v4-115-multisubject-review-demo.html'
      - 'sudu/verified-questions-runtime.js'
      - 'tests/sudu_role_d_114_c20_c22_shared_original_v4.cjs'
      - '.github/workflows/role-d-114-c20-c22-shared-v4.yml'
      - 'docs/ROLE_D_114_C20_22_SHARED_ORIGINAL_V4_20261026.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-114-chinese-shared-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real_source_114_chinese_shared_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_A_CHECKOUT: _role_a_chineseoriginal
      SUDU_D_B_CHECKOUT: _role_b_chinese20
      SUDU_D_OUT: test-results/role-d-114-c20-22-shared-v4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source exact D head/HTML/runtime syntax before browser
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check sudu/verified-questions-runtime.js
          node --check tests/sudu_role_d_114_c20_c22_shared_original_v4.cjs
          git diff --exit-code
      - name: Pin original ROLE B full Chinese teacher-child lessons source
        uses: actions/checkout@v4
        with:
          ref: 4e8b3065d7f1b0e71eba0928a6f5fe002ea25852
          path: _role_b_chinese20
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025-batch05
      - name: Pin real original ROLE A archived pixel source single and shared WebPs
        uses: actions/checkout@v4
        with:
          ref: 9944759e339ef2d3c002042798f7fe696d861d96
          path: _role_a_chineseoriginal
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/114/webp-v1/00-C
            sudu/data/processed/114/webp-v2/shared
            sudu/data/processed/114/qa-drafts/DIRECT_VISUAL_114_C19_23_SHARED_20261023.json
            sudu/data/original/114/00-C
      - name: Assert exact imported original A/B HEADs and full 205 original bank
        run: |
          set -euo pipefail
          test "$(git -C _role_b_chinese20 rev-parse HEAD)" = 4e8b3065d7f1b0e71eba0928a6f5fe002ea25852
          test "$(git -C _role_a_chineseoriginal rev-parse HEAD)" = 9944759e339ef2d3c002042798f7fe696d861d96
          test -f sudu/data/processed/114/questions.json
          test -f sudu/data/processed/114/webp-manifest.json
      - name: Install or verify authentic zh-TW CJK font (fail-closed)
        run: |
          set -euo pipefail
          echo "fonts-install-start-$(date -u +%FT%TZ)"
          family="$(fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1)"
          if ! printf '%s\n' "$family" | grep -Eq '^Noto (Sans|Serif) CJK'; then
            timeout 180s sudo apt-get update -qq
            timeout 180s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fi
          family="$(fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1)"
          printf 'ACTUAL zh-TW original glyph family: %s\n' "$family"
          printf '%s\n' "$family" | grep -Eq '^Noto (Sans|Serif) CJK'
          echo "fonts-install-end-$(date -u +%FT%TZ)"
      - name: Install real pinned Playwright and browser with bounded network time
        run: |
          set -euo pipefail
          echo "playwright-install-start-$(date -u +%FT%TZ)"
          timeout 180s npm install --no-save --prefer-offline playwright@1.51.1
          timeout 180s npx playwright install --only-shell chromium
          timeout 180s python -m pip install -q pillow
          python -c 'from PIL import Image; print("Original WebP decoder ready: Pillow",Image.__version__)'
          echo "playwright-install-end-$(date -u +%FT%TZ)"
      - name: Existing publisher check and REAL A-B original WebP and shared source V4
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d-chinese20.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/v4-115-multisubject-review-demo.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_114_c20_c22_shared_original_v4.cjs
          # Changed original annual runtime: prove the five real pre-approved
          # 115 Math B students still render every AUTHORED full equation
          # using untouched authentic HTTP /approved/115.json (NO intercept).
          SUDU_D_REAL_OUT=test-results/role-d-114-c20-22-shared-v4/regression-115-existing node tests/sudu_role_d_115_mathb_real_approved_8x2.cjs
      - name: Archive 48 original Chinese shared QA PNG + 5 negative and 80 genuine unchanged 115 original maths PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-114-C20-C22-SHARED-UNPUBLISHED-${{ github.run_id }}
          path: test-results/role-d-114-c20-22-shared-v4/
          if-no-files-found: warn
          retention-days: 14
