name: 128 teaching drafts read-only QA (NO RELEASE)
on:
  push:
    branches:
      - draft/preview-128-explanations-20261023
    paths:
      - scripts/audit_preview_teaching_drafts.py
      - scripts/audit_preview_128_release_readiness.py
      - scripts/audit_preview_128_teaching_candidates.py
      - tests/test_preview_128_teaching_candidates.py
      - tests/test_preview_128_news_dates.py
      - tests/test_preview_128_math_b_partial.py
      - tests/sudu_verified_teaching_markup_test.cjs
      - sudu/verified-questions-runtime.js
      - sudu/teaching-drafts/preview-128-20261023/**
      - sudu/data/approved/webp/**
      - .github/workflows/sudu-preview-128-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Original images, official answers and fail-closed QA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify structural draft and step-bundle integrity
        run: python scripts/audit_preview_teaching_drafts.py
      - name: Verify all original WebPs, shared passages and explicit release gates
        run: python scripts/audit_preview_128_release_readiness.py
      - name: Test source-backed news three-year dating rule
        run: python -m unittest discover -s tests -p 'test_preview_128_news_dates.py' -v
      - name: Synthetic fail-closed individual release certificate regressions
        run: python -m unittest discover -s tests -p 'test_preview_128_teaching_candidates.py' -v
      - name: Dry-run per-question teaching release eligibility (no write)
        run: python scripts/audit_preview_128_teaching_candidates.py
      - name: Check all 25 Math B partial QA evidence and 7 reference calculations
        run: python -m unittest discover -s tests -p 'test_preview_128_math_b_partial.py' -v
      - name: Oct 24 self-reviewed content regression, no release
        run: python -m unittest discover -s tests -p 'test_preview_128_oct24_content.py' -v
      - name: Verify V4 escaped teaching markup and real keyword highlights
        run: node tests/sudu_verified_teaching_markup_test.cjs
      - name: Check teaching steps JavaScript syntax
        run: node --check sudu/teaching-drafts/preview-128-20261023/solution-steps-128.js
