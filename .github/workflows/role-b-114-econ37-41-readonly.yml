    paths:
      - 'sudu/teaching-candidates/114-role-b-econ37-41-20261104/**'
      - 'tests/test_role_b_114_econ37_41_20261104.py'
      - '.github/workflows/role-b-114-econ37-41-readonly.yml'
  workflow_dispatch:
jobs:
  author-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
