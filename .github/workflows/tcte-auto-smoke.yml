name: Import TCTE exam PDF data (smoke)
on:
  push:
    paths:
      - scripts/tcte_auto.py
      - .github/workflows/tcte-auto-smoke.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          python -m pip install -q requests beautifulsoup4 pymupdf pytesseract pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra > /dev/null
      - name: Download and parse real official PDFs
        run: python scripts/tcte_auto.py --years 114 100 90
      - name: Commit import results
        run: |
          git config user.name "7581707 TCTE import bot"
          git config user.email "7581707-bot@users.noreply.github.com"
          git add sudu/data/years/
          git diff --cached --quiet || (git commit -m "Add official exam extraction audit for 114 100 90" && git push)
