name: ROLE A 114+115 410 candidate MB25/E03/econ34 read-only source audit (NO RELEASE)
on:
  push:
    branches: [audit/role-a-114115-mb25-readonly-20261114]
    paths:
      - scripts/role_a_114115_mb25_gap_readonly_20261114.py
      - .github/workflows/role-a-114115-mb25-readonly-audit-20261114.yml
permissions:
  contents: read
jobs:
  two_years_actual_source_readonly:
    if: github.repository == 'homelux-huang/7581707'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/114
            sudu/data/processed/115
            sudu/data/original/115/00-MB
            sudu/data/original/115/00-MB-answers
            scripts
            .github/workflows
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read frozen ROLE A PR157 original image/G2/G3 stage, no writes
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 24decc38c6e16e2a22b6204207db1922ce1a1ee8
          path: _role_a_original_stage
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/115/source-stage
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebP pixel decoder only, no AI provider API
        run: python -m pip install -q pillow
      - name: Enforce exact frozen official QA parent and read-only checkout
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4e365a75ed98e73223987d81041693a476196881 HEAD
          test "$(git rev-parse HEAD:sudu/data/processed/115/questions.json)" = "$(git rev-parse 4e365a75ed98e73223987d81041693a476196881:sudu/data/processed/115/questions.json)"
          test "$(git rev-parse HEAD:sudu/data/processed/115/question-bank.sqlite3)" = "$(git rev-parse 4e365a75ed98e73223987d81041693a476196881:sudu/data/processed/115/question-bank.sqlite3)"
      - name: Read actual 410 candidate source / 205 each DB / original MB24+25 pixel and source G2 gap
        run: |
          set -euo pipefail
          python scripts/role_a_114115_mb25_gap_readonly_20261114.py
      - name: Assert no historical JSON SQLite/manifest/source file modified
        run: |
          set -euo pipefail
          git diff --exit-code -- sudu/data/processed/114 sudu/data/processed/115
          git diff --cached --exit-code -- sudu/data/processed/114 sudu/data/processed/115
          test -z "$(git status --porcelain -- sudu/data/processed/114 sudu/data/processed/115)"
          echo "NO source/SQLite/manifest mutation and no Q24/25 lease collision"
      - name: Publish read-only audit report as workflow artifact, not source or READY
        uses: actions/upload-artifact@v4
        with:
          name: role-a-114115-mb25-gap-readonly-report
          path: _audit_reports/role-a-mb25-readonly-gap-report.json
          retention-days: 30
          if-no-files-found: error
