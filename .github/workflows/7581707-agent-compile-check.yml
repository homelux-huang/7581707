name: Compile 7581707 GH-AW Codex source (isolated / no inference)
on:
  push:
    branches:
      - coord/7581707-gh-aw-real-compile-20261025
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile-codex-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Check Codex authentication secret presence (boolean only, no secret value)
        env:
          CODEX_PRESENT: ${{ secrets.CODEX_API_KEY != '' }}
          OPENAI_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          echo "CODEX_API_KEY_CONFIGURED=$CODEX_PRESENT"
          echo "OPENAI_API_KEY_CONFIGURED=$OPENAI_PRESENT"
          if [ "$CODEX_PRESENT" != "true" ] && [ "$OPENAI_PRESENT" != "true" ]; then
            echo "MODEL_INFERENCE_NOT_CONFIGURED_NO_SECRETS_AVAILABLE"
          fi
      - name: Install official gh-aw CLI extension without API model key
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw
      - name: Record compiler exact version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw version
      - name: Compile only role-agent Codex workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile 7581707-role-agent --no-check-update
      - name: Reject unreviewed write scopes and show exact permission context
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/7581707-role-agent.lock.yml"
          test -s "$FILE"
          echo "Compiled lock: $(wc -c < "$FILE") bytes"
          python3 - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/7581707-role-agent.lock.yml").read_text()
          assert len(s)>500, "Compiler result missing"
          lines=s.splitlines()
          forbidden={"contents: write","pull-requests: write","issues: write"}
          privileged=[(i+1,line.strip()) for i,line in enumerate(lines) if line.strip() in forbidden]
          for num,scope in privileged:
              print("UNEXPECTED WRITE PERMISSION at line",num,scope,flush=True)
              for near in lines[max(0,num-13):num+4]:
                  print(near[:160],flush=True)
          assert not privileged, "Generated lock grants write operations"
          assert "CODEX_API_KEY" in s or "OPENAI_API_KEY" in s, "Codex secret hook missing"
          assert "codex" in s.lower(), "Codex engine reference missing"
          print("PASS read-only compiler and Codex engine authorization contract")
          PY
      - name: Preserve generated lock for independent inspection, even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh-aw-compiled-codex-lock-${{ github.sha }}
          path: .github/workflows/7581707-role-agent.lock.yml
          if-no-files-found: warn
          retention-days: 7

  register-compiled-lock-blob:
    # Separate write-scoped job; the compiler, external gh-aw installation and AI
    # source all execute with READ-ONLY GitHub permissions in the prior job.
    needs: compile-codex-lock
    if: needs.compile-codex-lock.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download independently verified compiled YAML only
        uses: actions/download-artifact@v4
        with:
          name: gh-aw-compiled-codex-lock-${{ github.sha }}
          path: compiled
      - name: Register inert Git Blob without modifying any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          file=Path("compiled/7581707-role-agent.lock.yml")
          blob=file.read_bytes()
          s=blob.decode("utf-8")
          assert len(blob)>500 and s.startswith("# gh-aw-metadata:")
          assert "gh-aw-manifest:" in s
          assert "CODEX_API_KEY" in s or "OPENAI_API_KEY" in s
          for line in s.splitlines():
              assert line.strip() not in {"contents: write","issues: write","pull-requests: write"}, "Unexpected write privilege in compiled agent"
          assert os.environ["GITHUB_REPOSITORY"]=="homelux-huang/7581707"
          digest=hashlib.sha256(blob).hexdigest()
          git_blob_hash=hashlib.sha1(b"blob "+str(len(blob)).encode()+bytes([0])+blob).hexdigest()
          import base64
          request=Request("https://api.github.com/repos/homelux-huang/7581707/git/blobs",
              data=json.dumps({"content":base64.b64encode(blob).decode(),"encoding":"base64"}).encode(),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urlopen(request, timeout=25) as response:
              result=json.load(response)
          assert result.get("sha")==git_blob_hash, "GitHub blob identity mismatch"
          print("EXACT_SOURCE_COMMIT="+os.environ["GITHUB_SHA"])
          print("COMPILED_BINARY_SHA256="+digest)
          print("GH_AW_COMPILED_GIT_BLOB_SHA="+result["sha"])
          print("REGISTERED_GIT_BLOB_ONLY_NO_MAIN_OR_BRANCH_MUTATION")
          PY
