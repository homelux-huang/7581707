name: ROLE A MB24 exact original native source and 205x14 parity (NO RELEASE)
on:
  push:
    branches: [source/role-a-mb24-admission-20261114]
  pull_request:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/role_a_115_mb24_source_admission_20261114.py
      - tests/test_role_a_115_mb24_source_admission_20261114.py
      - .github/workflows/role-a-115-mb24-source-admission-20261114.yml
      - sudu/data/processed/115/**
permissions:
  contents: read
jobs:
  native_mb24_source_only:
    if: github.event_name == 'push' || github.head_ref == 'source/role-a-mb24-admission-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            sudu/data/processed/115
            sudu/data/original/115/00-MB
            sudu/data/original/115/00-MB-answers
      - uses: actions/checkout@v4
        with:
          ref: 5546a603abfe0af2e62c0e5f63f775be0bfb24cf
          path: _publisher_main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pillow
      - name: Native original source positive/negative and whole SQLite projection checks
        env:
          PUBLISHER_CHECKER_PATH: ${{ github.workspace }}/_publisher_main/scripts/sudu_verified_publish.py
          MB24_FROZEN_SOURCE_ADMISSION: '1'
        run: |
          python scripts/role_a_115_mb24_source_admission_20261114.py
          python -m unittest discover -s tests -p 'test_role_a_115_mb24_source_admission_20261114.py' -v
      - name: Verify no approved, trust, teaching or UI modification
        run: |
          git diff --name-only 4e365a75ed98e73223987d81041693a476196881 HEAD > /tmp/mb24-paths
          if grep -E '^sudu/(data/approved|release-governance|teaching-candidates|v4)' /tmp/mb24-paths; then exit 1; fi
          git diff --exit-code
          git diff --cached --exit-code
