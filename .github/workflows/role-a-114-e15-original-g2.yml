name: ROLE A 114 English E15 original source G2 D footer correction (NO RELEASE)
on:
  push:
    branches: [qa/role-a-114-e15-crosspage-g2-source-stage-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_q15_source:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-114-e15-crosspage-g2-source-stage-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify immutable original pixels, raw D correction, official A and negative gates
        run: |
          set -euo pipefail
          python -m py_compile tests/test_role_a_114_e15_source_g2_20261104.py
          python -m unittest discover -s tests -p test_role_a_114_e15_source_g2_20261104.py -v
      - name: No mutation or release
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
