name: 114-115 three source-pixel crop defect candidates (DRAFT, NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/stage_114_115_direct_source_crop_repairs_20261023.py
      - .github/workflows/114-115-crop-defect-draft-candidates.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-114-115-immutable-draft-crop-repairs
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pixel handling
        run: python -m pip install --quiet 'Pillow>=10,<12'
      - name: Syntax and immutable source SHA preflight
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/114-115-official-visual-review"
          python -m py_compile scripts/stage_114_115_direct_source_crop_repairs_20261023.py
          python scripts/stage_114_115_direct_source_crop_repairs_20261023.py --check
      - name: Generate three draft-only crops and prove idempotence
        run: |
          set -euo pipefail
          python scripts/stage_114_115_direct_source_crop_repairs_20261023.py --stage
          sha256sum sudu/data/processed/114/qa-drafts/webp-v2/00-C/114-00-C-01.webp \
            sudu/data/processed/115/qa-drafts/webp-v3/00-C/115-00-C-{16,17}.webp \
            sudu/data/processed/114/qa-drafts/CROP_REPAIRS_114C01_115C16_17_V20261023.json > /tmp/qa-crop-before.sha
          python scripts/stage_114_115_direct_source_crop_repairs_20261023.py --stage
          sha256sum sudu/data/processed/114/qa-drafts/webp-v2/00-C/114-00-C-01.webp \
            sudu/data/processed/115/qa-drafts/webp-v3/00-C/115-00-C-{16,17}.webp \
            sudu/data/processed/114/qa-drafts/CROP_REPAIRS_114C01_115C16_17_V20261023.json > /tmp/qa-crop-after.sha
          diff -u /tmp/qa-crop-before.sha /tmp/qa-crop-after.sha
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("sudu/data/processed/114/qa-drafts/CROP_REPAIRS_114C01_115C16_17_V20261023.json")
          o=json.loads(f.read_text())
          assert len(o["items"])==3 and o["newImageQaPass"]==0
          assert all(x["imageQaStatus"]=="PENDING_DIRECT_VISUAL_REVIEW" for x in o["items"])
          for y in (114,115):
              root=Path(f"sudu/data/processed/{y}")
              q=json.loads((root/"questions.json").read_text())
              assert all(not x.get("integrationReady") for x in q["questions"])
          print("PASS: pixel repair drafts SHA stable; release blocked; visual QA pending")
          PY
      - name: Commit immutable draft WebP only on QA branch (no main)
        run: |
          set -euo pipefail
          git config user.name "7581707 Crop QA Candidate"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add -- sudu/data/processed/114/qa-drafts/webp-v2/00-C/114-00-C-01.webp \
            sudu/data/processed/115/qa-drafts/webp-v3/00-C/115-00-C-{16,17}.webp \
            sudu/data/processed/114/qa-drafts/CROP_REPAIRS_114C01_115C16_17_V20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "data(114,115): immutable three repair WebP candidates, no visual QA PASS"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 114-115-three-crop-drafts-require-direct-review
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/114/qa-drafts/webp-v2/00-C/114-00-C-01.webp
            sudu/data/processed/115/qa-drafts/webp-v3/00-C/*.webp
            sudu/data/processed/114/qa-drafts/CROP_REPAIRS_114C01_115C16_17_V20261023.json
