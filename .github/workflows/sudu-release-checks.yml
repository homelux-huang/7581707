name: Sudu release gates
on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    name: Same-commit unit, corpus, privacy and Chromium tests
    # Pin to an OS supported by Playwright 1.51.1.
    # ubuntu-latest moved to Ubuntu 26.04 and caused browser installation to fail
    # before any UI test could run.
    runs-on: ubuntu-24.04
    # The official Noto CJK package is 61.2 MB. Ubuntu mirrors have taken
    # ~16 minutes to deliver it; keep Chinese text coverage and all QA gates.
    # A longer runner cap prevents the asset-download step from falsely
    # cancelling valid 35-question/114-115 Chromium release verification.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install -q pillow requests beautifulsoup4 pymupdf cryptography
      - name: Validate syntax, student-history compatibility, scoring and privacy
        run: |
          python scripts/check_sudu.py
          python scripts/sudu_verified_publish.py check
          python -m unittest discover -s tests -p 'test_sudu_verified_publish.py' -v
          node --check sudu/verified-questions-runtime.js
          for file in sudu/*.js; do node --check "$file"; done
          node --test tests/share.test.cjs
          node tests/sudu_scoring_test.cjs
          node tests/sudu_score_feedback_test.cjs
          node tests/sudu_dashboard_test.cjs
          node tests/sudu_countdown_test.cjs
          python -m unittest discover -s backend/tests -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit official corpus and original-image mappings
        run: |
          python scripts/check_tcte_corpus.py --decode-images
      - name: Install Playwright Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save playwright@1.51.1
          # All tests launch Chromium in headless-shell mode. GitHub's
          # ubuntu-24.04 runner already has the Chromium runtime libraries;
          # --with-deps performs a second large apt install (unused fonts)
          # and has repeatedly stalled the release gate.
          # Keep Noto CJK font installation above for Chinese text layout.
          npx playwright install --only-shell chromium
          node -e "const p=require('playwright'); p.chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close())"
      - name: Verify Chromium UI and real WebP on this commit
        env:
          SUDU_TEST_OUTPUT: test-results
        run: |
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/sudu-test-server.log 2>&1 &
          trap 'kill $!' EXIT
          node tests/sudu_browser_smoke.cjs
          node tests/sudu_demo_acceptance.cjs
          node tests/sudu_verified_integration_browser.cjs
          node tests/sudu_certified_positive_browser.cjs
          node tests/sudu_workspace_test.cjs
          node tests/sudu_admin_browser.cjs
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudu-release-evidence-${{ inputs.target_sha }}
          if-no-files-found: ignore
          path: |
            test-results/
            /tmp/sudu-test-server.log
