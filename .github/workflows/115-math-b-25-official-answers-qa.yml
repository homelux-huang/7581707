name: 115 Math B 25 final answers and no-objection QA (G3 ONLY, NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/apply_115_math_b_q01_25_official_final_answers.py
      - .github/workflows/115-math-b-25-official-answers-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-115-math-b-25-final-answers
  cancel-in-progress: false
jobs:
  math-b-qa:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Match all 25 Math B answers to published final TCTE image and no-objection notice
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_115_math_b_q01_25_official_final_answers.py
          python scripts/apply_115_math_b_q01_25_official_final_answers.py --check
      - name: Apply math B 25 G3 flags, prove isolated SQLite and second-run SHA stability
        run: |
          set -euo pipefail
          python scripts/apply_115_math_b_q01_25_official_final_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/math-b-before
          python scripts/apply_115_math_b_q01_25_official_final_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/math-b-after
          diff -u /tmp/math-b-before /tmp/math-b-after
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("sudu/data/processed/115")
          inv=json.loads((root/"inventory.json").read_text())
          bank=json.loads((root/"questions.json").read_text())
          answers=json.loads((root/"official-answer-evidence.json").read_text())
          assert inv["officialAnswerIndependentVerified"]==81
          assert answers["answerVerifiedCount"]==81
          assert inv["perSubject"]["數學B"]["officialAnswerIndependentlyVerified"]==25
          assert sum(x.get("answerVerified") is True for x in bank["questions"])==81
          assert inv["imageVisualQaPass"]==143
          assert json.loads((root/"release-manifest.json").read_text())["releaseAllowed"] is False
          assert all(not x.get("integrationReady") for x in bank["questions"])
          print("PASS: 115 Math B final 25 G3 independently verified; release forbidden")
          PY
      - name: Commit Math B answer QA and isolation DB only
        run: |
          set -euo pipefail
          git config user.name "7581707 Math B Answer QA"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add -- sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3}
          if ! git diff --cached --quiet; then
            git commit -m "qa(115): Math B 25 final official answers verified SHA + no objection, no release"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 115-MathB-25-final-answer-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/115/QA_115_MATH_B_Q01_25_OFFICIAL_FINAL_ANSWERS_20261023.json
            sudu/data/processed/115/release-manifest.json
