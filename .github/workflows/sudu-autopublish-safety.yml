name: Sudu QA admission safety tests
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/sudu_verified_publish.py
      - tests/test_sudu_verified_publish.py
      - .github/workflows/sudu-verified-autopublish.yml
      - .github/workflows/sudu-autopublish-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-admission-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pillow
      - run: python -m unittest discover -s tests -p 'test_sudu_verified_publish.py' -v
      - run: python scripts/sudu_verified_publish.py check
