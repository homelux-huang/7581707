name: Audited 104 extra plus 105-115 exact numbered asset coverage (NO RELEASE)
on:
  push:
    branches:
      - qa/114-115-official-visual-review
    paths:
      - scripts/audit_104_115_numbered_assets.py
      - .github/workflows/104-115-numbered-asset-audit.yml
      - sudu/data/processed/*/inventory.json
      - sudu/data/processed/*/webp-manifest.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-104-115-numbered-gap-inventory
  cancel-in-progress: false
jobs:
  exact_numbered_inventory:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin inspected HEAD and audit all existing official-source candidate identifiers
        run: |
          echo "QA_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python scripts/audit_104_115_numbered_assets.py --write
      - name: Validate report counts and explicit NO RELEASE
        run: |
          python - <<'PY_AUDIT'
          import json
          from pathlib import Path
          p=Path('sudu/data/processed/104-115-QUESTION_ID_GAPS_20261024.json')
          j=json.loads(p.read_text(encoding='utf8'))
          assert len(j['years'])==12 and j['years'][0]['year']==104
          assert j['totals']['candidateQuestions105_115']==2249
          y110=next(y for y in j['years'] if y['year']==110)
          assert y110['papers']['09-1']['excludedHistoricalFalsePositiveIds']==['110-09-1-80']
          assert j['totals']['webpLinkedAndShaVerified105_115'] + j['totals']['missingWebp105_115'] == j['totals']['candidateQuestions105_115']
          assert 0 <= j['totals']['webpQaPassWithReference105_115'] <= j['totals']['webpLinkedAndShaVerified105_115']
          assert j['totals']['readyYears']==0
          assert j['totals']['g5PassYears105_115']==11
          assert j['noNewQAFlagsOrAnswerFlagsSet'] is True and j['notForRelease'] is True
          assert all(y.get('integrationReady') is False for y in j['years'])
          for y in j['years'][1:]:
              assert sum(p['legacyCandidateCount'] for p in y['papers'].values())==y['questionJsonRows']
          print('104 extra + 105-115 exact question-ID inventory PASS; no release')
          PY_AUDIT
      - name: Commit report-only with nonforce, latest HEAD lease
        run: |
          set -eu
          git add docs/SUDU_104_115_NUMBERED_QUESTION_ASSET_AUDIT_20261024.md
          git add sudu/data/processed/104-115-QUESTION_ID_GAPS_20261024.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin qa/114-115-official-visual-review
          if [ "$(git rev-parse FETCH_HEAD)" != "$QA_BASE" ]; then
            echo "Other session changed QA HEAD; refuse unleased write"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(qa): persist per-paper 104-115 question gaps WebP OCR QA and G5 audit"
          git push origin HEAD:refs/heads/qa/114-115-official-visual-review
