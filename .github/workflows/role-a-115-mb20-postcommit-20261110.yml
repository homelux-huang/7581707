name: ROLE A 115 MB20 exact-head original v5 G1 G2 G3 source 205 SQLite 204 immutability (NO RELEASE)
on:
  push:
    branches: [qa/role-a-115-mb20-canonical-v5-20261110]
    paths:
      - .github/workflows/role-a-115-mb20-postcommit-20261110.yml
      - sudu/data/processed/115/questions.json
      - sudu/data/processed/115/question-bank.sqlite3
      - sudu/data/processed/115/inventory.json
      - sudu/data/processed/115/webp-manifest.json
permissions:
  contents: read
jobs:
  real_v5_mb20_205_final_head:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/115
            sudu/data/original/115/00-MB
            sudu/data/original/115/00-MB-answers
            scripts
            docs
            tests
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 5546a603abfe0af2e62c0e5f63f775be0bfb24cf
          path: _publisher_main
          persist-credentials: false
          sparse-checkout: |
            scripts
            sudu/release-governance
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pillow
      - name: Actual publisher native original v5 WebP, G2/G3 and true negative mutants
        run: |
          set -euo pipefail
          python scripts/role_a_115_mb20_source_v5_admission_20261110.py --verify
      - name: Compare original other 204 canonical AND entire SQLite row tuples plus 204 manifests
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,sqlite3,subprocess,tempfile,pathlib
          parent='24f8962b7fb51a8baa6f111abb1a7414a4b26420'
          prefix='sudu/data/processed/115/'
          def original(name): return subprocess.check_output(['git','show',parent+':'+prefix+name])
          old=json.loads(original('questions.json'))['questions']
          new=json.loads(pathlib.Path(prefix+'questions.json').read_bytes())['questions']
          assert len(old)==len(new)==205
          a={x['questionId']:x for x in old};b={x['questionId']:x for x in new}
          assert set(a)==set(b)
          target='115-00-MB-20'
          assert [qid for qid in a if a[qid]!=b[qid]]==[target]
          assert b[target]['questionVerified'] is True and b[target]['officialFinalAnswer']=='A'
          assert b[target]['options']==['50(√3＋1)','50(√3－1)','20(√3＋1)','20(√3－1)']
          assert all(a[qid]==b[qid] for qid in ('115-00-MB-21','115-00-MB-22','115-00-MB-23'))
          assert len(b['115-00-MB-23']['tables'][0]['rows'])==2
          o={x['questionId']:x for x in json.loads(original('webp-manifest.json'))['items']}
          n={x['questionId']:x for x in json.loads(pathlib.Path(prefix+'webp-manifest.json').read_bytes())['items']}
          assert len(o)==len(n)==205 and set(o)==set(n)
          assert [qid for qid in o if o[qid]!=n[qid]]==[target]
          assert n[target]['sha256']=='f9e68d9c5777f25464c9df59329659e94c58dd33d2eb9ba9aa418a30055cdedf'
          assert n[target]['visualDefectHistory']['finding']=='previous_candidate_missing_figure_IV_lower_edge_and_caption'
          assert n[target]['originalIndependentSourceVisualRecheck']['evidenceDocGitBlob']=='51035f72487f24bb19ebcbd1a507f8d1b0dead22'
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/'before.sqlite3';p.write_bytes(original('question-bank.sqlite3'))
              with sqlite3.connect(p) as c:
                  assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
                  left={x[0]:x[1:] for x in c.execute('SELECT * FROM questions')}
              with sqlite3.connect(prefix+'question-bank.sqlite3') as c:
                  assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
                  cols=c.execute('PRAGMA table_info(questions)').fetchall()
                  right={x[0]:x[1:] for x in c.execute('SELECT * FROM questions')}
                  raw=c.execute('SELECT question_id,payload_json,payload_sha256 FROM questions').fetchall()
              assert len(cols)==14 and len(left)==len(right)==len(raw)==205
              assert [qid for qid in left if left[qid]!=right[qid]]==[target]
              assert all(json.loads(payload)==b[qid] and hashlib.sha256(payload.encode()).hexdigest()==sha for qid,payload,sha in raw)
          inv=json.loads(pathlib.Path(prefix+'inventory.json').read_bytes())['sqlite']
          assert inv['releaseApproved'] is False
          for key,filename in [('sourceQuestionsSha256','questions.json'),('dbSha256','question-bank.sqlite3')]:
              assert hashlib.sha256(pathlib.Path(prefix+filename).read_bytes()).hexdigest()==inv[key]
          receipt=json.loads(pathlib.Path(prefix+'review-evidence/115-00-MB-20-v5-source-admission-20261110.json').read_bytes())
          assert receipt['formalETrust'] is False and receipt['formalDRealEmitter16'] is False and receipt['studentReady'] is False and receipt['newLive'] is False
          print('MB20 source-only G1 original v5 zero-pixel diff, 205 JSON+DB parity, 204 original entire SQLite tuples AND manifest objects unchanged, Q23 2x3 preserved; NO READY/LIVE')
          PY
      - name: Strict source-only whitelist relative to MB23 parent and immutable checkout
        run: |
          set -euo pipefail
          git diff --name-only 24f8962b7fb51a8baa6f111abb1a7414a4b26420 HEAD > /tmp/paths
          if grep -E '^sudu/(data/approved|release-governance)|^sudu/data/processed/114|^sudu/v4' /tmp/paths; then exit 1; fi
          git diff --exit-code
          git diff --cached --exit-code
          echo 'STRICT SOURCE ONLY, NOT TRUST, NOT STUDENT READY, NOT LIVE'

# Repeat exact-head source-only verification after cross-role handoff document update (2026-11-13).
