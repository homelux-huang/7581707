name: Original TCTE PDF images - NO OCR
on:
  push:
    paths:
      - .github/workflows/tcte-full-import.yml
      - scripts/tcte_source_images.py
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tcte-corpus-update
  cancel-in-progress: false
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF rendering tools only - no OCR engines
        run: python -m pip install -q requests pymupdf pillow
      - name: Verify rendering stays free of OCR engines
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          source=Path('scripts/tcte_auto.py').read_text('utf-8')
          assert 'pytesseract' not in source and 'image_to_string' not in source
          PYCODE
          python -m py_compile scripts/tcte_auto.py scripts/tcte_source_images.py
      - name: Render official 90-115 originals without changing questions, answers or student IDs
        run: python scripts/tcte_source_images.py --years $(seq 90 115)
      - name: Recompute corpus provenance and decode every referenced image
        run: |
          python scripts/tcte_manifest.py
          python scripts/check_tcte_corpus.py --decode-images --json sudu/data/corpus-audit.json --markdown docs/SUDU_CORPUS_AUDIT.md
      - name: Stage compact WebP originals in an isolated candidate branch
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: automation/tcte-original-image-candidate
        run: |
          set -euo pipefail
          git config user.name '7581707 original PDF image bot'
          git config user.email '7581707-bot@users.noreply.github.com'
          git add sudu/data/original sudu/data/years sudu/data/index.json sudu/data/corpus-audit.json docs/SUDU_CORPUS_AUDIT.md
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Stage rendered original TCTE PDF pages for review'
          remote_sha="$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$remote_sha" origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Open or retain a Draft PR for source review
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.stage.outputs.branch }}
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$CANDIDATE_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            printf '%s\n' \
              'This automated candidate contains rendered official-source images and corpus audit output only.' \
              '' \
              'It is intentionally a Draft PR. Review source provenance, image integrity and the audit before normal protected-main integration. Its existence is not per-question G1, READY or deployment approval. Pages is not dispatched from the import workflow.' \
              > /tmp/tcte-pr-body.md
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$CANDIDATE_BRANCH" --title 'Stage official TCTE source-image corpus update' --body-file /tmp/tcte-pr-body.md
          else
            echo "Retaining existing Draft PR #$number for $CANDIDATE_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-image-report
          path: |
            sudu/data/original/index.json
            sudu/data/corpus-audit.json
            docs/SUDU_CORPUS_AUDIT.md

