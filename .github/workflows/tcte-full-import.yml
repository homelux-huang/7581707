name: 7581707 official TCTE 90-115 question sync
on:
  push:
    paths:
      - .github/workflows/tcte-full-import.yml
      - scripts/tcte_auto.py
      - scripts/tcte_manifest.py
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
permissions:
  contents: write
concurrency:
  group: tcte-questions-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and Traditional Chinese OCR tools
        run: |
          python -m pip install -q requests beautifulsoup4 pymupdf pillow pytesseract
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra > /dev/null
      - name: Download official TCTE 90-115 exam and answer PDFs
        run: python scripts/tcte_auto.py --years $(seq 90 115)
      - name: Update missing-paper and verified-answer coverage
        run: python scripts/tcte_manifest.py
      - name: Commit structured student-readable question data
        run: |
          git config user.name "7581707 TCTE question bot"
          git config user.email "7581707-bot@users.noreply.github.com"
          git add sudu/data/
          if ! git diff --cached --quiet; then
            git commit -m "Sync official TCTE 90-115 question PDFs and answer audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
