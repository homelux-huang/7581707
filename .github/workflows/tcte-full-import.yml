name: Original TCTE PDF images - NO OCR
on:
  push:
    paths:
      - .github/workflows/tcte-full-import.yml
      - scripts/tcte_source_images.py
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
permissions:
  contents: write
  actions: write
concurrency:
  group: tcte-questions-sync
  cancel-in-progress: false
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF rendering tools only - no OCR engines
        run: python -m pip install -q requests pymupdf pillow
      - name: Permanently remove the legacy OCR fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/tcte_auto.py')
          s=p.read_text('utf-8')
          start=s.index('def pdf_text(pdf_bytes):')
          end=s.index('\ndef clean(', start)
          native='''def pdf_text(pdf_bytes):
              """Read only an existing PDF text layer. Scanned pages are rendered as images, never OCR."""
              with fitz.open(stream=pdf_bytes, filetype="pdf") as doc:
                  return [page.get_text(sort=True) for page in doc], []
          '''
          s=s[:start]+native+s[end:]
          assert 'pytesseract' not in s and 'image_to_string' not in s
          p.write_text(s,'utf-8')
          PY
          python -m py_compile scripts/tcte_auto.py scripts/tcte_source_images.py
      - name: Render official 90-115 originals without changing questions, answers or student IDs
        run: python scripts/tcte_source_images.py --years $(seq 90 115)
      - name: Commit compact WebP originals and disable old OCR code
        run: |
          git config user.name '7581707 original PDF image bot'
          git config user.email '7581707-bot@users.noreply.github.com'
          git add sudu/data/original scripts/tcte_auto.py
          if ! git diff --cached --quiet; then
            git commit -m 'Render original TCTE PDF pages as shared WebP; prohibit OCR'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish original images and run data audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run tcte-data-audit.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-image-report
          path: sudu/data/original/index.json
