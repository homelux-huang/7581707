name: Browser smoke test Sudu
# Acceptance coverage includes memory/correct-answer alignment, N/A hiding, source visibility, subject-extension contrast, 35/35 single-question WebP and English highlights.
on:
  push:
    paths:
      - sudu/workspace.js
      - sudu/workspace.css
      - sudu/index.html
      - index.html
      - sudu/v4-115-multisubject-review-demo.html
      - sudu/demo-subject-learning.js
      - sudu/demo-question-crops.json
      - scripts/build.py
      - sudu/exam_scoring.js
      - sudu/learning_sync.js
      - sudu/admin.html
      - sudu/share.html
      - tests/sudu_browser_smoke.cjs
      - .github/workflows/sudu-browser-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Build single-question WebPs and test UI
        run: |
          python -m pip install -q pillow
          SUDU_BUILD_SHA=$(git rev-parse HEAD) python scripts/build.py
          python -m http.server 8765 --directory _site > /tmp/sudu-test-server.log 2>&1 &
          sleep 2
          node tests/sudu_browser_smoke.cjs
