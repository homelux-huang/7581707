name: Browser smoke test Sudu
# Acceptance coverage includes post-answer memory -> correct-answer alignment and icon contrast.
on:
  push:
    paths:
      - sudu/workspace.js
      - sudu/workspace.css
      - sudu/index.html
      - index.html
      - sudu/v4-115-multisubject-review-demo.html
      - sudu/demo-subject-learning.js
      - sudu/exam_scoring.js
      - sudu/learning_sync.js
      - sudu/admin.html
      - sudu/share.html
      - tests/sudu_browser_smoke.cjs
      - .github/workflows/sudu-browser-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Serve and test UI
        run: |
          python3 -m http.server 8765 > /tmp/sudu-test-server.log 2>&1 &
          sleep 2
          node tests/sudu_browser_smoke.cjs
