name: Browser smoke test Sudu
# Acceptance coverage includes exact-heading N/A hiding, source visibility, subject-extension contrast, memory/correct-answer alignment, 35/35 single-question WebP and English highlights.
on:
  push:
    paths:
      - sudu/workspace.js
      - sudu/workspace.css
      - sudu/index.html
      - index.html
      - sudu/v4-115-multisubject-review-demo.html
      - sudu/demo-subject-learning.js
      - sudu/demo-question-crops.json
      - scripts/build.py
      - sudu/exam_scoring.js
      - sudu/learning_sync.js
      - sudu/admin.html
      - sudu/share.html
      - tests/sudu_browser_smoke.cjs
      - tests/sudu_demo_acceptance.cjs
      - .github/workflows/sudu-browser-test.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sudu-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
          node -e "const p=require('playwright'); p.chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close())"
      - name: Build single-question WebPs and test UI
        run: |
          python -m pip install -q pillow
          SUDU_BUILD_SHA=$(git rev-parse HEAD) python scripts/build.py
          python -m http.server 8765 --directory _site > /tmp/sudu-test-server.log 2>&1 &
          sleep 2
          node tests/sudu_browser_smoke.cjs
          node tests/sudu_demo_acceptance.cjs
      - name: Retain demo acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudu-demo-evidence-${{ github.sha }}
          path: test-results/
