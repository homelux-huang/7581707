name: MASTER emergency 114 E12 source canonical JSON SQLite admission (NO STUDENT RELEASE)
on:
  push:
    branches: [qa/master-emergency-114-e12-canonical-20261107]
    paths:
      - scripts/master_114_e12_canonical_rescue_20261107.py
      - tests/test_master_114_e12_canonical_rescue_20261107.py
      - .github/workflows/master-114-e12-canonical-rescue-20261107.yml
permissions:
  contents: write
concurrency:
  group: master-114-e12-source-rescue-20261107
  cancel-in-progress: false
jobs:
  exact_114_e12_canonical_source_only:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/master-emergency-114-e12-canonical-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out original 205 canonical source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/114
            sudu/data/original/114/00-E
            sudu/data/original/114/00-E-answers
            scripts
            tests
            .github/workflows
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Check out immutable Role A PR145 archived original source evidence
        uses: actions/checkout@v4
        with:
          ref: bc625d5eba9bf67f29b236258754941f0c9d999e
          path: _role_a_e12_stage
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/114/source-stage
            sudu/data/processed/114/review-evidence
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Pin original source version and copy only old original Role A receipts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _role_a_e12_stage rev-parse HEAD)" = bc625d5eba9bf67f29b236258754941f0c9d999e
          mkdir -p sudu/data/processed/114/source-stage
          cp _role_a_e12_stage/sudu/data/processed/114/source-stage/114-00-E-12-staged-20261104.json sudu/data/processed/114/source-stage/
          cp _role_a_e12_stage/sudu/data/processed/114/review-evidence/114-00-E-12-official-20261102.json sudu/data/processed/114/review-evidence/
          test "$(git hash-object sudu/data/processed/114/source-stage/114-00-E-12-staged-20261104.json)" = 3f0dc39251debf5f336edbcfa1b31c5e784e0dd3
          test "$(git hash-object sudu/data/processed/114/review-evidence/114-00-E-12-official-20261102.json)" = e166524f2e3f6921c1ba55fb23862e739307b518
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original question option WebP and printed official answer positive check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/master_114_e12_canonical_rescue_20261107.py --stage-root _role_a_e12_stage
      - name: Admit G1 G2 G3 to source-only canonical JSON and SQLite, not students
        shell: bash
        run: |
          set -euo pipefail
          python scripts/master_114_e12_canonical_rescue_20261107.py --stage-root _role_a_e12_stage --apply
          python -m unittest discover -s tests -p test_master_114_e12_canonical_rescue_20261107.py -v
      - name: Refuse any unrelated paths other 204 edits or hidden student release
        shell: bash
        run: |
          set -euo pipefail
          git add -- sudu/data/processed/114/questions.json
          git add -- sudu/data/processed/114/question-bank.sqlite3
          git add -- sudu/data/processed/114/review-evidence/114-00-E-12-official-20261102.json
          git add -- sudu/data/processed/114/review-evidence/114-00-E-12-MASTER-SOURCE-ADMISSION-20261107.json
          git add -- sudu/data/processed/114/source-stage/114-00-E-12-staged-20261104.json
          python - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            'sudu/data/processed/114/questions.json',
            'sudu/data/processed/114/question-bank.sqlite3',
            'sudu/data/processed/114/review-evidence/114-00-E-12-official-20261102.json',
            'sudu/data/processed/114/review-evidence/114-00-E-12-MASTER-SOURCE-ADMISSION-20261107.json',
            'sudu/data/processed/114/source-stage/114-00-E-12-staged-20261104.json'}
          assert actual==expected,(actual,expected)
          assert all('approved/' not in p and 'policy' not in p and '115' not in p for p in actual)
          print('PASS EXACT E12 source-only 5 changed paths and no public approved changes')
          PY
      - name: Commit only verified source and 205 SQLite candidate to isolated branch
        shell: bash
        env:
          TARGET_BRANCH: qa/master-emergency-114-e12-canonical-20261107
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "admit(source-only): 114 E12 exact official G1-G3 and 205 SQLite parity; no E D READY"
          git push origin HEAD:refs/heads/"$TARGET_BRANCH"
          echo "SOURCE_Q12_BRANCH_COMMITTED; no PR automatically merged and no student QID released"
      - name: Archive only traceable source report not a release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 114-e12-source-rescue-${{ github.run_id }}
          path: |
            sudu/data/processed/114/review-evidence/114-00-E-12-MASTER-SOURCE-ADMISSION-20261107.json
          if-no-files-found: warn
          retention-days: 14
