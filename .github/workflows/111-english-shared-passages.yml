name: 111 English Cloze Shared Material Candidate WebP (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/repair_111_english_shared_materials.py
      - .github/workflows/111-english-shared-passages.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-shared:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - run: |
          python -m py_compile scripts/repair_111_english_shared_materials.py
          python scripts/repair_111_english_shared_materials.py
      - name: Commit 111 shared-source drafts
        run: |
          git config user.name '7581707 shared material QA'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/111
          if ! git diff --cached --quiet; then
            git commit -m 'data(111): add two source-only English shared reading crops (QA pending)'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin qa/114-115-official-visual-review
              if git push origin HEAD:qa/114-115-official-visual-review; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
