name: Probe TCTE PDFs and answer formats
on:
  push:
    paths:
      - scripts/tcte_pdf_probe.py
      - .github/workflows/tcte-pdf-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests beautifulsoup4 pymupdf
      - run: python scripts/tcte_pdf_probe.py
