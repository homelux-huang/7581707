name: Role D source-bound English bilingual news UI (NO RELEASE)
on:
  pull_request:
    branches:
      - main
      - integration/114-115-first-batch-v4-receipts-20261025
    paths:
      - sudu/v4-115-multisubject-review-demo.html
      - tests/sudu_role_d_english_bilingual_news.cjs
      - docs/ROLE_D_ENGLISH_BILINGUAL_NEWS_HANDOFF_20261025.md
      - .github/workflows/sudu-role-d-english-news-gate.yml
      - sudu/teaching-candidates/114-role-b-20261025/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-news-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  english_source_bound_component_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUDU_D_NEWS_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_NEWS_MAIN_SHA: ${{ github.event.pull_request.base.sha || '' }}
      SUDU_D_NEWS_OUTPUT: test-results/role-d-english-news
      SUDU_D_ROLE_B_CHECKOUT: _role_b_current
      SUDU_D_ROLE_B_HEAD: 852c6613161f39314d87476b4e201cfe1811f783
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact HEAD, read-only source and JS syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_NEWS_EXPECT_SHA"
          node --check tests/sudu_role_d_english_bilingual_news.cjs
          git diff --exit-code
      # A true immutable external Role B HEAD is read-only; never overwrite
      # our frozen PR35 source / published approved files with B candidates.
      - uses: actions/checkout@v4
        with:
          ref: 852c6613161f39314d87476b4e201cfe1811f783
          path: _role_b_current
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025
      - name: Verify frozen real Role B source HEAD
        run: |
          set -euo pipefail
          test "$(git -C _role_b_current rev-parse HEAD)" = "$SUDU_D_ROLE_B_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require readable Traditional Chinese CJK fonts for truthful QA screenshots
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          family="$(fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1)"
          echo "zh-TW fallback family: $family"
          printf '%s\n' "$family" | grep -Eq '^Noto (Sans|Serif) CJK'
          mkdir -p test-results/role-d-english-news
          printf 'zh-TW fontconfig family: %s\n' "$family" > test-results/role-d-english-news/fontconfig.txt
      - name: Install Chromium and Pillow for the actual V4 public build
        run: |
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Real candidate 114 E07-09 source WebP + bilingual highlight component
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d-news.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/v4-115-multisubject-review-demo.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_english_bilingual_news.cjs
      - name: Preserve exact content digests, 48 RWD screenshot records and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-english-bilingual-news-${{ github.run_id }}
          path: test-results/role-d-english-news/
          if-no-files-found: warn
          retention-days: 14
