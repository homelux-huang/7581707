name: 115 Chinese Q16-18 shared passage v4 source-crop (DRAFT ONLY)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/stage_115_chinese_shared_16_18_v4.py
      - .github/workflows/115-c-shared-16-18-v4-draft-only.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-115-shared-c16-c18-v4-draft
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'Pillow>=10,<12'
      - name: Check immutable source and old QA state
        run: |
          set -euo pipefail
          python -m py_compile scripts/stage_115_chinese_shared_16_18_v4.py
          python scripts/stage_115_chinese_shared_16_18_v4.py --check
      - name: Make draft, twice, without modifying validated source
        run: |
          set -euo pipefail
          python scripts/stage_115_chinese_shared_16_18_v4.py --stage
          sha256sum sudu/data/processed/115/qa-drafts/webp-v4/shared/115-00-C-SHARED-16-18.webp \
            sudu/data/processed/115/qa-drafts/SHARED_115_C_16_18_V4_SOURCE_CROP_CANDIDATE_20261023.json > /tmp/sha-before
          python scripts/stage_115_chinese_shared_16_18_v4.py --stage
          sha256sum sudu/data/processed/115/qa-drafts/webp-v4/shared/115-00-C-SHARED-16-18.webp \
            sudu/data/processed/115/qa-drafts/SHARED_115_C_16_18_V4_SOURCE_CROP_CANDIDATE_20261023.json > /tmp/sha-after
          diff -u /tmp/sha-before /tmp/sha-after
      - name: Commit candidate, NEVER QA PASS or main
        run: |
          set -euo pipefail
          git config user.name "7581707 Shared Crop Candidate"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add sudu/data/processed/115/qa-drafts/webp-v4/shared/115-00-C-SHARED-16-18.webp \
            sudu/data/processed/115/qa-drafts/SHARED_115_C_16_18_V4_SOURCE_CROP_CANDIDATE_20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "data(115): shared Q16-18 v4 immutable crop candidate, requires visual QA"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 115-Chinese-Q16-Q18-shared-v4-source-pixels
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/115/qa-drafts/webp-v4/shared/115-00-C-SHARED-16-18.webp
            sudu/data/processed/115/qa-drafts/SHARED_115_C_16_18_V4_SOURCE_CROP_CANDIDATE_20261023.json
