name: Verify 7581707 official exam data quality
on:
  push:
    paths:
      - sudu/data/**
      - scripts/check_tcte_corpus.py
      - .github/workflows/tcte-data-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_tcte_corpus.py
