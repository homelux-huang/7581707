name: Role A 115 Chinese 11-15 immutable original and shared QA with C15 text quarantine (NO RELEASE)
on:
  push:
    branches:
      - qa/role-a-115-c11-15-shared-original-receipts-20261025
    paths:
      - sudu/data/processed/115/webp-v2/00-C/115-00-C-11.webp
      - sudu/data/processed/115/webp-v2/00-C/115-00-C-12.webp
      - sudu/data/processed/115/webp-v2/00-C/115-00-C-13.webp
      - sudu/data/processed/115/webp-v2/00-C/115-00-C-14.webp
      - sudu/data/processed/115/webp-v2/00-C/115-00-C-15.webp
      - sudu/data/processed/115/webp-v3/shared/115-00-C-SHARED-11-15.webp
      - tests/test_role_a_115_c11_15_shared_receipts.py
      - docs/ROLE_A_115_C11_15_SHARED_RECEIPTS_20261025.md
      - .github/workflows/role-a-115-c11-15-shared-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-a-115-c11-15-original-receipts-20261025
  cancel-in-progress: false

jobs:
  original_image_sha_and_source_only:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-115-c11-15-shared-original-receipts-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read-only source branch checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for source and original answer image byte QA
        run: python -m pip install -q pillow
      - name: Run exact source/official archive/shared original and SQLite tests
        run: |
          set -euo pipefail
          python -m py_compile tests/test_role_a_115_c11_15_shared_receipts.py scripts/sudu_verified_publish.py
          python -m unittest discover -s tests -p test_role_a_115_c11_15_shared_receipts.py -v
      - name: Ensure no writes, release or main/Pages modification
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo "Exactly original receipts; C15 corrupted OCR remains QUARANTINED; NO RELEASE"
