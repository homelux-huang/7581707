name: Role B 114 original-pixel lesson drafts with G2 OCR quarantine (NO RELEASE)
on:
  pull_request:
    paths:
      - "sudu/teaching-candidates/114-role-b-20261025-batch06/**"
      - "tests/test_114_role_b_batch06_20261025.py"
      - ".github/workflows/114-role-b-batch06-readonly-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-byte-sha-and-source-text-quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test real five original WebP SHA, original article/QA, canonical source-vs-image transcript, lesson digests and zero-READY negatives
        run: python -m unittest discover -s tests -p 'test_114_role_b_batch06_20261025.py' -v
      - name: Explicitly prove G2 pending and forbid B self-approved release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('sudu/teaching-candidates/114-role-b-20261025-batch06/batch.json').read_text(encoding='utf-8'))
          assert b['itemCount']==5 and b['newReady']==b['newMain']==b['newLive']==0
          assert b['canonicalSourceTextIssueStillPresent'] and b['excludeFromPublisherBeforeRoleAReconciliation']
          for row in b['items']:
              d=json.loads(Path(row['path']).read_text(encoding='utf-8'))
              assert d['review']['status']=='BLOCKED' and not d['review']['formalReady']
              assert d['review']['independentAiContentReview']['status']=='PENDING_ROLE_E'
              assert d['source']['officialSourceTextReconciliationRequired']
          print('NO RELEASE: five B-authored G1 original-pixel-grounded drafts, canonical G2 source text still quarantined')
          PY
