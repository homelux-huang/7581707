name: 106 C36-C38 official-pixel cross-page drafts and isolated G5 (NO RELEASE)
on:
  push:
    branches:
      - qa/114-115-official-visual-review
    paths:
      - scripts/stage_106_c36_38_crosspage_original_pixel_drafts.py
      - .github/workflows/106-c36-38-crosspage-crop-and-g5.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-106-c36-38-crop-and-g5
  cancel-in-progress: false
jobs:
  draft_crop:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for original-pixel immutable crops
        run: python -m pip install 'Pillow>=10,<12'
      - name: Pin QA SHA and validate source-image Git blobs
        run: |
          echo "QA_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python scripts/stage_106_c36_38_crosspage_original_pixel_drafts.py --check
      - name: Crop only missing Q36-38 and one page-7 original passage; isolated G5
        run: python scripts/stage_106_c36_38_crosspage_original_pixel_drafts.py --stage
      - name: Ensure all 204 candidates but NO G1/G3 promotion
        run: |
          python - <<'PY_AUDIT'
          import json
          from pathlib import Path
          b=Path('sudu/data/processed/106')
          m=json.loads((b/'webp-manifest.json').read_text())
          q=json.loads((b/'questions.json').read_text())
          v=json.loads((b/'VISUAL_QA.json').read_text())
          inv=json.loads((b/'inventory.json').read_text())
          rel=json.loads((b/'release-manifest.json').read_text())
          assert inv['webpGeneratedDrafts']==204 and inv['visualQaPass']==12
          assert len(q['questions'])==len(m['items'])==204
          assert len(m['sharedMaterialCrops'])==len(q['sharedMaterials'])==4
          assert v['passCount']==12 and rel['releaseAllowed'] is False
          for n in (36,37,38):
              qid=f'106-00-C-{n:02d}'
              r=next(x for x in q['questions'] if x['questionId']==qid)
              mrow=next(x for x in m['items'] if x['questionId']==qid)
              assert r['sharedMaterialIds']==['106-00-C-SHARED-36-38']
              assert r['assets']['sha256']==mrow['outputSha256']
              assert not r['questionVerified'] and not r['answerVerified'] and not r['integrationReady']
              assert mrow['qaStatus']=='DRAFT_NEEDS_DIRECT_VISUAL_QA'
          print('106 C36-38 numbered draft WebP complete; G1 still PENDING')
          PY_AUDIT
      - name: Commit immutable drafts only with fresh-head lease
        run: |
          set -eu
          git add sudu/data/processed/106/qa-drafts/webp-v3
          git add sudu/data/processed/106/qa-drafts/DRAFT_106_C36_38_SHARED_CROSSPAGE_20261024.json
          git add sudu/data/processed/106/webp-manifest.json sudu/data/processed/106/questions.json
          git add sudu/data/processed/106/ocr-raw-candidates.json sudu/data/processed/106/VISUAL_QA.json
          git add sudu/data/processed/106/inventory.json sudu/data/processed/106/VALIDATION.json
          git add sudu/data/processed/106/question-bank.sqlite3
          git diff --cached --check
          git fetch origin qa/114-115-official-visual-review
          if [ "$(git rev-parse FETCH_HEAD)" != "$QA_BASE" ]; then
            echo "Another Session updated the QA branch. Refusing stale write."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(qa106): stage three exact question 36-38 crops and shared passage, G5 pass, no release"
          git push origin HEAD:refs/heads/qa/114-115-official-visual-review
