name: Role A 115 ECON34 immutable official source + notice scope (NO RELEASE)
on:
  push:
    branches:
      - qa/role-a-115-econ34-official-source-20261025
    paths:
      - sudu/data/processed/115/review-evidence/115-09-2-34-ocr.json
      - sudu/data/processed/115/review-evidence/115-09-2-34-official-visual-20261024.json
      - sudu/data/processed/115/review-evidence/115-09-2-34-official.json
      - sudu/data/processed/115/review-evidence/115-09-2-34-blind-original-20261024.json
      - tests/test_role_a_115_econ34_official_source.py
      - docs/ROLE_A_115_ECON34_OFFICIAL_SOURCE_20261025.md
      - .github/workflows/role-a-115-econ34-source-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-a-115-econ34-source-20261025
  cancel-in-progress: false

jobs:
  source_scope_only:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-115-econ34-official-source-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read only immutable Role A source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact original-source, official annual notice and 205 SQLite checks
        run: |
          set -euo pipefail
          python -m py_compile tests/test_role_a_115_econ34_official_source.py scripts/sudu_verified_publish.py
          python -m unittest discover -s tests -p test_role_a_115_econ34_official_source.py -v
      - name: Verify no rewritten source, human-review flags or student release
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo "PASS source receipt validation only; no official PDF was re-downloaded and no student approval was written."
