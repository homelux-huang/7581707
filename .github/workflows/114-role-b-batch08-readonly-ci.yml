name: Role B 114 three lamps C16-C18 source G1 DRAFT and teaching (NO RELEASE)
on:
  pull_request:
    paths:
      - "sudu/teaching-candidates/114-role-b-20261025-batch08/**"
      - "tests/test_114_role_b_batch08_20261025.py"
      - ".github/workflows/114-role-b-batch08-readonly-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page6-real-source-and-three-g1-pending-lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test three real WebP/page6/official-answer blobs and double layer G1 source quarantine
        run: python -m unittest discover -s tests -p 'test_114_role_b_batch08_20261025.py' -v
      - name: Fail closed on G1 DRAFT G2 source G3 official E D master unapproved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('sudu/teaching-candidates/114-role-b-20261025-batch08/batch.json').read_text(encoding='utf-8'))
          assert b['itemCount']==3 and b['newReady']==b['newMain']==b['newLive']==0
          assert b['g1ImageStatus']=='DRAFT_NEEDS_DIRECT_VISUAL_QA'
          assert b['eIndependentAiContentReview']=='PENDING' and b['masterPublisherRelease']=='NOT_AUTHORIZED'
          for row in b['items']:
              d=json.loads(Path(row['path']).read_text(encoding='utf-8'))
              assert d['review']['status']=='BLOCKED'
              assert d['source']['archivedManifestQaStatus']=='DRAFT_NEEDS_DIRECT_VISUAL_QA'
              assert d['review']['formalReady'] is False
          print('NO RELEASE: 3 candidate 114 Chinese lamp lessons still blocked for G1/G2/G3/E/D/MASTER')
          PY
