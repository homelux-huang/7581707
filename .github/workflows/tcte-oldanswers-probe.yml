name: Probe legacy 91-94 official answer PDFs
on:
  push:
    paths:
      - scripts/tcte_oldanswers_probe.py
      - .github/workflows/tcte-oldanswers-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests pymupdf
      - run: python scripts/tcte_oldanswers_probe.py
