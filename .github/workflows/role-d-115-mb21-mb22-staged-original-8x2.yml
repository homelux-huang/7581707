name: ROLE D 115 MathB21 MB22 authentic A and C lesson 32 Chromium QA-only
on:
  push:
    branches:
      - qa/role-d-115-mb21-mb22-original-8x2-20261103
  pull_request:
    branches:
      - qa/role-d-114-english-e11-e13-e14-new-digest-20261103
    paths:
      - 'tests/sudu_role_d_115_mb21_mb22_staged_original_8x2.cjs'
      - '.github/workflows/role-d-115-mb21-mb22-staged-original-8x2.yml'
      - 'docs/ROLE_D_115_MB21_MB22_STAGED_8X2_20261103.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-115-mb21-mb22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original_real_115_mathb21_22_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_A_DIR: _role_a_115_mb21_mb22
      SUDU_D_C_DIR: _role_c_115_mb21_mb22
      SUDU_D_OUT: test-results/role-d-115-mb21-mb22-staged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin D current unique V4 and javascript test exact HEAD
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check tests/sudu_role_d_115_mb21_mb22_staged_original_8x2.cjs
          node --check sudu/verified-questions-runtime.js
          git diff --exit-code
      - name: Read immutable original 115 source Q21 Q22 WebPs and official final answers
        uses: actions/checkout@v4
        with:
          ref: fbd7756b995e3d27dc31a99ecc54fe66af4d82c6
          path: _role_a_115_mb21_mb22
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/115/questions.json
            sudu/data/processed/115/webp-manifest.json
            sudu/data/processed/115/webp-v2/00-MB
            sudu/data/processed/115/QA_115_MATH_B_Q01_25_OFFICIAL_FINAL_ANSWERS_20261023.json
      - name: Pin immutable ROLE C MB21 MB22 true authored teaching and digest
        uses: actions/checkout@v4
        with:
          ref: e50198cad6821a5252008bd474d8240510832f85
          path: _role_c_115_mb21_mb22
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-115-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine Chromium and Traditional Chinese fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1 | grep -Eq '^Noto (Sans|Serif) CJK'
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Check real approved 5 and launch V4 source-true 32 browser cases QA-only
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d-115-mb21-mb22.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/data/approved/115.json >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_115_mb21_mb22_staged_original_8x2.cjs
      - name: Archive QA-only screenshots and source-digest JSON even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-115-MB21-MB22-32SCREEN-SOURCE-QA-ONLY-${{ github.run_id }}
          path: test-results/role-d-115-mb21-mb22-staged/
          if-no-files-found: warn
          retention-days: 14
