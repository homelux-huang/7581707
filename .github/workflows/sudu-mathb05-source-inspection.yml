name: MB05 canonical source inspector (NO DEPLOY)
on:
  push:
    branches: [draft/preview-128-explanations-20261023]
    paths:
      - scripts/sudu_mathb05_source_inspection.py
      - .github/workflows/sudu-mathb05-source-inspection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aad909a726a201e2841b86b2c35634e5d5f4afe5
          path: current-qa-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f413718aaa6caa3d87692a32baf6768ea0dd2918
          path: current-main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect exact source, SQLite, image and existing evidence without granting approval
        run: python scripts/sudu_mathb05_source_inspection.py
      - name: Retain immutable source observation
        uses: actions/upload-artifact@v4
        with:
          name: mb05-source-inspection-no-release
          path: mb05-inspect/source-summary.json
          retention-days: 30
