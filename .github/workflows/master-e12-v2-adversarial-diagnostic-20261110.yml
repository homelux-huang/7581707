name: MASTER E12 V2 adversarial diagnostics (STRUCTURE ONLY; NOT RELEASE)
on:
  push:
    branches:
      - security/master-e12-v2-adversarial-diagnostic-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove_experimental_v2_limitations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q cryptography
      - name: Adversarial V2 limitations: NEVER a trust or release test
        run: python -m unittest discover -s tests -p test_sudu_review_execution_provenance_v2_adversarial_20261110.py -v
      - name: Preserve unconditional experiment no-release
        run: |
          python - <<'PY'
          from scripts.sudu_review_execution_provenance_v2_candidate import is_student_release_authorized
          assert is_student_release_authorized() is False
          print('SECURITY DIAGNOSTIC ONLY: G6 UNVERIFIED, G7 UNVERIFIED, NO TRUST_PASS OR READY OR LIVE')
          PY
