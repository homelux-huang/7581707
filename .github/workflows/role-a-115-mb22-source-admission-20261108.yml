name: ROLE A 115 MB22 exact one-question source G2/G3 SQLite (NO RELEASE)
on:
  push:
    branches: [qa/role-a-115-mb22-canonical-g2g3-20261108]
    paths:
      - scripts/role_a_115_mb22_source_admission_20261108.py
      - .github/workflows/role-a-115-mb22-source-admission-20261108.yml
permissions:
  contents: write
concurrency:
  group: role-a-115-mb22-source-admission-20261108
  cancel-in-progress: false
jobs:
  one_q22_source_db:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-115-mb22-canonical-g2g3-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/115
            sudu/data/original/115/00-MB
            sudu/data/original/115/00-MB-answers
            scripts
            tests
            docs
            .github/workflows
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Read original immutable ROLE A source G2/G3
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 38ab6b53f75f0da5a6e83087464e962e31430e64
          path: _role_a_stage
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/115/source-stage
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read immutable ROLE C original authored lesson
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: e50198cad6821a5252008bd474d8240510832f85
          path: _role_c_author
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            sudu/teaching-candidates/114-115-20261025
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Read protected publisher original implementation
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 5546a603abfe0af2e62c0e5f63f775be0bfb24cf
          path: _publisher_main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            sudu/release-governance
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual WebP native decoder
        run: python -m pip install -q pillow
      - name: Enforce stacked branch still contains exact MB21 source fixed parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ebc25c5d7af72c246b3178f872b5371da92951ed HEAD
          test "$(git rev-parse ebc25c5d7af72c246b3178f872b5371da92951ed:sudu/data/processed/115/questions.json)" = '776c24614ca3a44f5092a4abbb261b2291f491ab'
          test "$(git rev-parse HEAD:sudu/data/processed/115/questions.json)" = '776c24614ca3a44f5092a4abbb261b2291f491ab'
          test "$(git rev-parse HEAD:sudu/data/processed/115/question-bank.sqlite3)" = '59012010d531e2be48b1357276c6550323c4d268'
      - name: Run original MB22 source G1 G2 G3 and 14-column one-row SQLite repair
        run: |
          set -euo pipefail
          python scripts/role_a_115_mb22_source_admission_20261108.py --apply
          python scripts/role_a_115_mb22_source_admission_20261108.py --verify
      - name: Commit only exactly 8 MB22 source changes, never publish
        run: |
          set -euo pipefail
          git add -- sudu/data/processed/115/questions.json sudu/data/processed/115/question-bank.sqlite3 sudu/data/processed/115/inventory.json sudu/data/processed/115/source-stage/115-00-MB-22-staged-20261104.json sudu/data/processed/115/review-evidence/115-00-MB-22-ocr-publisher-20261108.json sudu/data/processed/115/review-evidence/115-00-MB-22-official-publisher-20261108.json sudu/data/processed/115/review-evidence/115-00-MB-22-source-admission-20261108.json sudu/data/processed/115/SQLITE_QA_MB22_SOURCE_BRIDGE_20261108.json
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'source(A): MB22 original clean G2/G3, SQLite one QID, no student release'
          python scripts/role_a_115_mb22_source_admission_20261108.py --verify
          git push origin HEAD:refs/heads/qa/role-a-115-mb22-canonical-g2g3-20261108
