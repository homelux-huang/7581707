name: Role D annual English author bilingual fix plus 114/115 real V4 112 screens QA ONLY
on:
  push:
    branches:
      - fix/role-d-114-115-annual-english-bilingual-after-master113-20261103
  pull_request:
    branches:
      - fix/master-v4-noncalc-gate-20261102
    paths:
      - 'sudu/v4-115-multisubject-review-demo.html'
      - 'tests/sudu_role_d_114_e12_after_renderer_8x2.cjs'
      - 'tests/sudu_role_d_114_115_main_after_renderer_8x2.cjs'
      - '.github/workflows/role-d-annual-english-e12-and-existing-115-v4.yml'
      - 'docs/ROLE_D_114_ENGLISH_BILINGUAL_RENDERER_20261103.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-annual-english-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  current_main_original_115_plus_114_new_source_112:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_REAL_OUT: test-results/role-d-114-115-current-main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact D head, both new tests and protected single V4 syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check tests/sudu_role_d_114_e12_after_renderer_8x2.cjs
          node --check tests/sudu_role_d_114_115_main_after_renderer_8x2.cjs
          node --check sudu/verified-questions-runtime.js
          git diff --exit-code
      - name: Pin exact A PR116 official Q12 source evidence and original WebP
        uses: actions/checkout@v4
        with:
          ref: a25a6e43de1a8f8179d84cc2257998d3c4ad4f58
          path: _role_a_e12
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/114/questions.json
            sudu/data/processed/114/webp-manifest.json
            sudu/data/processed/114/webp-v1/00-E
            sudu/data/processed/114/review-evidence/114-00-E-12-official-20261102.json
      - name: Pin exact B PR107 original dual-level teaching and Chinese news
        uses: actions/checkout@v4
        with:
          ref: 57d969888c57fdcd2b16c933e92c7a2c9eebb3a5
          path: _role_b_e12
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025-batch02
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium and Traditional Chinese glyph support
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1 | grep -Eq '^Noto (Sans|Serif) CJK'
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Genuine current-main admission, real approved 115 80 and 114 no-score 16 plus E12 QA-only 16
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d-annual-english.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/data/approved/114.json >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_114_115_main_after_renderer_8x2.cjs
          node tests/sudu_role_d_114_e12_after_renderer_8x2.cjs
      - name: Preserve real 112 PNG plus original source/version SHA JSON even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-114-English-Bilingual-and-115-FIVE-112-screen-QA-${{ github.run_id }}
          path: |
            test-results/role-d-114-115-current-main/
            test-results/role-d-114-e12-exact-v4/
          if-no-files-found: warn
          retention-days: 14
