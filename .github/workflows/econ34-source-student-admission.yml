name: Econ34 separate reviewer evidence blocker and safe five-question source (NO DEPLOY)
on:
  push:
    branches: [qa/econ34-prekey-image-only-20261024]
    paths:
      - 'sudu/data/processed/115/verified-student-batch.json'
      - 'sudu/data/processed/115/review-evidence/115-09-2-34-independent-review-needed-20261024.json'
      - '.github/workflows/econ34-source-student-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c83279e06775c044663884525a4c1d67e5191c63
          path: strict-publisher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify existing and negative TCTE final correction tests
        run: |
          set -eu
          python -m pip install -q pillow
          (cd strict-publisher && python -m unittest discover -s tests -p 'test_sudu_verified_publish.py' -v)
      - name: Assert original independent solving and official A are intact but the separate teaching review is absent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          base=root/"sudu/data/processed/115"
          read=lambda p:json.loads(Path(p).read_text(encoding="utf-8"))
          item=read(base/"review-evidence/115-09-2-34-independent-review-needed-20261024.json")
          proof=read(base/"review-evidence/115-09-2-34-blind-original-20261024.json")
          official=read(base/"review-evidence/115-09-2-34-official-visual-20261024.json")
          teaching=read(base/"review-evidence/115-09-2-34-teaching.json")
          batch=read(base/"verified-student-batch.json")
          assert item["state"].startswith("BLOCKED") and not item["independentHumanTeacherReviewed"]
          assert item["questionId"] not in {x["questionId"] for x in batch["items"]}
          assert len(batch["items"])==5
          assert proof["answer"]==official["officialFinalOptionReadVisually"]=="A"
          assert proof["solvedWithoutOfficialAnswer"] and proof["officialAnswerHiddenDuringSolve"]
          assert official["sourceOriginalQuestionWebpSha256"]==item["originalWebpSha256"]
          assert teaching["teachingCanonicalSha256"]==item["teachingCandidateDigest"]
          assert teaching["reviewer"].startswith("GPT-6 AI")
          print("PASS: original solution and full teaching proposal are preserved; NO independent teaching admission claimed")
          PY
      - name: Run unchanged publisher and PROVE Econ34 remains BLOCKED
        run: |
          set -eu
          mkdir -p econ34-blocked-stage
          python strict-publisher/scripts/sudu_verified_publish.py stage --source . --dest econ34-blocked-stage --sha "$(git rev-parse HEAD)" > /tmp/econ34-safe-stage.json
          python strict-publisher/scripts/sudu_verified_publish.py check --dest econ34-blocked-stage
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          root=Path(".").resolve()
          spec=importlib.util.spec_from_file_location("pub",root/"strict-publisher/scripts/sudu_verified_publish.py")
          pub=importlib.util.module_from_spec(spec);spec.loader.exec_module(pub)
          q=next(x for x in pub.read(root/"sudu/data/processed/115/questions.json")["questions"] if x["questionId"]=="115-09-2-34")
          m=next(x for x in pub.read(root/"sudu/data/processed/115/webp-manifest.json")["items"] if x["questionId"]==q["questionId"])
          assert pub.reviewed_student_batches(root,115).get(q["questionId"]) is None
          result=pub.apply_independently_certified_review(root,115,q,m,None)
          assert result==q and result.get("studentReleaseApproved") is not True
          released=pub.read(root/"econ34-blocked-stage/sudu/data/approved/115.json")
          expected={"115-00-MB-02","115-00-MB-03","115-00-MB-04","115-00-MB-05","115-00-MB-09"}
          assert released["approvedCount"]==5
          assert {x["canonicalId"] for x in released["questions"]}==expected
          previous=pub.read(root/"strict-publisher/sudu/data/approved/115.json")
          assert previous["approvedCount"]==5
          assert set(map(str,previous["questions"]))==set(map(str,released["questions"]))
          print("PASS: previous five unchanged, Econ34 independent review PENDING, no accidental source admission or LIVE release")
          PY
      - name: Keep blocked candidate evidence as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econ34-independent-teaching-blocked-no-deploy
          path: |
            /tmp/econ34-safe-stage.json
            econ34-blocked-stage/sudu/data/approved/115.json
          if-no-files-found: ignore
          retention-days: 45
