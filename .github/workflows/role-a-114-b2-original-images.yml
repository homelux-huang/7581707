name: Role A 114 English11-14 Chinese04 original WebP + historical QA receipts (NO RELEASE)
on:
  push:
    branches:
      - qa/role-a-114-e11e14-c04-original-images-20261025
    paths:
      - sudu/data/processed/114/webp-v1/00-E/114-00-E-11.webp
      - sudu/data/processed/114/webp-v1/00-E/114-00-E-12.webp
      - sudu/data/processed/114/webp-v1/00-E/114-00-E-13.webp
      - sudu/data/processed/114/webp-v1/00-E/114-00-E-14.webp
      - sudu/data/processed/114/webp-v1/00-C/114-00-C-04.webp
      - sudu/data/processed/114/QA_114_EN_Q06_Q20_SHA_BOUND_DIRECT_VISUAL_20261023.json
      - sudu/data/processed/114/VISUAL_QA_BATCH_01_2026-10-22.json
      - tests/test_role_a_114_b2_original_images.py
      - .github/workflows/role-a-114-b2-original-images.yml
      - docs/ROLE_A_114_B2_ORIGINAL_IMAGES_20261025.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-a-114-b2-original-images-20261025
  cancel-in-progress: false

jobs:
  five_source_images:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-114-e11e14-c04-original-images-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read-only exact author-original source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoder
        run: python -m pip install -q pillow
      - name: Verify original Git image/QA bytes source revision & 205 SQLite
        run: |
          set -euo pipefail
          python -m py_compile tests/test_role_a_114_b2_original_images.py scripts/sudu_verified_publish.py
          python -m unittest discover -s tests -p test_role_a_114_b2_original_images.py -v
      - name: Verify strictly read-only and no Pages/main or approved mutations
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo "Role A archived image receipt only, no new image/text/teaching PASS."
