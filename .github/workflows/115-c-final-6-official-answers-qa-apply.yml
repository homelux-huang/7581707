name: 115 Chinese six final official answers SHA audit (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/apply_115_c_6_verified_official_answers.py
      - .github/workflows/115-c-final-6-official-answers-qa-apply.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-115-c-final-answer-six-sha
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 6 official answer and full PDF correction evidence without modifying files
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/114-115-official-visual-review"
          python -m py_compile scripts/apply_115_c_6_verified_official_answers.py
          python scripts/apply_115_c_6_verified_official_answers.py --check
      - name: Apply only 6 final G3 answer approvals, test exact idempotency and database integrity
        run: |
          set -euo pipefail
          python scripts/apply_115_c_6_verified_official_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/115-answer-before.sha
          python scripts/apply_115_c_6_verified_official_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/115-answer-after.sha
          diff -u /tmp/115-answer-before.sha /tmp/115-answer-after.sha
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('sudu/data/processed/115')
          inv=json.loads((p/'inventory.json').read_text())
          ans=json.loads((p/'official-answer-evidence.json').read_text())
          q=json.loads((p/'questions.json').read_text())
          assert inv['officialAnswerIndependentVerified']==6
          assert ans['answerVerifiedCount']==6
          assert sum(bool(x.get('answerVerified')) for x in ans['items'])==6
          assert sum(bool(x.get('answerVerified')) for x in q['questions'])==6
          assert inv['imageVisualQaPass']==141 and not any(x.get('questionVerified') or x.get('integrationReady') for x in q['questions'])
          print('PASS: 6 TCTE final official answers, all 115 release gates remain blocked')
          PY
      - name: Commit final-answer QA evidence and staging DB to QA branch only
        run: |
          set -euo pipefail
          git config user.name '7581707 G3 QA'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,official-confirmation-status.json,question-bank.sqlite3}
          if ! git diff --cached --quiet; then
            git commit -m 'qa(115): verify six Chinese official answers against full TCTE confirmation PDF; G3 only'
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 115-Chinese-six-final-official-answers-G3
          if-no-files-found: error
          retention-days: 30
          path: |
            sudu/data/processed/115/QA_115_C_6_FINAL_OFFICIAL_ANSWERS_20261023.json
            sudu/data/processed/115/QA_115_TCTE_OFFICIAL_CONFIRMATION_PDFS_20261023.json
            sudu/data/processed/115/inventory.json
            sudu/data/processed/115/official-confirmation-status.json
