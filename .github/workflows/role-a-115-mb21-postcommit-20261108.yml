name: ROLE A 115 MB21 final exact-HEAD source G2/G3 SQLite 205 QA (NO RELEASE)
on:
  push:
    branches: [qa/role-a-115-mb21-canonical-g2g3-20261108]
    paths:
      - sudu/data/processed/115/questions.json
      - sudu/data/processed/115/question-bank.sqlite3
      - sudu/data/processed/115/inventory.json
  pull_request:
    branches:
      - qa/114-115-official-visual-review
permissions:
  contents: read
jobs:
  original_205_postcommit:
    # These assertions describe the frozen one-question PR, not future QA changes.
    if: >-
      github.repository == 'homelux-huang/7581707' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/qa/role-a-115-mb21-canonical-g2g3-20261108') ||
       (github.event_name == 'pull_request' && github.head_ref == 'qa/role-a-115-mb21-canonical-g2g3-20261108' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout actual E11-independent MB21 QA source and full original history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/115
            sudu/data/original/115/00-MB
            sudu/data/original/115/00-MB-answers
            scripts
            tests
            docs
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Checkout current published main publisher native source contract read only
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 5546a603abfe0af2e62c0e5f63f775be0bfb24cf
          path: _publisher_main
          persist-credentials: false
          sparse-checkout: |
            scripts
            sudu/release-governance
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Required native publisher original WebP decode dependency
        run: python -m pip install -q pillow
      - name: Validate actual publisher G1 G2 G3 and negative source/image/official mutations
        run: |
          set -euo pipefail
          python scripts/role_a_115_mb21_source_admission_20261108.py --verify
      - name: Compare all original 204 JSON and 204 SQLite row values to original QA baseline
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_role_a_115_mb21_source_20261108.py' -v
      - name: Confirm source-only immutable checkout
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo 'MB21 source-only canonical admission; no E trust/BLIND/D 16/16/READY/LIVE.'
