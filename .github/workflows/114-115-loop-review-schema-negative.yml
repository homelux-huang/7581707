name: 114-115 master loop negative reviewer schema (NO RELEASE)
on:
  push:
    branches: [coord/loop-master-review-schema-negative-20261025]
    paths:
      - tests/test_114_115_first_batch_receipt_integrity.py
      - tests/test_114_115_loop_candidate_links.py
      - tests/test_114_115_loop_mb23_source_proof.py
      - sudu/data/processed/115/review-evidence/115-00-MB-23-image-transcription-correction-20261024.json
      - .github/workflows/114-115-loop-review-schema-negative.yml
  pull_request:
    branches: [integration/114-115-first-batch-v4-receipts-20261025]
    paths:
      - tests/test_114_115_first_batch_receipt_integrity.py
      - tests/test_114_115_loop_candidate_links.py
      - tests/test_114_115_loop_mb23_source_proof.py
      - sudu/data/processed/115/review-evidence/115-00-MB-23-image-transcription-correction-20261024.json
      - .github/workflows/114-115-loop-review-schema-negative.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 114-115-master-loop-review-schema-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_negative_author_review_contract:
    name: Fail-closed B/C author review without any teacher self-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual independent-review gate dependencies
        run: python -m pip install -q cryptography
      - name: Test 410 real receipts, SHA, both 205-row SQLite banks, B/C missing/false/true/spoof negative schema
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_114_115_first_batch_receipt_integrity.py' -v
          python -m unittest discover -s tests -p 'test_114_115_loop_candidate_links.py' -v
          python -m unittest discover -s tests -p 'test_114_115_lesson_batch_oct25.py' -v
          python -m unittest discover -s tests -p 'test_sudu_independent_review_gate.py' -v
      - name: Prove no source or approved student data mutated by read-only tests
        run: git diff --exit-code && git diff --cached --exit-code

  verify_mb23_exact_existing_source_evidence:
    name: Immutable MB23 source QA Git blob + PDF/WebP/table linkage (NOT independent admission)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read actual inherited MB23 source, original immutable evidence and table candidate
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_114_115_loop_mb23_source_proof.py' -v
          git diff --exit-code
