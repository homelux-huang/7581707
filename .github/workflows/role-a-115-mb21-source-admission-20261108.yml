name: ROLE A 115 MathB21 exact source+SQLite single-question G2/G3 admission (NO RELEASE)
on:
  push:
    branches: [qa/role-a-115-mb21-canonical-g2g3-20261108]
    paths:
      - scripts/role_a_115_mb21_source_admission_20261108.py
      - tests/test_role_a_115_mb21_source_20261108.py
      - .github/workflows/role-a-115-mb21-source-admission-20261108.yml
permissions:
  contents: write
concurrency:
  group: role-a-115-mb21-source-admission-20261108
  cancel-in-progress: false
jobs:
  original_one_q_205_sqlite:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-115-mb21-canonical-g2g3-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout original 115 QA-based isolated source and 205 normalized SQLite
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            sudu/data/processed/115
            sudu/data/original/115/00-MB
            sudu/data/original/115/00-MB-answers
            scripts
            tests
            docs
            .github/workflows
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Checkout frozen ROLE A original correct G2/G3 single-question source stage
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 38ab6b53f75f0da5a6e83087464e962e31430e64
          path: _role_a_stage
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/115/source-stage
          sparse-checkout-cone-mode: true
      - name: Checkout ROLE C original authored correct graph + 4 options lesson (read only)
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: e50198cad6821a5252008bd474d8240510832f85
          path: _role_c_author
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-115-20261025
          sparse-checkout-cone-mode: true
      - name: Checkout actual protected-main original publisher (read only)
        uses: actions/checkout@v4
        with:
          repository: homelux-huang/7581707
          ref: 5546a603abfe0af2e62c0e5f63f775be0bfb24cf
          path: _publisher_main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            sudu/release-governance
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install genuine native WebP image decoding
        run: python -m pip install -q pillow
      - name: Assert exact frozen baseline and authored stage revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse ${{ github.sha }}:sudu/data/processed/115/questions.json)" = 'ad1e7c4ed03bdd90274c645b5c9f1072aca732d2'
          test "$(git rev-parse ${{ github.sha }}:sudu/data/processed/115/webp-manifest.json)" = '2e204b1cca4caf8dea494bd0d8ecfccf5b93f84b'
          test "$(git rev-parse ${{ github.sha }}:sudu/data/processed/115/question-bank.sqlite3)" = '9e09bf6dcbabce514d5c54286c74b9f91b0ce54b'
          test "$(git -C _role_a_stage rev-parse HEAD)" = '38ab6b53f75f0da5a6e83087464e962e31430e64'
          test "$(git -C _role_c_author rev-parse HEAD)" = 'e50198cad6821a5252008bd474d8240510832f85'
          test "$(git -C _publisher_main rev-parse HEAD)" = '5546a603abfe0af2e62c0e5f63f775be0bfb24cf'
      - name: Make only original 115 MB21 source/official G2 G3 and real 14-column SQLite one-row update
        shell: bash
        run: |
          set -euo pipefail
          python scripts/role_a_115_mb21_source_admission_20261108.py --apply
      - name: Execute protected-main publisher source positive/negative fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/role_a_115_mb21_source_admission_20261108.py --verify
      - name: Stage only the 8 explicitly authorized source files
        shell: bash
        run: |
          set -euo pipefail
          git add --             sudu/data/processed/115/questions.json             sudu/data/processed/115/question-bank.sqlite3             sudu/data/processed/115/inventory.json             sudu/data/processed/115/source-stage/115-00-MB-21-staged-20261104.json             sudu/data/processed/115/review-evidence/115-00-MB-21-ocr-publisher-20261108.json             sudu/data/processed/115/review-evidence/115-00-MB-21-official-publisher-20261108.json             sudu/data/processed/115/review-evidence/115-00-MB-21-source-admission-20261108.json             sudu/data/processed/115/SQLITE_QA_MB21_SOURCE_BRIDGE_20261108.json
          test "$(git diff --cached --name-only | wc -l)" -eq 8
      - name: Commit only isolated MB21 source evidence, never protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/qa/role-a-115-mb21-canonical-g2g3-20261108'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'source(A): original 115 MB21 G2/G3 restored, SQLite one QID, NO RELEASE'
      - name: Real postcommit original 204 JSON+SQLite byte parity and all native negative tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_role_a_115_mb21_source_20261108.py' -v
      - name: Push only same exact source branch; no student release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/qa/role-a-115-mb21-canonical-g2g3-20261108'
          git push origin HEAD:refs/heads/qa/role-a-115-mb21-canonical-g2g3-20261108
          echo 'MB21 original question+SQLite only; formal E trust and real D UI gate remain HOLD.'
