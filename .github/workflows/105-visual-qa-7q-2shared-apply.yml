name: Apply 105 seven directly reviewed WebP plus two shared (QA ONLY)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/promote_105_direct_image_qa_7q_2shared.py
      - .github/workflows/105-visual-qa-7q-2shared-apply.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-105-direct-image-qa-ledger-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Validate direct visual evidence, original page hashes and crop pixels
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'qa/114-115-official-visual-review'
          python -m py_compile scripts/promote_105_direct_image_qa_7q_2shared.py
          python scripts/promote_105_direct_image_qa_7q_2shared.py --check
      - name: Apply image-only QA and test idempotency
        run: |
          set -euo pipefail
          python scripts/promote_105_direct_image_qa_7q_2shared.py --stage
          sha256sum sudu/data/processed/105/{questions.json,webp-manifest.json,VISUAL_QA.json,inventory.json,VALIDATION.json} > /tmp/qa-105-before.sha256
          python scripts/promote_105_direct_image_qa_7q_2shared.py --stage
          sha256sum sudu/data/processed/105/{questions.json,webp-manifest.json,VISUAL_QA.json,inventory.json,VALIDATION.json} > /tmp/qa-105-after.sha256
          diff -u /tmp/qa-105-before.sha256 /tmp/qa-105-after.sha256
          python - <<'PY'
          from pathlib import Path
          import json
          b=Path('sudu/data/processed/105')
          inv=json.loads((b/'inventory.json').read_text())
          vis=json.loads((b/'VISUAL_QA.json').read_text())
          questions=json.loads((b/'questions.json').read_text())['questions']
          assert inv['visualQaPass']==7 and inv['webpGeneratedDrafts']==204
          assert inv['sharedMaterialsVerified']==2 and vis['passCount']==7
          assert sum(q['imageQaStatus']=='PASS' for q in questions)==7
          assert all(q.get('answerVerified') is False and q.get('questionVerified') is False for q in questions)
          assert not inv['integrationReady']
          print('PASS: seven source-to-crop visual reviews and two shared, no answer/text/release flags')
          PY
      - name: Commit QA evidence metadata without changing source assets
        run: |
          set -euo pipefail
          git config user.name '7581707 QA Review Ledger'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/105/questions.json sudu/data/processed/105/webp-manifest.json sudu/data/processed/105/VISUAL_QA.json sudu/data/processed/105/inventory.json sudu/data/processed/105/VALIDATION.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa(105): apply 7 SHA-bound direct visual WebP PASS and 2 shared, answers pending'
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 105-direct-visual-qa-ledger-apply
          retention-days: 21
          path: |
            sudu/data/processed/105/qa-drafts/DIRECT_VISUAL_QA_105_7Q_2SHARED_20261023.json
            sudu/data/processed/105/qa-drafts/DIRECT_VISUAL_QA_105_SHARED_27_29_V4_20261023.json
            sudu/data/processed/105/inventory.json
            sudu/data/processed/105/VALIDATION.json
