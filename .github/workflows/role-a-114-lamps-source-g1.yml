name: ROLE A 114 C16 C17 C18 real original lamp shared WebP and G1 source (NO RELEASE)
on:
  push:
    branches:
      - qa/role-a-114-c16-c18-lamps-g1-20261103
    paths:
      - scripts/role_a_114_lamps_shared_crop.py
      - tests/test_role_a_114_lamps_source_g1.py
      - sudu/data/processed/114/source-receipts/114-00-C-SHARED-16-19.webp
      - sudu/data/processed/114/review-evidence/114-00-C-16-18-original-lamps-20261103.json
      - sudu/data/processed/114/webp-v1/00-C/114-00-C-16.webp
      - sudu/data/processed/114/webp-v1/00-C/114-00-C-17.webp
      - sudu/data/processed/114/webp-v1/00-C/114-00-C-18.webp
      - docs/ROLE_A_114_C16_18_ORIGINAL_LAMPS_20261103.md
      - .github/workflows/role-a-114-lamps-source-g1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: role-a-114-c16-c18-lamps-isolated-source
  cancel-in-progress: false

jobs:
  exact_original_g1:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-114-c16-c18-lamps-g1-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact claimed source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic source pixel-crop dependency
        run: python -m pip install Pillow==11.3.0
      - name: Generate only missing original-pixel shared p6 lamp WebP, never touch any original
        run: |
          set -euo pipefail
          python scripts/role_a_114_lamps_shared_crop.py
      - name: Exact three original sources, full page/answer/notice, pixel lossless, negative QA tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_role_a_114_lamps_source_g1.py -v
      - name: Record only two generated Role A-leased source files onto OWN isolated branch
        env:
          BRANCH: qa/role-a-114-c16-c18-lamps-g1-20261103
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/$BRANCH" ]
          git add -- \
            sudu/data/processed/114/source-receipts/114-00-C-SHARED-16-19.webp \
            sudu/data/processed/114/review-evidence/114-00-C-16-18-original-lamps-20261103.json
          if git diff --cached --quiet; then
            echo "No generated-source differences; verified HEAD already carries exact bytes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(A): attach deterministic lossless original 114 C16-19 shared lamp pixels [NO RELEASE]"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          git diff --exit-code
          git diff --cached --exit-code
          echo "SOURCE ONLY. G2/G3 / B / E / D / READY / Pages stay blocked."
