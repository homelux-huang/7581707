name: Role D 114 E11 E13 E14 source SHA plus existing 114/115 160-screen V4 QA ONLY
on:
  push:
    branches:
      - qa/role-d-114-english-e11-e13-e14-new-digest-20261103
  pull_request:
    branches:
      - fix/role-d-114-115-annual-english-bilingual-after-master113-20261103
    paths:
      - 'tests/sudu_role_d_114_english_e11_e13_e14_new_digest_8x2.cjs'
      - '.github/workflows/role-d-114-english-e11-e13-e14-new-digest.yml'
      - 'docs/ROLE_D_114_EN11_13_14_NEW_DIGEST_20261103.md'
      - 'sudu/v4-115-multisubject-review-demo.html'
      - 'sudu/verified-questions-runtime.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d-e11e13e14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real_114_three_original_questions_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_AUTHOR_CHECKOUT: _role_b_batch02
      SUDU_D_IMAGE_CHECKOUT: _role_a_original
      SUDU_D_STAGE_OUT: test-results/role-d-114-e11-e13-e14-new-digest-v4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin real role D exact V4 and test
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check tests/sudu_role_d_114_english_e11_e13_e14_new_digest_8x2.cjs
          node --check tests/sudu_role_d_114_e12_after_renderer_8x2.cjs
          node --check tests/sudu_role_d_114_115_main_after_renderer_8x2.cjs
          node --check sudu/verified-questions-runtime.js
          git diff --exit-code
      - name: Checkout immutable B-author real A-D double-layer lessons (NOT E receipt)
        uses: actions/checkout@v4
        with:
          ref: 2ae0af298bb803547698ebd279efe8a291f89e63
          path: _role_b_batch02
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025-batch02
      - name: Checkout immutable A-original-pixel WebPs and historical QA evidence
        uses: actions/checkout@v4
        with:
          ref: 57f2c1709431e906a5405e8008337330704cc4ef
          path: _role_a_original
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/114/webp-v1/00-E
            sudu/data/processed/114/questions.json
            sudu/data/processed/114/webp-manifest.json
            sudu/data/processed/114/review-evidence/114-00-E-11-official.json
            sudu/data/processed/114/review-evidence/114-00-E-13-official.json
            sudu/data/processed/114/review-evidence/114-00-E-14-official.json
            sudu/data/processed/114/QA_114_EN_Q06_Q20_SHA_BOUND_DIRECT_VISUAL_20261023.json
      - name: Pin independent original A PR116 E12 source for cross-question V4 regression
        uses: actions/checkout@v4
        with:
          ref: a25a6e43de1a8f8179d84cc2257998d3c4ad4f58
          path: _role_a_e12
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/114/questions.json
            sudu/data/processed/114/webp-manifest.json
            sudu/data/processed/114/webp-v1/00-E
            sudu/data/processed/114/review-evidence/114-00-E-12-official-20261102.json
      - name: Pin independent B PR107 E12 author and true composed SHA
        uses: actions/checkout@v4
        with:
          ref: 57d969888c57fdcd2b16c933e92c7a2c9eebb3a5
          path: _role_b_e12
          persist-credentials: false
          sparse-checkout: |
            sudu/teaching-candidates/114-role-b-20261025-batch02
      - name: Checkout immutable pre-A original 205-row PR35 comparison source
        uses: actions/checkout@v4
        with:
          ref: e2cf6fe99d879d9b872e1b5b8137591e1f4f68b5
          path: _role_source_baseline
          persist-credentials: false
          sparse-checkout: |
            sudu/data/processed/114/questions.json
      - name: Assert source/author immutable SHA (fail closed)
        run: |
          set -euo pipefail
          test "$(git -C _role_b_batch02 rev-parse HEAD)" = 2ae0af298bb803547698ebd279efe8a291f89e63
          test "$(git -C _role_a_original rev-parse HEAD)" = 57f2c1709431e906a5405e8008337330704cc4ef
          test "$(git -C _role_source_baseline rev-parse HEAD)" = e2cf6fe99d879d9b872e1b5b8137591e1f4f68b5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install true Chromium and Traditional Chinese font
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1 | grep -Eq '^Noto (Sans|Serif) CJK'
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Original QA-gated publisher check, temporary QA-only real-source V4
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d114-e11e14.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/v4-115-multisubject-review-demo.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_114_115_main_after_renderer_8x2.cjs
          node tests/sudu_role_d_114_e12_after_renderer_8x2.cjs
          node tests/sudu_role_d_114_english_e11_e13_e14_new_digest_8x2.cjs
      - name: Archive screenshots/real SHA and negative errors even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-114-E11-E12-E13-E14-and-115-FIVE-160-SCREEN-QA-ONLY-${{ github.run_id }}
          path: |
            test-results/role-d-114-e11-e13-e14-new-digest-v4/
            test-results/role-d-114-e12-exact-v4/
            test-results/role-d-114-115-current-main/
          if-no-files-found: warn
          retention-days: 14
