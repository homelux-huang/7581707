name: 110 Official Fifty-Question Count Q80 Quarantine (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/quarantine_110_09_1_false_q80.py
      - .github/workflows/110-quarantine-phantom-q80.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quarantine:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - run: |
          python -m py_compile scripts/quarantine_110_09_1_false_q80.py
          python scripts/quarantine_110_09_1_false_q80.py
      - name: Commit 110 staging quarantine, never original or main
        run: |
          git config user.name '7581707 110 QA quarantine'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/110
          if ! git diff --cached --quiet; then
            git commit -m 'qa(110): quarantine false Q80 legacy extraction; keep 50 official subjects'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin qa/114-115-official-visual-review
              if git push origin HEAD:qa/114-115-official-visual-review; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
