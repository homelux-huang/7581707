name: Work durable G8 custody and current protected policy tests (NO RELEASE)
on:
  push:
    branches: [fix/work-g8-durable-archive-20261115]
  pull_request:
    branches: [fix/master-pr211-g8-security-hardening-20261115]
permissions:
  contents: read
jobs:
  durable_custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pillow requests beautifulsoup4 cryptography
      - name: Compile and run synthetic-only custody / publisher regressions
        run: |
          python -m compileall -q scripts/sudu_g8_archive.py scripts/sudu_g8_release_bridge.py scripts/sudu_verified_publish.py
          python -m unittest discover -s tests -p 'test_sudu*.py' -v
      - name: Real current protected policy and latest QA still admit only historical five
        env:
          SOURCE_SHA: 3d7645b9b8c83bd09348115118920501823b3c27
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SHA"
          git worktree add --detach "$RUNNER_TEMP/custody-source" "$SOURCE_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts import sudu_g8_release_bridge as bridge
          from scripts import sudu_verified_publish as pub
          from scripts import sudu_independent_review_gate as gate
          source=Path(os.environ['RUNNER_TEMP'])/'custody-source'
          out=Path(os.environ['RUNNER_TEMP'])/'custody-native'
          policy=bridge.trusted_policy()
          assert policy['trustedAiReviewReceipts']=={}, 'Real E trust changed: refresh expectations; do not infer admission'
          pub.stage(source,out,os.environ['SOURCE_SHA'],review_policy=policy)
          pub.site_check(out)
          assert json.loads((out/'sudu/data/approved/114.json').read_text())['approvedCount']==0
          actual={q['canonicalId'] for q in json.loads((out/'sudu/data/approved/115.json').read_text())['questions']}
          assert actual==gate.LEGACY_FIVE_IDS
          print('ACTUAL PROTECTED POLICY / latest QA: original five only, no real G6/G8/capture/newLIVE')
          PY
          git diff --exit-code
