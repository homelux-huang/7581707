name: Role D 113 Chinese five original source-exact Q-by-Q 8x2 QA ONLY
on:
  push:
    branches:
      - qa/role-d-113-c01-c05-real-v4-20261027
  pull_request:
    branches:
      - fix/master-shared-material-1to1-20261026
    paths:
      - 'tests/sudu_role_d_113_c01_c05_original_v4.cjs'
      - '.github/workflows/role-d-113-c01-c05-original-v4.yml'
      - 'docs/ROLE_D_113_C01_C05_V4_HANDOFF_20261027.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: role-d113-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original_113_five_individual_sha_bound_8x2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUDU_D_QA_ONLY: '1'
      SUDU_D_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUDU_D_SOURCE_CHECKOUT: '_source113'
      SUDU_D_OUT: 'test-results/role-d-113-c01-c05-original-v4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact V4 runner, no authorized teaching/approved write
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUDU_D_EXPECT_SHA"
          node --check tests/sudu_role_d_113_c01_c05_original_v4.cjs
          node --check sudu/verified-questions-runtime.js
          git diff --exit-code
      - uses: actions/checkout@v4
        with:
          ref: '5e8765ef512e05b551df8c3240b2c8fcfc4db920'
          path: '_source113'
          persist-credentials: false
          sparse-checkout: |
            sudu/data/years/113.json
            sudu/data/processed/113/role-a-c01-05
            sudu/data/original/113/00-C
            sudu/data/original/113/00-C-answers
            sudu/teaching-candidates/113-role-b-c01-05-20261025
          sparse-checkout-cone-mode: false
      - name: Author A source and B teaching immutable original chain
        run: |
          set -euo pipefail
          test "$(git -C _source113 rev-parse HEAD)" = 5e8765ef512e05b551df8c3240b2c8fcfc4db920
          test -f _source113/sudu/data/original/113/00-C/p002-67c0d477e9-v2-w1400-q66.webp
          test -f _source113/sudu/data/original/113/00-C-answers/p001-9a6ce177b0-v2-w1400-q66.webp
          test -f _source113/sudu/data/years/113.json
          test -f _source113/sudu/data/processed/113/role-a-c01-05/manifest.json
          test -f _source113/sudu/teaching-candidates/113-role-b-c01-05-20261025/113-00-C-05.json
      - name: Install genuine Chromium and zh-TW glyph fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
          fc-cache -f
          family="$(fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1)"
          printf '%s\n' "$family" | grep -Eq '^Noto (Sans|Serif) CJK'
          python -m pip install -q pillow
          npm install --no-save playwright@1.51.1
          npx playwright install --only-shell chromium
      - name: Original publisher check and V4 build, then QA-only per-question browser
        run: |
          set -euo pipefail
          python scripts/sudu_verified_publish.py check
          python scripts/build.py
          test ! -e _site/sudu/data/approved/113.json
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/role-d113-original.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sudu/v4-115-multisubject-review-demo.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/sudu_role_d_113_c01_c05_original_v4.cjs
          test ! -e _site/sudu/data/approved/113.json
      - name: Archive FIVE separate authentic per-question receipts and 80 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-d-113-chinese-Q01-Q05-EACH-8x2-NO-RELEASE-${{ github.run_id }}
          path: test-results/role-d-113-c01-c05-original-v4/
          if-no-files-found: warn
          retention-days: 14
