name: 111 English Q30 Adjacent Graph Crop Repair (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/repair_111_english_q30.py
      - .github/workflows/111-english-q30-repair.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet pillow pytesseract
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - run: |
          python -m py_compile scripts/repair_111_english_q30.py
          python scripts/repair_111_english_q30.py
      - name: Commit only Q30 corrected v2 image and evidence
        run: |
          git config user.name '7581707 Q30 QA'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/111
          if ! git diff --cached --quiet; then
            git commit -m 'fix(111): Q30 v2 now excludes next graph; old crop remains failed'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin qa/114-115-official-visual-review
              if git push origin HEAD:qa/114-115-official-visual-review; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
