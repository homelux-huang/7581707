name: Protected approved sync candidate transport (NO RELEASE)
on:
  push:
    branches: [main, fix/protected-approved-sync-pr-20261027]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local Git transport and isolated gh fixture (not actual PR permission proof)
        run: python -m unittest discover -s tests -p test_sudu_sync_candidate.py -v
      - name: Unchanged independent E path-scope attack
        run: python tests/role_e_pr102_path_scope.py --root .
      - name: Unchanged independent E rename-scope attack
        run: python tests/role_e_pr102_rename_scope.py --root .
