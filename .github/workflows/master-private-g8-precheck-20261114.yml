name: MASTER private native G8 technical precheck (NO RELEASE)

on:
  push:
    branches:
      - fix/master-private-g8-technical-precheck-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-serializer-shape-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_QA_SHA: f9a6bc84531b5a6a8b5d57cde3828323e500cbbc
      EXPECTED_MAIN_PUBLISHER_BLOB: 64db5dd620dec230287ff0ea92a64b6e181e45a9
    steps:
      - name: Checkout own isolated MASTER preview code (no approval)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the real WebP decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify current release publisher is original and run security regressions
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/sudu_verified_publish.py)" = "$EXPECTED_MAIN_PUBLISHER_BLOB"
          python -m compileall -q scripts/sudu_g8_private_precheck_20261114.py
          python -m unittest discover -s tests -p 'test_sudu_g8_private_precheck_20261114.py' -v

      - name: Real QA G2 G3 and original author G5 to PRIVATE OS-temp serializer only
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/qa-readonly"
          PRIVATE="$(python -c 'import tempfile; print(tempfile.gettempdir())')/sudu-private-g8-ci"
          cleanup() { rm -rf "$PRIVATE"; git worktree remove --force "$SRC" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git fetch --no-tags origin qa/114-115-official-visual-review
          git worktree add --detach "$SRC" "$SOURCE_QA_SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_QA_SHA"
          test "$(sha256sum "$SRC/sudu/data/processed/115/questions.json" | cut -d ' ' -f1)" = "79aebbee28f83d31fa6d99ecce186973b0f4157284ba664a8072d250dca51c17"
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 114-00-E-11 \
            --teaching-sha ade6afe6e6791c632f566fc3612dca7d66d06f16d33e0cfdc37fc58c8b75ebdb
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-21 \
            --teaching-sha 4a6b65c172fabe1ed87a713ac2e5506c20afe02b56d82ed6943aa10dd54190d4
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-22 \
            --teaching-sha 5c68a96c6aa210d21e5a559e9d048875de2d36e481e2e78eb03b87401b98f600
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-20 \
            --teaching-sha 2b68e16c90d83e31c71cd6ca0a9d9b2cf279579fca4dc0ba3785ddec65a9362d
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-24 \
            --teaching-sha 317fe1d731f29e9634ec17f0fc1dc5c308b804de5759991a005f94f81bbffd06
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-25 \
            --teaching-sha a860b08a6f5b76fe1331dc4204a46a3135e511449d9b6004cc4f99be020e4d32
          # Source issue held honestly: the original 2x3 table revision is
          # 945457..., while protected-main text_revision ignores q.tables and
          # recomputes the former without-table 4dc7... fingerprint.
          # Never bypass or call this a G8 positive.
          python - "$SRC" <<'PY'
          import json, pathlib, sys
          from scripts import sudu_verified_publish as pub
          root=pathlib.Path(sys.argv[1])/"sudu/data/processed/115"
          q=next(x for x in json.loads((root/"questions.json").read_text())["questions"] if x["questionId"]=="115-00-MB-23")
          m=next(x for x in json.loads((root/"webp-manifest.json").read_text())["items"] if x["questionId"]=="115-00-MB-23")
          assert pub.text_revision(q,m["sha256"])=="4dc7a376e0b9e5929a0a0df3e652ea0811d3b662ddce431eff4ebc539c859731"
          assert q["textQaEvidence"]["questionRevision"]=="9454574017bc425f8c9a1c9854ca81547ff4b210b0c3ddc786d9e00ce1cc9fd4"
          assert q["tables"] and len(q["tables"][0]["heading"])==3 and len(q["tables"][0]["rows"])==2
          print("MB23: reproducible table-aware revision mismatch; EXPECTED HOLD, not source rewrite")
          PY
          if python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-23 \
            --teaching-sha 13fa628423177e2cf0ee5976d9dc19fc43e6112a0017f62f216fd12e305cc7c6 >"$RUNNER_TEMP/mb23-hold.log" 2>&1; then
            echo "SECURITY FAIL: MB23 false-positive table revision accepted"
            exit 1
          else
            grep -q 'TECHNICAL_PRECHECK_HOLD: G2/G3 source proof incomplete' "$RUNNER_TEMP/mb23-hold.log"
            test ! -f "$PRIVATE/115-00-MB-23.technical-precheck.json"
            echo "MB23 expected fail-closed table-revision HOLD verified (NOT G8)"
          fi
          rm -f "$RUNNER_TEMP/mb23-hold.log"
          PREVIEW_ROOT="$PRIVATE" python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ["PREVIEW_ROOT"])
          expected={"114-00-E-11", "115-00-MB-20", "115-00-MB-21", "115-00-MB-22", "115-00-MB-24", "115-00-MB-25"}
          files=list(root.glob("*.technical-precheck.json"))
          assert {p.name.replace(".technical-precheck.json", "") for p in files}==expected
          for path in files:
              obj=json.loads(path.read_text(encoding="utf-8"))
              assert obj["status"]=="TECHNICAL_PRECHECK_ONLY"
              assert obj["privateOnly"] is True
              assert obj["studentReleaseApproved"] is False
              assert obj["distinctAiReviewAuthorized"] is False
              assert obj["firstBlindProven"] is False
              assert obj["formalG8"] is False and obj["pagesEligible"] is False
              assert obj["serializedStudentShapeForPrivateInspectionOnly"]["canonicalId"]==obj["questionId"]
              assert path.stat().st_mode & 0o777 == 0o600
              im=root/"images"/(obj["questionId"]+".webp")
              assert hashlib.sha256(im.read_bytes()).hexdigest()==obj["originalWebpSha256"]
          assert not list(pathlib.Path(".").rglob("*.technical-precheck.json"))
          print("PASS: 6 genuine source/G5 native-shaped PRIVATE technical previews + MB23 expected HOLD; 0 G8/READY/LIVE")
          PY
          # Never upload or commit a preview: it includes answer-key data.
          test ! -d sudu/private-preview
          test ! -d sudu/data/approved/pre-g8

      - name: Verify source checkout did not rewrite any tracked file
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo 'NO RELEASE: no G6/E trust grant, no formal G8, no student approved mutation'
