name: MASTER private native G8 technical precheck (NO RELEASE)

on:
  push:
    branches:
      - fix/master-private-g8-technical-precheck-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-serializer-shape-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_QA_SHA: 7140fa078cb51dcceaa98a0a4b07bac1f5feb29f
      EXPECTED_MAIN_PUBLISHER_BLOB: 64db5dd620dec230287ff0ea92a64b6e181e45a9
    steps:
      - name: Checkout own isolated MASTER preview code (no approval)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the real WebP decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify current release publisher is original and run security regressions
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/sudu_verified_publish.py)" = "$EXPECTED_MAIN_PUBLISHER_BLOB"
          python -m compileall -q scripts/sudu_g8_private_precheck_20261114.py
          python -m unittest discover -s tests -p 'test_sudu_g8_private_precheck_20261114.py' -v

      - name: Real QA G2 G3 and original author G5 to PRIVATE OS-temp serializer only
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/qa-readonly"
          PRIVATE="$(python -c 'import tempfile; print(tempfile.gettempdir())')/sudu-private-g8-ci"
          cleanup() { rm -rf "$PRIVATE"; git worktree remove --force "$SRC" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git fetch --no-tags origin qa/114-115-official-visual-review
          git worktree add --detach "$SRC" "$SOURCE_QA_SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_QA_SHA"
          test "$(sha256sum "$SRC/sudu/data/processed/115/questions.json" | cut -d ' ' -f1)" = "79aebbee28f83d31fa6d99ecce186973b0f4157284ba664a8072d250dca51c17"
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 114-00-E-11 \
            --teaching-sha ade6afe6e6791c632f566fc3612dca7d66d06f16d33e0cfdc37fc58c8b75ebdb
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-21 \
            --teaching-sha 4a6b65c172fabe1ed87a713ac2e5506c20afe02b56d82ed6943aa10dd54190d4
          python -m scripts.sudu_g8_private_precheck_20261114 \
            --source "$SRC" --dest "$PRIVATE" --source-sha "$SOURCE_QA_SHA" \
            --qid 115-00-MB-22 \
            --teaching-sha 5c68a96c6aa210d21e5a559e9d048875de2d36e481e2e78eb03b87401b98f600
          PREVIEW_ROOT="$PRIVATE" python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ["PREVIEW_ROOT"])
          expected={"114-00-E-11", "115-00-MB-21", "115-00-MB-22"}
          files=list(root.glob("*.technical-precheck.json"))
          assert {p.name.replace(".technical-precheck.json", "") for p in files}==expected
          for path in files:
              obj=json.loads(path.read_text(encoding="utf-8"))
              assert obj["status"]=="TECHNICAL_PRECHECK_ONLY"
              assert obj["privateOnly"] is True
              assert obj["studentReleaseApproved"] is False
              assert obj["distinctAiReviewAuthorized"] is False
              assert obj["firstBlindProven"] is False
              assert obj["formalG8"] is False and obj["pagesEligible"] is False
              assert obj["serializedStudentShapeForPrivateInspectionOnly"]["canonicalId"]==obj["questionId"]
              assert path.stat().st_mode & 0o777 == 0o600
              im=root/"images"/(obj["questionId"]+".webp")
              assert hashlib.sha256(im.read_bytes()).hexdigest()==obj["originalWebpSha256"]
          assert not list(pathlib.Path(".").rglob("*.technical-precheck.json"))
          print("PASS: 3 genuine source/G5 native-shaped PRIVATE technical previews; 0 G8/READY/LIVE")
          PY
          # Never upload or commit a preview: it includes answer-key data.
          test ! -d sudu/private-preview
          test ! -d sudu/data/approved/pre-g8

      - name: Verify source checkout did not rewrite any tracked file
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo 'NO RELEASE: no G6/E trust grant, no formal G8, no student approved mutation'
