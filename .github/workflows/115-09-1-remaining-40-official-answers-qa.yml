name: 115 09-1 Q11-50 direct final official answers (G3 ONLY, NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/apply_115_09_1_q11_50_official_final_answers.py
      - .github/workflows/115-09-1-remaining-40-official-answers-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-115-09-1-q11-50-final-answers
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SHA-bound source, 40 exact candidate answers and official no-objection status
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/114-115-official-visual-review"
          python -m py_compile scripts/apply_115_09_1_q11_50_official_final_answers.py
          python scripts/apply_115_09_1_q11_50_official_final_answers.py --check
      - name: Apply G3 only, then prove idempotent SQLite and JSON
        run: |
          set -euo pipefail
          python scripts/apply_115_09_1_q11_50_official_final_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/q11-50-before
          python scripts/apply_115_09_1_q11_50_official_final_answers.py --stage
          sha256sum sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3} > /tmp/q11-50-after
          diff -u /tmp/q11-50-before /tmp/q11-50-after
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("sudu/data/processed/115")
          q=json.loads((p/"questions.json").read_text())
          inv=json.loads((p/"inventory.json").read_text())
          ae=json.loads((p/"official-answer-evidence.json").read_text())
          assert sum(x.get("answerVerified") is True for x in q["questions"])==56
          assert inv["officialAnswerIndependentVerified"]==ae["answerVerifiedCount"]==56
          assert inv["imageVisualQaPass"]==143
          assert inv["perSubject"]["商業概論"]["officialAnswerIndependentlyVerified"]==25
          assert inv["perSubject"]["數位科技"]["officialAnswerIndependentlyVerified"]==25
          assert not any(x.get("integrationReady") for x in q["questions"])
          assert json.loads((p/"release-manifest.json").read_text())["releaseAllowed"] is False
          print("PASS 115 09-1 50 final answers SHA+corrections verified; all other gates still blocked")
          PY
      - name: Commit isolated G3 evidence and staging SQLite only
        run: |
          set -euo pipefail
          git config user.name "7581707 Official Answer QA"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add -- sudu/data/processed/115/{questions.json,official-answer-evidence.json,inventory.json,VALIDATION.json,release-manifest.json,official-confirmation-status.json,question-bank.sqlite3}
          if ! git diff --cached --quiet; then
            git commit -m "qa(115): verify official final no-objection 09-1 Q11-Q50 individually, no release"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 115-09-1-direct-final-answer-Q11-Q50
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/115/QA_115_09_1_Q11_50_OFFICIAL_FINAL_ANSWERS_20261023.json
            sudu/data/processed/115/release-manifest.json
