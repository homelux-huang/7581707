name: Role B 114 C07/C09 source-image table and diagram lessons (NO RELEASE)
on:
  pull_request:
    paths:
      - "sudu/teaching-candidates/114-role-b-20261025-batch07/**"
      - "tests/test_114_role_b_batch07_20261025.py"
      - ".github/workflows/114-role-b-batch07-readonly-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-image-sha-source-g2-and-lesson-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check true WebP bytes/source pixels, answer-page blob, old visual QA, G2 chart text, lesson digests, release negatives
        run: python -m unittest discover -s tests -p 'test_114_role_b_batch07_20261025.py' -v
      - name: Explicit no-release assertion — G2/A/E/D/master remain pending
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('sudu/teaching-candidates/114-role-b-20261025-batch07/batch.json').read_text(encoding='utf-8'))
          assert b['itemCount']==2 and b['newReady']==b['newMain']==b['newLive']==0
          assert b['sourceG2']=='TABLE_AND_DIAGRAM_CHOICE_TEXT_UNCERTIFIED'
          assert b['distinctAiEContentReview']=='PENDING' and b['masterRelease']=='NOT_AUTHORIZED'
          for row in b['items']:
              d=json.loads(Path(row['path']).read_text(encoding='utf-8'))
              assert d['review']['status']=='BLOCKED'
              assert d['source']['sourceNeedsRoleACanonicalTableDiagramReconciliation']
              assert d['review']['independentAiContentReview']['status']=='PENDING_DISTINCT_ROLE_E'
              assert d['review']['formalReady'] is False
          print('NO RELEASE: 114 original chart/bubble author drafts remain G2, E, D, MASTER blocked')
          PY
