name: 105 shared passage 27-29 v4 repair (DRAFT ONLY)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/repair_105_shared_27_29_v4.py
      - .github/workflows/105-shared-passage-v4-repair.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-105-shared-v4-immutable
  cancel-in-progress: false
jobs:
  shared-crop-v4:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Verify exact preconditions
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'qa/114-115-official-visual-review'
          python -m py_compile scripts/repair_105_shared_27_29_v4.py
          python scripts/repair_105_shared_27_29_v4.py --validate-spec
          python scripts/repair_105_shared_27_29_v4.py --check
      - name: Stage idempotent v4 SHA-pinned draft (never QA promotion)
        run: |
          set -euo pipefail
          python scripts/repair_105_shared_27_29_v4.py --stage
          python scripts/repair_105_shared_27_29_v4.py --stage
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          base=Path('sudu/data/processed/105/qa-drafts')
          d=json.loads((base/'UNVERIFIED_105_SHARED_27_29_V4_20261023.json').read_text())
          f=Path(d['v4CandidateWebp'])
          assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==d['v4CandidateSha256']
          assert d['imageQaStatus'].startswith('DRAFT_') and not d['integrationReady']
          inv=json.loads(Path('sudu/data/processed/105/inventory.json').read_text())
          assert inv['answerOfficialFinalVerified']==0 and not inv['integrationReady']
          print('PASS: staged exactly one v4 shared material candidate without official QA release')
          PY
      - name: Commit v4 candidate to QA branch only
        run: |
          set -euo pipefail
          git config user.name "7581707 QA Draft Images"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add sudu/data/processed/105/qa-drafts/webp-v4/ sudu/data/processed/105/qa-drafts/UNVERIFIED_105_SHARED_27_29_V4_20261023.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(105): create immutable v4 shared passage candidate, not QA PASS'
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 105-shared-v4-direct-visual-review
          retention-days: 14
          if-no-files-found: error
          path: |
            sudu/data/original/105/00-C/p006-0a170905cb-v2-w1400-q66.webp
            sudu/data/processed/105/qa-drafts/webp-v3/shared/105-00-C-SHARED-27-29.webp
            sudu/data/processed/105/qa-drafts/webp-v4/shared/105-00-C-SHARED-27-29.webp
            sudu/data/processed/105/qa-drafts/UNVERIFIED_105_SHARED_27_29_V4_20261023.json
