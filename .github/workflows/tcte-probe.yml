name: Probe TCTE official exam links
on:
  push:
    paths:
      - scripts/probe_tcte.py
      - .github/workflows/tcte-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests beautifulsoup4
      - run: python scripts/probe_tcte.py
