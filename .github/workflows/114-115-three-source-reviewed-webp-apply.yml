name: 114-115 three directly reviewed WebP QA promotions (NO RELEASE)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/promote_114_115_three_direct_reviewed_crops.py
      - .github/workflows/114-115-three-source-reviewed-webp-apply.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-114-115-source-reviewed-three-webp-promotion
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pixel comparison dependency
        run: python -m pip install --quiet 'Pillow>=10,<12'
      - name: Verify exact source and reviewed-candidate SHA/geometry
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/114-115-official-visual-review"
          python -m py_compile scripts/promote_114_115_three_direct_reviewed_crops.py
          python scripts/promote_114_115_three_direct_reviewed_crops.py --check
      - name: Update only three image QA and staging DB; prove idempotence
        run: |
          set -euo pipefail
          python scripts/promote_114_115_three_direct_reviewed_crops.py --stage
          sha256sum sudu/data/processed/{114,115}/{questions.json,webp-manifest.json,inventory.json,VALIDATION.json,release-manifest.json,question-bank.sqlite3,VISUAL_QA.json} > /tmp/visual-before.sha
          python scripts/promote_114_115_three_direct_reviewed_crops.py --stage
          sha256sum sudu/data/processed/{114,115}/{questions.json,webp-manifest.json,inventory.json,VALIDATION.json,release-manifest.json,question-bank.sqlite3,VISUAL_QA.json} > /tmp/visual-after.sha
          diff -u /tmp/visual-before.sha /tmp/visual-after.sha
          python - <<'PY'
          import json
          from pathlib import Path
          for year, expected, added in ((114,25,1),(115,143,2)):
              root=Path(f"sudu/data/processed/{year}")
              manifest=json.loads((root/"webp-manifest.json").read_text())
              bank=json.loads((root/"questions.json").read_text())
              assert sum(x.get("qaStatus")=="PASS" for x in manifest["items"])==expected
              assert sum(q.get("answerVerified") is True for q in bank["questions"]) == (0 if year==114 else 6)
              assert not any(q.get("integrationReady") for q in bank["questions"])
              assert json.loads((root/"release-manifest.json").read_text())["releaseAllowed"] is False
              print(f"PASS {year}: {expected}/205 visually reviewed images; answers and shared materials separately blocked")
          PY
      - name: Commit only QA data, never main or LIVE
        run: |
          set -euo pipefail
          git config user.name "7581707 Direct Pixel QA"
          git config user.email "7581707-qa-bot@users.noreply.github.com"
          git add -- sudu/data/processed/{114,115}/{questions.json,webp-manifest.json,inventory.json,VALIDATION.json,release-manifest.json,question-bank.sqlite3,VISUAL_QA.json}
          if ! git diff --cached --quiet; then
            git commit -m "qa(114,115): three SHA-reviewed pixel repairs; keep answer and release blocked"
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 114-115-three-direct-visual-source-WebP-QA
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sudu/data/processed/114/qa-drafts/DIRECT_VISUAL_114C01_115C16_17_20261023.json
            sudu/data/processed/114/VISUAL_QA.json
            sudu/data/processed/115/VISUAL_QA.json
            sudu/data/processed/114/VALIDATION.json
            sudu/data/processed/115/VALIDATION.json
