name: 107 English 32-35 + both shared original-page visual QA G1 (NO RELEASE)
on:
  push:
    branches:
      - qa/114-115-official-visual-review
    paths:
      - scripts/apply_107_e32_35_direct_g1.py
      - .github/workflows/107-e32-35-direct-visual-g1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa107-e32-35-direct-G1
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin latest QA HEAD and update only independently visually inspected evidence
        run: |
          echo "QA_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python scripts/apply_107_e32_35_direct_g1.py
      - name: G1 and G5 strict validation without G2/G3/release promotion
        run: |
          python - <<'PY_CHECK'
          import json
          from pathlib import Path
          base=Path('sudu/data/processed/107')
          m=json.loads((base/'webp-manifest.json').read_text())
          q=json.loads((base/'questions.json').read_text())
          inv=json.loads((base/'inventory.json').read_text())
          v=json.loads((base/'VISUAL_QA.json').read_text())
          e=json.loads((base/'qa-drafts/DIRECT_VISUAL_107_E32_35_SHARED_20261024.json').read_text())
          rel=json.loads((base/'release-manifest.json').read_text())
          assert inv['visualQaPass']==v['passCount']==4
          assert inv['webpGeneratedDrafts']==189 and inv['sharedMaterialsVerified']==2
          assert len(e['items'])==6 and e['newG1QuestionPass']==4 and e['newG1SharedPass']==2
          assert e['reviewer']=='ChatGPT assistant' and e['independentHumanReview'] is False
          for n in range(32,36):
              id=f'107-00-E-{n:02d}'
              question=next(x for x in q['questions'] if x['questionId']==id)
              img=next(x for x in m['items'] if x['questionId']==id)
              assert img['qaStatus']==question['imageQaStatus']=='PASS'
              assert not question['answerVerified'] and not question['questionVerified'] and not question['integrationReady']
          for n in (36,37):
              img=next(x for x in m['items'] if x['questionId']==f'107-00-E-{n:02d}')
              assert img['qaStatus']=='DRAFT_NEEDS_DIRECT_VISUAL_QA'
          assert rel['releaseAllowed'] is False and rel['integrationReady'] is False
          print('107 English Q32-35 G1 4 + 2 shared, official final answer still 0, no release')
          PY_CHECK
      - name: Store direct G1 evidence, manifest, G5 with SHA lease and no force
        run: |
          set -eu
          git add sudu/data/processed/107/webp-manifest.json sudu/data/processed/107/questions.json
          git add sudu/data/processed/107/VISUAL_QA.json sudu/data/processed/107/inventory.json
          git add sudu/data/processed/107/VALIDATION.json sudu/data/processed/107/release-manifest.json
          git add sudu/data/processed/107/question-bank.sqlite3
          git add sudu/data/processed/107/qa-drafts/DIRECT_VISUAL_107_E32_35_SHARED_20261024.json
          git add sudu/data/processed/105-115-SQLITE_G5_READONLY_AUDIT.json
          git diff --cached --check
          git fetch origin qa/114-115-official-visual-review
          if [ "$(git rev-parse FETCH_HEAD)" != "$QA_BASE" ]; then
            echo "Concurrent QA update; no force or stale write"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "qa(107): direct visual Q32-35 and weather/Chi shared with SHA, no G2/G3 release"
          git push origin HEAD:refs/heads/qa/114-115-official-visual-review
