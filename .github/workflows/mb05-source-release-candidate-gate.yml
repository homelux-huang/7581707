name: MB05 independently evidenced source release candidate gate (NO DEPLOY)
on:
  push:
    branches: [qa/mb05-verified-candidate-v4-20261024]
    paths:
      - 'sudu/data/processed/115/review-evidence/115-00-MB-05-*.json'
      - 'sudu/data/processed/115/verified-student-batch.json'
      - '.github/workflows/mb05-source-release-candidate-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2b48a4aee849e38eee7ac47a77a3977c34c3779c
          path: current-main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original WebP decoder required by unchanged publisher
        run: python -m pip install -q pillow
      - name: Run UNMODIFIED publisher source admission and verify 4 old plus 1 new
        run: |
          set -eu
          mkdir -p mb05-stage-only
          python current-main/scripts/sudu_verified_publish.py stage --source . --dest mb05-stage-only --sha "$(git rev-parse HEAD)" > /tmp/mb05-stage-report.json
          python current-main/scripts/sudu_verified_publish.py check --dest mb05-stage-only
          python - <<'PY'
          import hashlib,importlib.util,json
          from pathlib import Path
          root=Path('.').resolve()
          spec=importlib.util.spec_from_file_location('pub',root/'current-main/scripts/sudu_verified_publish.py')
          pub=importlib.util.module_from_spec(spec);spec.loader.exec_module(pub)
          bank=pub.read(root/'sudu/data/processed/115/questions.json')
          q=next(x for x in bank['questions'] if x['questionId']=='115-00-MB-05')
          manifest=pub.read(root/'sudu/data/processed/115/webp-manifest.json')
          item=next(x for x in manifest['items'] if x['questionId']==q['questionId'])
          cert=pub.reviewed_student_batches(root,115)['115-00-MB-05']
          result=pub.apply_independently_certified_review(root,115,q,item,cert)
          revision=pub.text_revision(q,item['sha256'])
          assert revision=='3b0a4236f9298edd225b445592faee3b222c8ecfc1b62425278a0de576cc1df9'
          assert result.get('studentReleaseApproved') is True and result.get('teachingQaStatus')=='PASS' and result.get('uiQaStatus')=='PASS', 'candidate source admission rejected'
          assert pub.source_proof(result,True,True,revision)==(True,True)
          assert pub.independently_solved(result,revision)=='matched'
          assert pub.teaching_complete(result,'數學 B','B')
          assert pub.certificates_complete(root,result,item,{})
          digest=hashlib.sha256(json.dumps(result['teaching'],ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert digest=='70063f1c4b68979aac9828cdb0dc36a7562591da4f0537bdd0e6f791609827c3','UI/teaching digest changed'
          file=pub.read(root/'mb05-stage-only/sudu/data/approved/115.json')
          assert file['approvedCount']==5
          ids=[x['canonicalId'] for x in file['questions']]
          assert sorted(ids)==sorted(['115-00-MB-02','115-00-MB-03','115-00-MB-04','115-00-MB-05','115-00-MB-09'])
          old=pub.read(root/'current-main/sudu/data/approved/115.json')
          assert old['approvedCount']==4
          for prior in old['questions']:
              assert prior in file['questions'],'existing approved student content changed'
          assert next(x for x in file['questions'] if x['canonicalId']=='115-00-MB-05')['answer']=='B'
          assert result['textQaEvidence']['questionRevision']==revision
          print('PASS: unmodified publisher admits 1 new real MB05, preserves all 4 previously approved, exact source/teaching/ui SHAs, NO MAIN WRITE, NO RELEASE')
          PY
      - name: Upload candidate admission result without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb05-source-candidate-staging-no-deploy
          path: |
            /tmp/mb05-stage-report.json
            mb05-stage-only/sudu/data/approved/115.json
            mb05-stage-only/sudu/data/approved/progress.json
          if-no-files-found: ignore
          retention-days: 30
