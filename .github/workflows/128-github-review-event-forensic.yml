name: P0 actual GitHub reviewer event and key authorization fail closed (NO RELEASE)
on:
  push:
    branches: [fix/128-trusted-gh-review-event-20261025]
    paths:
      - scripts/sudu_independent_review_gate.py
      - tests/test_sudu_independent_review_gate.py
      - tests/test_sudu_certified_overlay.py
      - sudu/release-governance/**
      - .github/workflows/128-github-review-event-forensic.yml
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  identity_provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6fea22296877e31d9f1d3bd01d987b0096ddcf1b
          path: _historical_unauthorized_six
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual cryptographic verifier and WebP decoder
        run: python -m pip install -q cryptography pillow
      - name: Test full real signature, trusted GitHub author, PR reviewer event, official evidence and revoked signer
        run: |
          set -eu
          python -m unittest discover -s tests -p 'test_sudu_independent_review_gate.py' -v
          python -m unittest discover -s tests -p 'test_sudu_certified_overlay.py' -v
          python -m unittest discover -s tests -p 'test_sudu_verified_publish.py' -v
      - name: Reject historical Econ34 self-review and preserve five existing live questions
        run: |
          set -eu
          python scripts/sudu_verified_publish.py stage --source _historical_unauthorized_six --dest /tmp/unsigned-old-six --sha 6fea22296877e31d9f1d3bd01d987b0096ddcf1b
          python scripts/sudu_verified_publish.py check --dest /tmp/unsigned-old-six
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/unsigned-old-six/sudu/data/approved/115.json').read_text())
          baseline=json.loads(Path('sudu/data/approved/115.json').read_text())
          assert actual['approvedCount']==baseline['approvedCount']==5
          assert actual['questions']==baseline['questions']
          print('PASS P0: externally unapproved new question blocked; unchanged five preserved')
          PY
