name: 106 Chinese C36-38 direct printed-source image and shared G1 QA (NO RELEASE)
on:
  push:
    branches:
      - qa/114-115-official-visual-review
    paths:
      - scripts/apply_106_c36_38_direct_visual_qa.py
      - .github/workflows/106-c36-38-direct-visual-g1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-106-c36-38-direct-visual
  cancel-in-progress: false
jobs:
  apply_review:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin base branch HEAD
        run: echo "QA_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify 106 C36/37/38 and page7 shared original SHA and record direct G1 evidence
        run: python scripts/apply_106_c36_38_direct_visual_qa.py
      - name: Read-only 11 years' G5 and independent G1/G3 flag guards
        run: |
          python - <<'PY_VERIFY'
          import json
          from pathlib import Path
          from sys import path
          path.insert(0,'scripts')
          from audit_105_115_sqlite_readonly import audit_year
          root=Path('sudu/data/processed/106')
          m=json.loads((root/'webp-manifest.json').read_text())
          q=json.loads((root/'questions.json').read_text())
          v=json.loads((root/'VISUAL_QA.json').read_text())
          inv=json.loads((root/'inventory.json').read_text())
          rel=json.loads((root/'release-manifest.json').read_text())
          e=json.loads((root/'qa-drafts/DIRECT_VISUAL_106_C36_38_SHARED_20261024.json').read_text())
          assert inv['visualQaPass']==v['passCount']==15
          assert inv['webpGeneratedDrafts']==204 and len(m['sharedMaterialCrops'])==4
          assert len(e['items'])==4 and e['newIndividualQaPassCount']==3
          assert e['reviewer']=='ChatGPT assistant' and e['independentHumanReview'] is False
          assert len({x['questionId'] for x in q['questions']})==204
          for n in (36,37,38):
              qid=f'106-00-C-{n:02d}'
              row=next(x for x in q['questions'] if x['questionId']==qid)
              item=next(x for x in m['items'] if x['questionId']==qid)
              assert row['imageQaStatus']==item['qaStatus']=='PASS'
              assert item['visualReviewEvidence']['reviewedSha256']==item['outputSha256']
              assert not row['questionVerified'] and not row['answerVerified'] and not row['integrationReady']
          assert not rel['releaseAllowed'] and not rel['integrationReady']
          assert all(audit_year(y)['g5Pass'] for y in range(105,116))
          print('106 G1 3 individual + 1 shared evidence SHA pass, G5 11/11, NO RELEASE')
          PY_VERIFY
      - name: Save verified QA evidence with non-force head lease
        run: |
          set -eu
          git add sudu/data/processed/106/webp-manifest.json sudu/data/processed/106/questions.json
          git add sudu/data/processed/106/VISUAL_QA.json sudu/data/processed/106/inventory.json
          git add sudu/data/processed/106/VALIDATION.json sudu/data/processed/106/release-manifest.json
          git add sudu/data/processed/106/question-bank.sqlite3
          git add sudu/data/processed/106/qa-drafts/DIRECT_VISUAL_106_C36_38_SHARED_20261024.json
          git add sudu/data/processed/105-115-SQLITE_G5_READONLY_AUDIT.json
          git diff --cached --check
          git fetch origin qa/114-115-official-visual-review
          if [ "$(git rev-parse FETCH_HEAD)" != "$QA_BASE" ]; then
            echo "QA branch advanced from another session; refuse stale push"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "qa(106): directly review source P7/P8 C36-38 and shared G1, retain G2/G3 blocks"
          git push origin HEAD:refs/heads/qa/114-115-official-visual-review
