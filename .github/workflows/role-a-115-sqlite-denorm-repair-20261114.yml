name: ROLE A 115 SQLite exact projection repair (NO RELEASE)
on:
  push:
    branches: [fix/role-a-115-sqlite-denorm-20261114]
  pull_request:
    branches: [qa/114-115-official-visual-review]
permissions:
  contents: read
jobs:
  exact_projection_repair:
    if: >-
      github.repository == 'homelux-huang/7581707' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/fix/role-a-115-sqlite-denorm-20261114') ||
       (github.event_name == 'pull_request' && github.head_ref == 'fix/role-a-115-sqlite-denorm-20261114' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            .github/workflows
            sudu/data/processed/114
            sudu/data/processed/115
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact QA input for immutable before-after verification
        run: git fetch --no-tags --depth=1 origin 099f26b120fa350c5d88beb8e4642996be1ceac2
      - name: Verify only reported denormalized cells and inventory DB SHA changed
        run: python scripts/role_a_115_sqlite_denorm_repair_20261114.py --verify
      - name: Current both-year payload and full 115 projection integrity
        run: python scripts/qa_current_source_integrity_20261114.py
      - name: Real baseline and corrupt-input negative regressions
        run: |
          python -m unittest discover -s tests -p 'test_role_a_115_sqlite_denorm_repair_20261114.py' -v
          python -m unittest discover -s tests -p 'test_qa_current_source_integrity_20261114.py' -v
      - name: Confirm read-only verification
        run: git diff --exit-code
