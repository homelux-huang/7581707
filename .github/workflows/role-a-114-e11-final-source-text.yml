name: Role A 114 English11 authentic printed stem/options and source SHA (NO RELEASE)
on:
  push:
    branches:
      - qa/role-a-114-e11-final-source-text-20261028
    paths:
      - sudu/data/processed/114/review-evidence/114-00-E-11-source-text-20261028.json
      - tests/test_role_a_114_e11_final_source_text_receipt.py
      - docs/ROLE_A_114_E11_SOURCE_TEXT_20261028.md
      - .github/workflows/role-a-114-e11-final-source-text.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-a-114-e11-source-question-20261028
  cancel-in-progress: false

jobs:
  immutable_source_qa_not_new_student_approval:
    if: github.repository == 'homelux-huang/7581707' && github.ref == 'refs/heads/qa/role-a-114-e11-final-source-text-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read-only checkout exact ROLE A isolated branch
        uses: actions/checkout@v4
        with:
          ref: qa/role-a-114-e11-final-source-text-20261028
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow only for original WebP RGB QA (no OCR or redrawing)
        run: python -m pip install -q Pillow==11.3.0
      - name: Source 114 E11 exact printable original + whole original 205 bank SQLite read-only
        run: |
          set -euo pipefail
          python -m py_compile tests/test_role_a_114_e11_final_source_text_receipt.py
          python -m unittest discover -s tests -p test_role_a_114_e11_final_source_text_receipt.py -v
      - name: Regression original 114 E11/E13/E14 real official printed answers + 205 SQLite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_role_a_114_e11_e13_e14_final_official.py -v
      - name: No source bank, SQLite, image or student release changes
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa/role-a-114-e11-final-source-text-20261028"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          echo "NO ROLE A QUESTION FLAG PROMOTION, NO E/D/MAIN/PAGES. Existing 114 E11 answer A reused from PR94."
