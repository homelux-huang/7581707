name: MASTER MB23 original 2x3 table-aware publisher QREV (NO RELEASE)

on:
  push:
    branches:
      - fix/master-mb23-table-revision-publisher-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate-original-table-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_QA_SHA: f9a6bc84531b5a6a8b5d57cde3828323e500cbbc
    steps:
      - name: Checkout isolated publisher change only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pillow to verify untouched WebP preview behavior
        run: python -m pip install --disable-pip-version-check pillow
      - name: Acquire original QA exact source commit READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(python -c 'import tempfile;print(tempfile.gettempdir())')/sudu-qa-mb23-readonly"
          git fetch --no-tags origin qa/114-115-official-visual-review
          git worktree add --detach "$SRC" "$SOURCE_QA_SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_QA_SHA"
          test "$(sha256sum "$SRC/sudu/data/processed/115/questions.json" | cut -d ' ' -f1)" = "79aebbee28f83d31fa6d99ecce186973b0f4157284ba664a8072d250dca51c17"
          echo "SUDU_TABLE_SOURCE_QA=$SRC" >> "$GITHUB_ENV"
      - name: Original 2x3 source QREV accepted; tampered/legacy rejected
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts/sudu_verified_publish.py tests/test_sudu_mb23_table_revision_20261114.py
          python -m unittest discover -s tests -p 'test_sudu_mb23_table_revision_20261114.py' -v
      - name: Full original verified publisher stage in runner temp - NO Pages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python -c 'import tempfile;print(tempfile.gettempdir())')/sudu-table-revision-test-stage"
          python -m scripts.sudu_verified_publish stage --source "$SUDU_TABLE_SOURCE_QA" --dest "$OUT" --sha "$SOURCE_QA_SHA" > "$RUNNER_TEMP/publisher-staged-report.json"
          python -m scripts.sudu_verified_publish check --dest "$OUT"
          STAGED="$OUT" python - <<'PY'
          import json, os, pathlib
          out=pathlib.Path(os.environ["STAGED"])/"sudu/data/approved"
          a=json.loads((out/"114.json").read_text(encoding="utf-8"))
          b=json.loads((out/"115.json").read_text(encoding="utf-8"))
          assert a["approvedCount"]==0
          assert b["approvedCount"]==5
          assert {x["canonicalId"] for x in b["questions"]} == {
             "115-00-MB-02","115-00-MB-03","115-00-MB-04",
             "115-00-MB-05","115-00-MB-09"
          }
          assert "115-00-MB-23" not in {x["canonicalId"] for x in b["questions"]}
          print("PASS: authentic table-aware MB23 G2 source, historic 5 EXACT, NEW READY 0, NEW LIVE 0")
          PY
          rm -rf "$OUT" "$RUNNER_TEMP/publisher-staged-report.json"
      - name: No source, student, or main mutation in this candidate
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test ! -d sudu/data/approved/private
          echo "NO RELEASE: E/G6/trusted V1 and D formal G8 remain mandatory"
