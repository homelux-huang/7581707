name: MASTER E12 GitHub Models catalog reachability (NO SOLVER)
on:
  push:
    branches:
      - coord/master-e12-external-github-models-first-solve-20261110
    paths:
      - .github/workflows/master-e12-github-models-catalog-probe-20261110.yml
permissions:
  contents: read
  models: read
jobs:
  verify_provider_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check authenticated provider model catalog (not an inference request)
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error,hashlib,json
          for u in (
              "https://models.github.ai/catalog/models",
              "https://models.github.ai/inference/chat/completions",
          ):
              req=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GITHUB_MODELS_TOKEN"],"Accept":"application/json","X-GitHub-Api-Version":"2022-11-28"},method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=20) as f:
                      b=f.read()
                      print(json.dumps({"endpoint":u,"status":f.status,"contentType":f.headers.get("Content-Type"),"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"previewNoncredential":b[:250].decode("utf-8","replace")},sort_keys=True))
              except urllib.error.HTTPError as e:
                  b=e.read()
                  print(json.dumps({"endpoint":u,"status":e.code,"contentType":e.headers.get("Content-Type"),"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"previewNoncredential":b[:250].decode("utf-8","replace")},sort_keys=True))
              except Exception as e:
                  print(json.dumps({"endpoint":u,"errorType":type(e).__name__,"errorText":str(e)[:100]},sort_keys=True))
          PY
