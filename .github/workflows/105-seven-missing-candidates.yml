name: 105 Seven Missing WebP Candidate Stage (QA DRAFT ONLY)
on:
  push:
    branches: [qa/114-115-official-visual-review]
    paths:
      - scripts/stage_105_7_missing_and_shared_drafts.py
      - .github/workflows/105-seven-missing-candidates.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-105-seven-draft-only
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for source-bound WebP
        run: python -m pip install --quiet Pillow
      - name: Preconditions - sources, hashes and source branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'qa/114-115-official-visual-review'
          python -m py_compile scripts/stage_105_7_missing_and_shared_drafts.py
          python scripts/stage_105_7_missing_and_shared_drafts.py --check
      - name: Build DRAFT-only 7 single-question + 2 shared WebP
        run: |
          set -euo pipefail
          python scripts/stage_105_7_missing_and_shared_drafts.py --stage
          python scripts/stage_105_7_missing_and_shared_drafts.py --stage
          python - <<'PY'
          import json, pathlib, hashlib
          d=pathlib.Path('sudu/data/processed/105/qa-drafts')
          report=json.loads((d/'UNVERIFIED_105_GAPS_20261023.json').read_text())
          assert len(report['items']) == 9
          assert sum(len(x['questionIds'])==1 for x in report['items']) == 7
          assert sum(x['assetId'].startswith('105-00-C-SHARED') for x in report['items'])==2
          assert all(x['imageQaStatus'].startswith('DRAFT_') and not x['integrationReady'] for x in report['items'])
          for x in report['items']:
              p=pathlib.Path(x['output'])
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest() == x['outputSha256']
          inv=json.loads(pathlib.Path('sudu/data/processed/105/inventory.json').read_text())
          assert inv['visualQaPass']==0 and inv['webpGeneratedDrafts']==197 and inv['answerOfficialFinalVerified']==0
          print('PASS: 7 missing draft WebP + 2 shared materials, no QA promotion')
          PY
      - name: Commit staged DRAFT assets to QA branch only
        run: |
          set -euo pipefail
          git config user.name '7581707 QA Draft Images'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/105/qa-drafts/
          if ! git diff --cached --quiet; then
            git commit -m 'data(105): stage seven missing WebP and two shared drafts (NOT QA)'
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 105-gap-stage-metadata
          if-no-files-found: ignore
          retention-days: 30
          path: sudu/data/processed/105/qa-drafts/UNVERIFIED_105_GAPS_20261023.json
