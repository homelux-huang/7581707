name: 114 Official Answer Q15 Evidence Repair (NO RELEASE)
on:
  push:
    branches:
      - qa/114-115-official-visual-review
    paths:
      - scripts/repair_114_official_answer_image_gaps.py
      - .github/workflows/114-answer-visual-gap-repair.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudu-114-answer-evidence-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/qa/114-115-official-visual-review'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/114-115-official-visual-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Recover Q15 candidate matches while blocking final verification
        run: |
          python -m py_compile scripts/repair_114_official_answer_image_gaps.py
          python scripts/repair_114_official_answer_image_gaps.py
      - name: Commit ONLY 114 draft corrections, never main
        run: |
          git config user.name '7581707 114 QA evidence bot'
          git config user.email '7581707-qa-bot@users.noreply.github.com'
          git add sudu/data/processed/114/questions.json sudu/data/processed/114/official-answer-evidence.json sudu/data/processed/114/inventory.json sudu/data/processed/114/question-bank.sqlite3 sudu/data/processed/114/114-ANSWER-15-IMAGE-EVIDENCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(114): reconcile five Q15 official image matches, keep answerVerified false'
            git pull --rebase origin qa/114-115-official-visual-review
            git push origin HEAD:qa/114-115-official-visual-review
          fi
