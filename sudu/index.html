</style></head><body><header class="header"><div class="head"><div><div class="brand">7581707 統測「速讀」平台</div><div class="subtitle">09 商業與管理群｜逐題學習 · 小學生白話解說 · 錯題診療室</div></div><button id="export">⇩ 匯出學習紀錄</button></div></header><div class="filters"><div class="filterin"><label>學年度<select id="year"></select></label><label>試卷<select id="paper"></select></label><label>科目<select id="subject"></select></label><div class="status" id="status">載入題庫中…</div></div></div><div class="wrap"><div class="intro"><div><h1>快速進入學習｜選科目後立即作答</h1><div class="study-identity"><span id="study-identity">正在辨識本機學習紀錄…</span><button id="quick-dashboard">查看完整進度 Dashboard ↗</button></div></div><div class="nums"><div class="num"><b id="answered">0</b><span>已回答</span></div><div class="num"><b id="wrong">0</b><span>待複習</span></div></div></div><div class="tabs" role="tablist" aria-label="平台功能"><button data-tab="learn" class="active" role="tab">逐題速讀</button><button data-tab="dashboard" role="tab">我的 Dashboard</button><button data-tab="clinic" role="tab">首次答錯複習</button><button data-tab="archive" role="tab">歷年試卷</button><button data-tab="source" role="tab">教材與出處</button></div><main id="screen"></main><div class="footer">題目正式來源：技專校院入學測驗中心。此預覽版本含 64 題自編題；90～115 年正式原題尚未經逐年完整 OCR、校對、詳解與章節審核，不得誤標已完成。教科書與章節以官方及實際教材為準。</div></div><div class="bottom" id="bottom"><button id="prev">↑ 上一題</button><span id="count">—</span><button id="next">下一題 ↓</button></div><input id="db-import-file" type="file" accept="application/json,.json" aria-label="還原學習紀錄備份"><script id="bootstrap" type="application/json">{"practice":[{"id":"practice-會計學-01","year":"自編","kind":"自編練習","subject":"會計學","topic":"會計基本概念","level":"基礎","question":"小華用家裡的錢買自己的腳踏車，能直接記成家中商店的設備嗎？","options":["可以，老闆就是商店","不行，私人和商店的帳要分開","只要腳踏車很貴就可以","看心情決定"],"answer":1,"explanation":"想像有兩個錢包：一個是小華的，一個是商店的。兩個錢包不能混在一起，這叫企業個體假設。","wrongOptions":["老闆與企業雖有關係，仍須分開記帳。","","價格不是決定帳屬於誰的依據。","會計不能靠心情記帳。"],"steps":"先問誰的財產？屬於個人。再問是否投入商店？沒有。因此不是商店設備。","extension":"若私人資產正式投入企業作為出資，才可能由企業入帳。","practice":{"question":"老闆拿公司現金付私人電影票，算公司營業費用嗎？","answer":"不算。是私人支出，應按實際情況記帳。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-會計學-02","year":"自編","kind":"自編練習","subject":"會計學","topic":"毛利與銷貨成本","level":"基礎","question":"阿明進一批玩具花 300 元，全部賣了 500 元，毛利是多少？","options":["800 元","500 元","200 元","300 元"],"answer":2,"explanation":"像賣一個玩具：收到 500 元，先拿掉買玩具花的 300 元，剩下 200 元就是毛利。","wrongOptions":["把收入和成本相加了。","只看收入，忘記扣成本。","","300 元是成本，不是毛利。"],"steps":"毛利＝銷貨淨額－銷貨成本＝500－300＝200。","extension":"毛利還沒扣掉店租和員工薪資，不等於淨利。","practice":{"question":"賣飲料收入 900 元、飲料成本 620 元，毛利是多少？","answer":"900－620＝280 元。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-會計學-03","year":"自編","kind":"自編練習","subject":"會計學","topic":"借貸法則","level":"基礎","question":"商店用現金買入一張 2,000 元的桌子，哪個會計項目會增加？","options":["現金","設備","銷貨收入","應付帳款"],"answer":1,"explanation":"桌子進到商店，設備變多了；現金付出去，現金反而變少。","wrongOptions":["現金付出去，餘額會減少。","","這不是賣東西，沒有銷貨收入。","已付現金，沒有欠供應商錢。"],"steps":"借：設備 2,000；貸：現金 2,000。","extension":"資產增加記借方、資產減少記貸方；但「借方」不是借錢。","practice":{"question":"店家用現金買冷氣，借方應記什麼？","answer":"設備。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-會計學-04","year":"自編","kind":"自編練習","subject":"會計學","topic":"流動比率","level":"基礎","question":"商店有流動資產 60,000 元、流動負債 30,000 元，流動比率是多少？","options":["0.5","1","2","3"],"answer":2,"explanation":"手上近期可用的資源是短期要還的錢的兩倍，就像你有 200 元，短期只需要付 100 元。","wrongOptions":["30,000÷60,000 算反了。","把分子與分母誤認相同。","","沒有理由變成 3 倍。"],"steps":"流動比率＝流動資產÷流動負債＝60,000÷30,000＝2。","extension":"營運資金＝流動資產－流動負債＝30,000。","practice":{"question":"流動資產 90,000、流動負債 45,000，流動比率？","answer":"2。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-會計學-05","year":"自編","kind":"自編練習","subject":"會計學","topic":"存貨計價","level":"基礎","question":"有 3 個筆記本，先買的每本 10 元，後買的每本 20 元。採先進先出，賣掉 1 本的成本是多少？","options":["10 元","20 元","15 元","30 元"],"answer":0,"explanation":"就像排隊買午餐：最早進來的筆記本先出去，第一本的成本是 10 元。","wrongOptions":["","20 元是後來買的成本。","15 元是平均數，不是先進先出。","30 元是兩本相加。"],"steps":"FIFO：先賣出第一批 → 1×10＝10。","extension":"先進先出不是說貨物一定物理上先被搬走，而是成本計價的假設。","practice":{"question":"先買 5 個每個 8 元，後買 5 個每個 9 元；先進先出賣 3 個成本？","answer":"3×8＝24 元。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-會計學-06","year":"自編","kind":"自編練習","subject":"會計學","topic":"權責基礎","level":"基礎","question":"補習班 12 月先收到學生明年 1 月的學費，12 月應全部當成已賺到的收入嗎？","options":["應該，拿到現金就算賺到","不應該，尚未提供課程","只認列成本","先記成設備"],"answer":1,"explanation":"錢雖然拿到手，但課還沒上，補習班還欠學生一份服務，就像預收禮物但還沒送。","wrongOptions":["現金收到不等於服務已完成。","","收入何時認列與成本不是同一件事。","收到學費不會讓設備增加。"],"steps":"12 月可先記預收收入（負債）；明年上課提供服務時，才轉成收入。","extension":"權責基礎看「事情發生」而不只看現金有沒有進出。","practice":{"question":"房東 6 月預收 7 月房租，6 月算已賺到的租金嗎？","answer":"尚未，應先視為預收租金。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-會計學-07","year":"自編","kind":"自編練習","subject":"會計學","topic":"折舊","level":"基礎","question":"一台機器成本 12,000 元，預計使用 4 年，殘值 0。採直線法，每年折舊多少？","options":["3,000","4,000","8,000","12,000"],"answer":0,"explanation":"機器會慢慢用舊，不能把全部費用都塞在第一年，就像一塊蛋糕平均切 4 份。","wrongOptions":["","4,000 是錯把年數當 3 年。","8,000 不是平均分四年。","12,000 是全部成本。"],"steps":"直線法折舊＝(成本－殘值)÷耐用年限＝(12,000－0)÷4＝3,000。","extension":"折舊是成本的分攤，不是公司每年再花一次現金。","practice":{"question":"成本 15,000、殘值 3,000、耐用 3 年，每年折舊？","answer":"(15,000－3,000)÷3＝4,000。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-會計學-08","year":"自編","kind":"自編練習","subject":"會計學","topic":"銀行調節表","level":"基礎","question":"公司已開出 1,000 元支票，但收款人還沒到銀行領錢。做銀行端調節時應如何處理？","options":["銀行存款餘額加 1,000","銀行存款餘額減 1,000","公司帳上加 1,000","全部不用管"],"answer":1,"explanation":"公司以為已經付了，但銀行還沒真的扣錢，所以銀行帳面看起來比較多，要把未兌現支票扣掉。","wrongOptions":["方向相反；銀行餘額偏高要減。","","這不是公司新收到的錢。","若要調到正確餘額就得調整銀行端。"],"steps":"銀行端調整後餘額＝對帳單餘額＋在途存款－未兌現支票。","extension":"銀行服務費通常在公司帳上補記；未兌現支票通常在銀行端調節。","practice":{"question":"銀行對帳單 20,000，未兌現支票 3,000，沒有其他事項，銀行端調整後？","answer":"20,000－3,000＝17,000。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-01","year":"自編","kind":"自編練習","subject":"經濟學","topic":"需求法則","level":"基礎","question":"飲料每杯從 30 元漲到 50 元，其他情況不變，大家通常會怎樣？","options":["買更多","買更少","一定買一樣多","每個人都不買"],"answer":1,"explanation":"零用錢一樣多，但飲料變貴，你通常會少買幾杯。這就是需求法則。","wrongOptions":["價格變高通常不會讓需求量上升。","","價格變動可能影響想買的數量。","不一定完全沒有人買。"],"steps":"價格上升 → 需求量通常下降（其他條件不變）。","extension":"價格變動造成需求量變動；口味或所得改變可能使整條需求曲線移動。","practice":{"question":"餅乾降價、其他不變，需求量通常如何？","answer":"增加。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-02","year":"自編","kind":"自編練習","subject":"經濟學","topic":"機會成本","level":"基礎","question":"你只有一小時，可以看電影或讀書。選擇讀書，最主要的機會成本是什麼？","options":["讀書變厲害","放棄看電影的最好價值","一小時變成兩小時","什麼都沒放棄"],"answer":1,"explanation":"選 A 就不能同時選 B。機會成本就是放棄的選項中，最有價值的那個。","wrongOptions":["這是可能的收穫。","","時間不會增加。","資源有限，選擇通常會有放棄。"],"steps":"1. 找出選擇：讀書。2. 找出放棄的最好選項：看電影。3. 其價值就是機會成本。","extension":"機會成本不只指金錢，也包括時間與其他放棄的機會。","practice":{"question":"假日只能去運動或打電動，你選運動，機會成本可能是？","answer":"放棄打電動所帶來的最好效益。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-03","year":"自編","kind":"自編練習","subject":"經濟學","topic":"均衡價格","level":"基礎","question":"夜市某款玩具很多人在搶購，但貨很少，市場價格通常有什麼壓力？","options":["上漲","下跌","一定變零","永遠不變"],"answer":0,"explanation":"排隊的人多，玩具少，代表想買的數量超過想賣的數量，價格容易被往上推。","wrongOptions":["","下跌多半與供過於求有關。","短缺不代表完全免費。","市場價格可能調整。"],"steps":"需求量 \u003e 供給量 → 超額需求（短缺）→ 價格有上漲壓力。","extension":"價格上升可能使買的人減少、願意賣的人增加，逐漸靠近均衡。","practice":{"question":"供給量大於需求量，價格常有什麼壓力？","answer":"下跌。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-04","year":"自編","kind":"自編練習","subject":"經濟學","topic":"彈性","level":"基礎","question":"同樣是漲價 10%，A 商品購買量大減，B 商品購買量只減一點。哪個需求比較有彈性？","options":["A","B","一樣","都沒有"],"answer":0,"explanation":"如果只是稍微漲價大家就不買，表示對價格很敏感，需求比較有彈性。","wrongOptions":["","B 反應比較小。","反應差很多，不可能一樣。","需求反應不是零。"],"steps":"需求價格彈性看：需求量變動百分比÷價格變動百分比（通常取絕對值）。","extension":"替代品越多的商品，需求往往比較有彈性。","practice":{"question":"漲價 5% 需求量降 20%，彈性絕對值多少？","answer":"20%÷5%＝4。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-05","year":"自編","kind":"自編練習","subject":"經濟學","topic":"比較利益","level":"基礎","question":"甲做一份簡報要 1 小時，寫報告要 4 小時；乙做簡報要 2 小時，寫報告要 2 小時。誰寫報告比較有比較利益？","options":["甲","乙","一樣","資訊不足"],"answer":1,"explanation":"比較利益不是比誰最快，而是比「做這件事要放棄多少別的事」。乙寫報告的犧牲比較小。","wrongOptions":["甲寫報告犧牲 4 份簡報。","","兩人的機會成本不同。","有足夠的時間資料可算機會成本。"],"steps":"甲寫報告機會成本 4 份簡報；乙寫報告機會成本 1 份簡報 → 乙有比較利益。","extension":"絕對利益比較速度；比較利益比較機會成本。","practice":{"question":"誰做簡報有比較利益？","answer":"甲。甲 1 份簡報放棄 1/4 份報告，乙放棄 1 份。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-06","year":"自編","kind":"自編練習","subject":"經濟學","topic":"國內生產毛額","level":"基礎","question":"麵包店今年做出 1,000 元麵包賣給消費者，若材料已算在麵包價格內，GDP 要把原料再加一次嗎？","options":["要，越多越好","不要，避免重複計算","只算原料","完全不算麵包"],"answer":1,"explanation":"做蛋糕用的麵粉已包含在蛋糕售價裡，再把麵粉算一次，就像把同一份東西算兩遍。","wrongOptions":["會重複計算中間財。","","GDP 常以最終財與服務衡量。","最終出售的麵包應計入適當年度 GDP。"],"steps":"最終財價值＝1,000；中間投入成本不另外重複相加。","extension":"GDP 衡量境內生產的最終財與服務市價，不等於每個人的幸福。","practice":{"question":"買麵粉做成蛋糕販售，最終蛋糕價值已含麵粉，麵粉要重算嗎？","answer":"不用。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-07","year":"自編","kind":"自編練習","subject":"經濟學","topic":"外部效果","level":"基礎","question":"有人在公園亂丟垃圾，讓別人得花時間清理。這是什麼經濟概念？","options":["正外部效果","負外部效果","規模經濟","完全競爭"],"answer":1,"explanation":"亂丟的人只顧自己方便，卻讓旁邊的人承擔麻煩，這就是負外部效果。","wrongOptions":["讓別人受到額外好處才比較像正外部效果。","","與生產規模降成本不同。","不能由此判斷市場結構。"],"steps":"私人成本未包含旁人的清理負擔 → 社會成本較高 → 負外部效果。","extension":"教育、疫苗接種等可有正外部效果，須看情境與受益者。","practice":{"question":"鄰居種花讓整條街更美，可能屬於哪種外部效果？","answer":"正外部效果。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-經濟學-08","year":"自編","kind":"自編練習","subject":"經濟學","topic":"邊際效用","level":"基礎","question":"第一杯珍奶很好喝，連喝第三杯反而沒有那麼快樂。這是哪個現象？","options":["邊際效用遞增","邊際效用遞減","需求完全無彈性","通貨膨脹"],"answer":1,"explanation":"第一杯讓你很滿足，再來一杯的額外快樂通常比第一杯少。","wrongOptions":["通常額外滿足變少。","","這不是價格反應問題。","與整體物價上漲無關。"],"steps":"邊際效用＝多消費一單位所增加的總效用；隨著飲用杯數增加，邊際效用可能下降。","extension":"邊際效用降低，不代表總效用一定立刻下降。","practice":{"question":"第一塊蛋糕增加 10 點快樂，第二塊增加 6 點，邊際效用有何變化？","answer":"從 10 降到 6，呈遞減。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-01","year":"自編","kind":"自編練習","subject":"商業概論","topic":"行銷4P","level":"基礎","question":"早餐店決定每份三明治賣多少錢，最直接屬於行銷 4P 哪一項？","options":["產品 Product","價格 Price","通路 Place","推廣 Promotion"],"answer":1,"explanation":"4P 就像開小店的四個決定：賣什麼、賣多少、在哪賣、怎麼告訴大家。決定售價就是 Price。","wrongOptions":["產品講的是賣什麼。","","通路是在哪裡賣、如何送到買家。","推廣是廣告和促銷。"],"steps":"關鍵字：定價、售價、折扣 → Price。","extension":"價格是 4P 之一；消費者角度也可從 4C 思考。","practice":{"question":"決定在夜市擺攤，屬於 4P 哪一項？","answer":"Place（通路）。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-02","year":"自編","kind":"自編練習","subject":"商業概論","topic":"SWOT分析","level":"基礎","question":"便利商店附近新開一間大賣場，對原店家最可能是 SWOT 的什麼？","options":["優勢 S","劣勢 W","機會 O","威脅 T"],"answer":3,"explanation":"新競爭者像隔壁又開一家同類店，可能搶走客人，是店外面來的威脅。","wrongOptions":["優勢是自己內部做得好。","劣勢是自己內部做得不夠好。","機會是外部有利因素。",""],"steps":"新競爭者＝外部、可能不利 → Threat 威脅。","extension":"S/W 是內部，O/T 是外部；好壞要看對企業影響。","practice":{"question":"店家員工服務很親切、回購率高，是哪一類？","answer":"優勢 Strength。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-03","year":"自編","kind":"自編練習","subject":"商業概論","topic":"連鎖加盟","level":"基礎","question":"加盟店使用總部的品牌與經營制度，通常需要依契約支付什麼？","options":["加盟相關費用","一定免費","政府固定補助","不用遵守規範"],"answer":0,"explanation":"就像借用別人已經很有名的招牌，通常要付錢、遵守規矩。","wrongOptions":["","加盟不保證免費。","不代表一定有政府補助。","加盟往往要遵守品牌規範。"],"steps":"依契約可能有加盟金、權利金、採購及管理義務。","extension":"加盟優點是品牌與制度支援；缺點是自主權較少。","practice":{"question":"加盟者完全可以不照總部作業規定嗎？","answer":"通常不行，須依契約遵守。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-04","year":"自編","kind":"自編練習","subject":"商業概論","topic":"電子商務","level":"基礎","question":"消費者在網路商店向企業購買鞋子，屬於哪種電子商務？","options":["B2B","B2C","C2C","G2G"],"answer":1,"explanation":"B 是企業，C 是消費者。企業賣給你，就是 B→C。","wrongOptions":["B2B 是企業賣企業。","","C2C 是消費者對消費者。","G2G 是政府對政府。"],"steps":"B2C＝Business to Consumer。","extension":"C2C 常見於個人彼此交易；O2O 強調線上到線下串接。","practice":{"question":"公司向另一家公司大量採購電腦，是哪種模式？","answer":"B2B。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-05","year":"自編","kind":"自編練習","subject":"商業概論","topic":"企業社會責任","level":"基礎","question":"企業除了賺錢，也努力減少污染並照顧員工，最符合哪種觀念？","options":["只看短期獲利","企業社會責任 CSR","價格歧視","任意壟斷"],"answer":1,"explanation":"好的商店不能只管賺錢，也要想到環境、員工和鄰居的感受。","wrongOptions":["忽視環境與人不符合敘述。","","價格歧視與題意無關。","壟斷與題意無關。"],"steps":"關鍵字：環境、社會、治理、員工與利害關係人 → CSR。","extension":"ESG 是環境、社會、治理三面向的架構，與 CSR 有關但概念不完全相同。","practice":{"question":"公司減少包裝垃圾，較偏向 ESG 的哪一面？","answer":"環境 E。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-06","year":"自編","kind":"自編練習","subject":"商業概論","topic":"顧客關係","level":"基礎","question":"一家店記住常客喜好、主動提供適合商品，最主要在強化什麼？","options":["顧客關係管理 CRM","固定資產折舊","期末存貨","機會成本"],"answer":0,"explanation":"像早餐店老闆記得你喜歡蛋餅不加醬，會讓你願意再來。這就是重視顧客關係。","wrongOptions":["","折舊是會計概念。","存貨是商品庫存。","機會成本是選擇的代價。"],"steps":"顧客資料 → 了解需求 → 個人化服務 → 維持關係。","extension":"管理顧客資料也必須尊重隱私與個人資料保護。","practice":{"question":"超商會員提供符合個人喜好的優惠，是 CRM 應用嗎？","answer":"是。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-07","year":"自編","kind":"自編練習","subject":"商業概論","topic":"物流與效用","level":"基礎","question":"商店把水果從產地運到市區，讓消費者方便買到，創造哪種效用？","options":["形式效用","時間效用","空間效用","所有權效用"],"answer":2,"explanation":"本來水果在遠方，運到你家附近，讓你不用跑去果園，這是「地點」的方便。","wrongOptions":["形式效用是改變商品樣貌或功能。","時間效用讓商品在需要時可取得。","","所有權效用著重權利移轉。"],"steps":"運輸讓商品到需要的地方 → 空間效用。","extension":"物流也可經由儲存創造時間效用。","practice":{"question":"把夏天的商品保存到冬天賣，較重視什麼效用？","answer":"時間效用。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-商業概論-08","year":"自編","kind":"自編練習","subject":"商業概論","topic":"損益平衡","level":"基礎","question":"每賣一杯飲料賺 20 元用來支付固定租金 2,000 元，不考慮其他固定費用，要賣幾杯才能打平？","options":["20 杯","50 杯","100 杯","200 杯"],"answer":2,"explanation":"像每賣一杯就往房租存錢筒放 20 元，存滿 2,000 元就打平。","wrongOptions":["20 杯只有 400 元。","50 杯只有 1,000 元。","","200 杯已超過打平數量。"],"steps":"損益平衡銷量＝固定成本÷單位邊際貢獻＝2,000÷20＝100 杯。","extension":"單位邊際貢獻＝售價－單位變動成本。","practice":{"question":"固定成本 3,000 元、每杯邊際貢獻 15 元，損益平衡杯數？","answer":"3,000÷15＝200 杯。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-01","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"電腦硬體","level":"基礎","question":"電腦的 CPU 最像人體的哪個部分？","options":["大腦","鞋子","水杯","書包"],"answer":0,"explanation":"CPU 負責依照指令進行運算與控制，像大腦幫忙處理事情。","wrongOptions":["","鞋子不是運算中心。","水杯不負責運算。","書包只是收納工具。"],"steps":"CPU＝中央處理器，負責執行指令。","extension":"RAM 像暫時使用的桌面；SSD 像長期放檔案的櫃子。","practice":{"question":"關機後通常仍保存檔案的是 RAM 還是 SSD？","answer":"SSD。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-02","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"資料安全","level":"基礎","question":"收到假冒銀行簡訊要求立即點連結輸入密碼，最安全的第一步是？","options":["馬上點","把密碼傳給朋友","不要點，改從官方管道查證","把網址轉傳全班"],"answer":2,"explanation":"有人說他是銀行，但你不認識，就像陌生人要你把家裡鑰匙交給他，先不要相信。","wrongOptions":["可能落入釣魚網站。","傳密碼更危險。","","轉傳可能讓更多人受害。"],"steps":"不要點陌生連結 → 自行打開銀行官方 App／網站或致電客服查證。","extension":"多因素驗證有幫助，但仍需防備假網站與社交工程。","practice":{"question":"陌生人要你提供簡訊驗證碼，應該怎麼辦？","answer":"不提供，先查證。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-03","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"二進位","level":"基礎","question":"電腦二進位的 101 等於十進位多少？","options":["3","4","5","6"],"answer":2,"explanation":"二進位只有 0 和 1。101 就像有 1 個四、0 個二、1 個一，合起來是 5。","wrongOptions":["3 的二進位是 11。","4 的二進位是 100。","","6 的二進位是 110。"],"steps":"1×2²＋0×2¹＋1×2⁰＝4＋0＋1＝5。","extension":"二進位每往左一位，位值乘以 2。","practice":{"question":"二進位 110 轉十進位？","answer":"4＋2＝6。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-04","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"網路基礎","level":"基礎","question":"瀏覽器網址開頭的 HTTPS，主要比 HTTP 多了什麼重要保護？","options":["保證網站不可能是假","傳輸加密與驗證機制","讓電腦不用網路","免除所有病毒"],"answer":1,"explanation":"像把寄出的信放在有鎖的信封裡，別人比較難偷看途中內容。","wrongOptions":["有 HTTPS 仍可能是詐騙網站。","","仍需要網路才能連線。","HTTPS 無法防止所有惡意程式。"],"steps":"HTTPS 使用 TLS 加密傳輸，並透過憑證協助確認連線對象。","extension":"看到鎖頭不代表網站一定可靠，仍應看網址與內容。","practice":{"question":"有 HTTPS 的網站還可能是釣魚網站嗎？","answer":"可能。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-05","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"資料表示","level":"基礎","question":"1 Byte 通常等於多少 bits？","options":["2","4","8","16"],"answer":2,"explanation":"bit 是一個 0 或 1 的小格子，8 個小格子湊成 1 Byte。","wrongOptions":["不是 2。","不是 4。","","16 bits 是 2 Bytes。"],"steps":"1 Byte＝8 bits。","extension":"網路速度常用 bps（位元/秒），檔案大小常用 Byte。","practice":{"question":"2 Bytes 有幾 bits？","answer":"16 bits。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-06","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"雲端運算","level":"基礎","question":"使用線上雲端硬碟與同學共用作業，最接近哪個優點？","options":["只能在原本電腦開","方便協作與跨裝置存取","網路永遠不會斷","檔案不可能遺失"],"answer":1,"explanation":"像把作業放在大家可依權限打開的置物櫃，不必一直傳 USB。","wrongOptions":["雲端服務通常可跨裝置使用。","","仍可能受到斷網影響。","仍須注意權限、備份與帳號安全。"],"steps":"雲端服務＋權限管理 → 多人協作、同步使用。","extension":"共用連結應設定合適的查看／編輯權限。","practice":{"question":"分享報告時不想讓別人修改，應設成什麼權限？","answer":"檢視者。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-07","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"資料庫","level":"基礎","question":"圖書館用每本書唯一的編號區分書籍，資料庫裡最像哪個觀念？","options":["主鍵","背景圖片","螢幕解析度","滑鼠游標"],"answer":0,"explanation":"全班可能有同名的人，所以要用學號區分。資料庫的主鍵就像每筆資料專屬的學號。","wrongOptions":["","背景圖片不是資料識別欄位。","解析度和資料表無關。","游標不負責辨認資料列。"],"steps":"主鍵 Primary Key：能唯一識別表格中每一筆紀錄。","extension":"外鍵 Foreign Key 可連結其他資料表，建立關聯。","practice":{"question":"學生資料表以學號區分學生，學號可當主鍵嗎？","answer":"通常可以，若保證唯一且不為空。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技概論-08","year":"自編","kind":"自編練習","subject":"數位科技概論","topic":"AI素養","level":"基礎","question":"AI 回答了一個很確定的歷史日期，最好的做法是？","options":["直接相信","核對可靠來源","只看字數多少","多問同一句就一定正確"],"answer":1,"explanation":"AI 可能像同學一樣記錯，回答很有自信不代表一定對。","wrongOptions":["AI 可能產生錯誤內容。","","回答長不代表正確。","重複提問不保證正確。"],"steps":"先查權威來源 → 比對日期與事件 → 再引用。","extension":"這類看似流暢卻不實的內容，常稱生成式 AI 的幻覺。","practice":{"question":"AI 提供的統測答案，應拿什麼核對？","answer":"考試中心公布的標準答案。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-01","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"試算表公式","level":"基礎","question":"在試算表儲存格輸入 =SUM(A1:A3)，會做什麼？","options":["把 A1 到 A3 相加","刪除 A1 到 A3","把字放大","畫一張地圖"],"answer":0,"explanation":"像把三個錢筒的錢一起數一數，SUM 就是加總。","wrongOptions":["","SUM 不會刪除資料。","字體大小不是 SUM 功能。","沒有自動產生地圖。"],"steps":"SUM(A1:A3)＝A1＋A2＋A3。","extension":"範圍 A1:A3 包含 A1、A2、A3 三格。","practice":{"question":"A1=2、A2=3、A3=5，SUM(A1:A3) 結果？","answer":"10。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-02","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"試算表參照","level":"基礎","question":"複製公式時，不想讓 B2 的參照位置改變，應寫成什麼？","options":["B2","$B$2","B$","2B"],"answer":1,"explanation":"像把椅子固定在教室某個位置，不管公式搬到哪裡，都要看同一張椅子。","wrongOptions":["這是相對參照，複製時可能改變。","","不是完整的儲存格參照。","欄列順序寫錯。"],"steps":"$B$2 同時鎖定欄 B 與列 2。","extension":"$B2 只鎖欄，B$2 只鎖列。","practice":{"question":"只想固定第 2 列，不固定 B 欄，怎麼寫？","answer":"B$2。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-03","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"簡報設計","level":"基礎","question":"一張簡報塞滿密密麻麻的小字，最應該怎樣改善？","options":["再塞更多字","拆成重點並提高可讀性","背景越花越好","所有字改成 6pt"],"answer":1,"explanation":"簡報像在教同學，不是把整本書貼上去。重點清楚，大家才看得懂。","wrongOptions":["會更難閱讀。","","背景太花會干擾內容。","6pt 過小，不利閱讀。"],"steps":"一頁一重點 → 精簡文字 → 大字體和足夠對比。","extension":"圖表要有清楚標題，顏色應有意義而非裝飾。","practice":{"question":"遠距離看投影片字太小，先改善什麼？","answer":"放大重要文字並刪除多餘內容。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-04","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"資料篩選","level":"基礎","question":"班級成績表只想暫時看到「大於 80 分」的同學，應用什麼功能？","options":["刪除所有低分資料","篩選","格式刷","工作表重新命名"],"answer":1,"explanation":"像用篩子只挑出符合條件的東西，其他資料還在，只是暫時不顯示。","wrongOptions":["刪除資料會造成損失。","","格式刷是複製樣式。","重新命名不影響顯示的資料列。"],"steps":"資料 → 篩選 → 設定分數 \u003e 80。","extension":"篩選通常不改變原本資料；排序會改變呈現順序。","practice":{"question":"要按照分數高到低排列，應用「篩選」還是「排序」？","answer":"排序。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-05","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"資料圖表","level":"基礎","question":"要比較 5 家飲料店本月賣出的杯數，哪種圖通常最清楚？","options":["長條圖","流程圖","組織圖","甘特圖"],"answer":0,"explanation":"就像五個人比身高，用五根不同長度的柱子最容易比大小。","wrongOptions":["","流程圖描述步驟。","組織圖顯示層級關係。","甘特圖顯示專案時程。"],"steps":"類別比較數量 → 長條圖。","extension":"時間趨勢常用折線圖；占比有時可用圓餅圖。","practice":{"question":"觀察 12 個月營收變化趨勢，較適合什麼圖？","answer":"折線圖。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-06","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"資訊倫理","level":"基礎","question":"報告用了別人的照片，最好的做法是？","options":["不寫來源","確認授權並標註來源","說是自己拍的","把浮水印去掉"],"answer":1,"explanation":"借別人的東西要先問可不可以，也要說清楚是誰做的。","wrongOptions":["沒有授權可能侵權。","","冒充作者不誠實。","移除浮水印可能侵害權益。"],"steps":"檢查授權條件 → 按規定使用 → 附上作者、來源與授權資訊。","extension":"網路找得到，不代表可以任意重製商用。","practice":{"question":"圖片標示 CC BY 時，一般須做什麼？","answer":"按授權條款標示作者與來源。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-07","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"試算表IF","level":"基礎","question":"儲存格 A1 是 85。公式 =IF(A1\u003e=60,\"及格\",\"不及格\") 會顯示什麼？","options":["及格","不及格","85分以外皆空白","公式錯誤"],"answer":0,"explanation":"IF 像一個簡單的分岔路：85 有沒有大於等於 60？有，就走「及格」那條路。","wrongOptions":["","85 不小於 60。","IF 會依條件顯示文字。","公式寫法在一般試算表可用。"],"steps":"判斷 85\u003e=60 為真 → 顯示第一個文字參數「及格」。","extension":"IF 可與 AND、OR 搭配處理多個條件。","practice":{"question":"A1=55，這個 IF 會顯示什麼？","answer":"不及格。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數位科技應用-08","year":"自編","kind":"自編練習","subject":"數位科技應用","topic":"文件協作","level":"基礎","question":"三人同時修改同一份報告，要知道誰改了哪些地方，哪個功能最有用？","options":["版本紀錄","螢幕保護程式","音量控制","桌面捷徑"],"answer":0,"explanation":"像一本有修改日記的筆記本，大家能看到先前改過什麼。","wrongOptions":["","螢幕保護程式無關。","音量不會記錄文件異動。","捷徑只是開檔便利。"],"steps":"開啟版本歷程或修訂追蹤 → 比對變更。","extension":"協作也應設定合適的編輯權限，避免誤改。","practice":{"question":"誤刪一段內容後，想回到昨天版本，可以找什麼？","answer":"版本紀錄。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-01","year":"自編","kind":"自編練習","subject":"國文","topic":"修辭：譬喻","level":"基礎","question":"「她的笑容像太陽一樣溫暖」用了哪種修辭？","options":["排比","譬喻","設問","誇飾"],"answer":1,"explanation":"把一個東西比成另一個東西，像在說「笑容像太陽」，讓你更有畫面感。","wrongOptions":["不是一串相似句子。","","不是提出問題。","重點是比喻，不是把程度故意說很大。"],"steps":"看到「像、如、彷彿」等提示，先考慮明喻。","extension":"譬喻分明喻、隱喻、略喻等，不能只靠一個字判斷全部。","practice":{"question":"「時間是一條河」較接近哪種修辭？","answer":"譬喻，屬隱喻。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-02","year":"自編","kind":"自編練習","subject":"國文","topic":"成語","level":"基礎","question":"「畫蛇添足」最接近哪個意思？","options":["多做不必要的事反而壞事","做事很有創意","做事速度快","畫畫技術好"],"answer":0,"explanation":"蛇本來畫好就可以交卷，還硬要加腳，反而變奇怪。","wrongOptions":["","創意不是這個成語的重點。","沒有強調速度。","不是稱讚畫技。"],"steps":"故事核心：已經足夠 → 多加不需要的東西 → 造成反效果。","extension":"做題時先抓字面故事，再轉成抽象意思。","practice":{"question":"作文已寫清楚，硬加不相關內容，可能用哪個成語？","answer":"畫蛇添足。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-03","year":"自編","kind":"自編練習","subject":"國文","topic":"文意推論","level":"基礎","question":"一段文章說「下雨雖打亂行程，卻讓我們發現街角的小書店」。作者最可能強調什麼？","options":["所有雨天都不好","意外也可能帶來驚喜","書店只能雨天開","行程永遠不重要"],"answer":1,"explanation":"本來很掃興，結果發現一個寶藏地方。文章要說的是事情換個角度看，可能有好處。","wrongOptions":["作者的感受後來轉好。","","文章沒有說這點。","不是要否定所有行程。"],"steps":"轉折詞「卻」之後通常藏著作者想強調的新發現。","extension":"閱讀理解可找轉折詞、反覆出現的詞與結尾句。","practice":{"question":"看到「雖然……但是……」，重點常落在哪部分？","answer":"通常在「但是」之後，仍須看全文。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-04","year":"自編","kind":"自編練習","subject":"國文","topic":"語氣與標點","level":"基礎","question":"哪一句最適合用問號結尾？","options":["今天的天氣真好","你今天有帶課本嗎","我明天去圖書館","請保持安靜"],"answer":1,"explanation":"問號像一個人在向你發問，這句是在問對方有沒有帶課本。","wrongOptions":["是陳述或感嘆。","","是陳述。","是請求或命令。"],"steps":"辨認是否提問 →「嗎」＋問句語意 → 問號。","extension":"反問句也可能用問號，但真正目的是加強語氣。","practice":{"question":"「難道你不想進步嗎」末尾適合什麼符號？","answer":"問號。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-05","year":"自編","kind":"自編練習","subject":"國文","topic":"詞語運用","level":"基礎","question":"「他每次考前都按部就班複習」的「按部就班」是什麼意思？","options":["依一定順序循序漸進","只做自己喜歡的事","臨時抱佛腳","把事情弄亂"],"answer":0,"explanation":"就像走樓梯，一階一階踏穩，不會亂跳。","wrongOptions":["","不等於只做喜歡的事情。","與臨時抱佛腳相反。","正是有次序而不混亂。"],"steps":"按部＝依照步驟；就班＝按次序做事。","extension":"此成語常用於學習、工作等有計畫的活動。","practice":{"question":"每天依進度讀一章，可以用哪個成語形容？","answer":"按部就班。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-06","year":"自編","kind":"自編練習","subject":"國文","topic":"段落主旨","level":"基礎","question":"文章先介紹垃圾問題，再說明如何分類回收，最後呼籲大家減量。主旨是什麼？","options":["教人買更多商品","鼓勵落實垃圾減量與回收","介紹城市交通","分享料理食譜"],"answer":1,"explanation":"整篇都在說垃圾要少、要分好類，重點不可能突然跳到交通或料理。","wrongOptions":["與文章方向相反。","","文中沒有交通主軸。","與主題無關。"],"steps":"抓開頭問題＋中段做法＋結尾呼籲 → 主旨。","extension":"主旨題不要只挑某個細節，要能概括整篇。","practice":{"question":"一篇介紹節電方法並呼籲節能的文章，主旨可能是？","answer":"節約能源、從日常生活做起。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-07","year":"自編","kind":"自編練習","subject":"國文","topic":"借代","level":"基礎","question":"「白衣天使」常用來指哪種工作者？","options":["廚師","護理人員","郵差","工程師"],"answer":1,"explanation":"不是說真的有翅膀，而是用親切的稱呼代替某一類人。","wrongOptions":["不是常見的該稱呼。","","一般不如此稱呼。","一般不如此稱呼。"],"steps":"白衣天使 → 以特徵或稱呼指代護理人員 → 借代。","extension":"借代不一定有「像」，與譬喻不同。","practice":{"question":"「杏林」在語文中常借指哪個領域？","answer":"醫界。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-國文-08","year":"自編","kind":"自編練習","subject":"國文","topic":"書信格式","level":"基礎","question":"寫信給老師，最後使用「敬祝 教安」最接近什麼功能？","options":["問候祝頌","寫收件地址","標題","附註照片"],"answer":0,"explanation":"像說「祝老師教學順利、平安」，是信末的禮貌祝福。","wrongOptions":["","不是地址。","不是整封信的主題名稱。","與照片無關。"],"steps":"依對象選擇合宜祝頌詞；「教安」常用於師長。","extension":"正式信件應注意稱謂、正文、祝頌與署名。","practice":{"question":"給朋友的日常信件，可用較親切或正式的問候語嗎？","answer":"可以，依關係與情境調整。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-01","year":"自編","kind":"自編練習","subject":"英文","topic":"一般現在式","level":"基礎","question":"She ___ to school every day.","options":["go","goes","going","gone"],"answer":1,"explanation":"She 是一個人，說她每天都去上學；現在簡單式動詞 go 要變成 goes。","wrongOptions":["第三人稱單數不能直接用 go。","","going 需要搭配 be 等。","gone 通常與完成式搭配。"],"steps":"主詞 she＋一般現在式 → goes。","extension":"he / she / it 作主詞時，肯定句動詞常加 s 或 es。","practice":{"question":"He ___ breakfast at 7. (eat)","answer":"eats。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-02","year":"自編","kind":"自編練習","subject":"英文","topic":"過去式","level":"基礎","question":"Yesterday, Tom ___ a book.","options":["buy","buys","bought","buying"],"answer":2,"explanation":"Yesterday 是昨天，動作已經發生。buy 的過去式是不規則的 bought。","wrongOptions":["buy 是原形。","buys 是現在式。","","buying 不是本句所需的過去式。"],"steps":"yesterday → 過去時間 → bought。","extension":"不規則動詞要熟悉：go/went, buy/bought, eat/ate。","practice":{"question":"Last week, I ___ to Taipei. (go)","answer":"went。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-03","year":"自編","kind":"自編練習","subject":"英文","topic":"介系詞","level":"基礎","question":"The cat is ___ the table.（貓在桌子下方）","options":["on","in","under","between"],"answer":2,"explanation":"桌子像一把大雨傘，貓躲在它下面，就是 under。","wrongOptions":["on 是在上面。","in 是在裡面。","","between 是在兩者之間。"],"steps":"桌子下方 → under。","extension":"位置介系詞常見 in/on/under/behind/next to。","practice":{"question":"書在桌上，英文可說 on 或 under the desk？","answer":"on。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-04","year":"自編","kind":"自編練習","subject":"英文","topic":"閱讀理解","level":"基礎","question":"Mia takes the bus because her home is far from school. Why does Mia take the bus?","options":["She likes rain.","Her home is far away.","She dislikes buses.","She forgot her lunch."],"answer":1,"explanation":"because 後面直接講原因：她家離學校很遠。讀題先找 because。","wrongOptions":["文中沒有下雨。","","文中沒有不喜歡公車。","文中沒提便當。"],"steps":"抓 Why 問題 → 找 because → her home is far from school。","extension":"閱讀題通常能在文章找到關鍵詞，不必逐字翻譯。","practice":{"question":"Lily drinks water because she is thirsty. Why does she drink water?","answer":"Because she is thirsty。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-05","year":"自編","kind":"自編練習","subject":"英文","topic":"比較級","level":"基礎","question":"This box is ___ than that one.（這個箱子更重）","options":["heavy","heavier","heaviest","most heavy"],"answer":1,"explanation":"兩個箱子比重量，會用「比較級」。heavy 變 heavier，搭配 than。","wrongOptions":["heavy 是原級。","","heaviest 是最高級。","較不自然且非標準答案。"],"steps":"兩者比較 → heavier than。","extension":"形容詞字尾是子音+y，常改 y 為 i 再加 er：happy→happier。","practice":{"question":"easy 的比較級？","answer":"easier。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-06","year":"自編","kind":"自編練習","subject":"英文","topic":"助動詞","level":"基礎","question":"___ you help me, please?","options":["Can","Am","Does","Was"],"answer":0,"explanation":"想請人幫忙，像說「你可以幫我嗎？」用 Can 最自然。","wrongOptions":["","Am 不直接這樣搭配 you help。","Does 應搭配原形及第三人稱單數主詞。","Was 不能接 you help 形成此種請求句。"],"steps":"Can＋主詞＋原形動詞。","extension":"Can 也可以表達能力：I can swim。","practice":{"question":"「你會游泳嗎？」英文怎麼問？","answer":"Can you swim?"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-07","year":"自編","kind":"自編練習","subject":"英文","topic":"被動語態","level":"基礎","question":"The window ___ yesterday.（窗戶昨天被打破）","options":["break","is breaking","was broken","has break"],"answer":2,"explanation":"窗戶不是自己做事，而是「被打破」，而且發生在昨天，要用過去式被動。","wrongOptions":["動詞型態不對，也缺被動語意。","是正在破裂的形式。","","完成式也寫錯。"],"steps":"過去式被動＝was/were＋過去分詞 → was broken。","extension":"被動語態強調接受動作的對象。","practice":{"question":"The cake ___ made yesterday. (is/was)","answer":"was。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-英文-08","year":"自編","kind":"自編練習","subject":"英文","topic":"常見單字","level":"基礎","question":"What does “borrow” mean?","options":["借入","借出","購買","丟棄"],"answer":0,"explanation":"borrow 是「向別人借進來」，lend 才是「借給別人」。","wrongOptions":["","lend 是借出。","buy 是買。","throw away 是丟掉。"],"steps":"borrow something from someone；lend something to someone。","extension":"常一起考 borrow/lend、bring/take、say/tell。","practice":{"question":"I ___ a pen from my friend. (borrow/lend)","answer":"borrow。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數學B-01","year":"自編","kind":"自編練習","subject":"數學B","topic":"一元一次方程式","level":"基礎","question":"如果 3x＋5＝20，x 是多少？","options":["3","4","5","6"],"answer":2,"explanation":"把等號想成天平，左右要一樣重；先減 5，再除以 3。","wrongOptions":["3×3+5=14。","3×4+5=17。","","3×6+5=23。"],"steps":"3x＋5＝20 → 3x＝15 → x＝5。","extension":"解方程式時對等號兩邊做同樣的運算，等式仍成立。","practice":{"question":"2x＋4＝14，x＝？","answer":"5。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數學B-02","year":"自編","kind":"自編練習","subject":"數學B","topic":"百分比","level":"基礎","question":"一件衣服原價 800 元，打八折後是多少？","options":["160 元","640 元","720 元","880 元"],"answer":1,"explanation":"八折不是減 8 元，是只付原價的 80%，像 10 塊蛋糕拿走 8 塊。","wrongOptions":["160 是折掉的金額。","","720 是九折。","880 比原價貴。"],"steps":"800×0.8＝640。","extension":"折扣後再打折不是直接把兩個折數相加。","practice":{"question":"500 元打九折，售價？","answer":"450 元。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"id":"practice-數學B-03","year":"自編","kind":"自編練習","subject":"數學B","topic":"等差數列","level":"基礎","question":"數列 2、5、8、11，下一個數字是？","options":["12","13","14","15"],"answer":2,"explanation":"每一步都加 3，就像爬樓梯每次跨 3 階。","wrongOptions":["只多 1。","只多 2。","","多 4。"],"steps":"公差 d＝5－2＝3 → 11＋3＝14。","extension":"等差數列第 n 項 aₙ＝a₁＋(n－1)d。","practice":{"question":"3、7、11、15，下一項？","answer":"19。"},"textbook":null,"source":"本站原創教學練習，非官方統測原題","verified":false},{"i ${Number(q.page)||1}" target="_blank" rel="noopener noreferrer">對照官方 PDF（含圖表） ↗</a>${q.issues?.length?` · <b>待核對：${esc(q.issues.join("、"))}</b>`:""}</p>`:""}${opts}${marked}</div><div class="section orange">${h('💡','白話解說｜小學生也懂')}${done?`<div class="section resultbox"><h2>✅ 正確答案：${'ABCD'[q.answer]}</h2><p class="textline">${esc(q.options[q.answer])}</p></div><div class="subsection">白話解說</div><p class="textline">${keyHtml(q.explanation,q)}</p>${suduAccountingTeacher(q)}<h3>一步一步想或計算</h3><p class="textline">${keyHtml(q.steps||'這題的分步說明待補。',q)}</p><h3>選項為什麼對／錯？</h3>${detail||'<p>逐選項說明待補。</p>'}`:'<p>先試著回答這題，作答後就會看到白話解說和解題步驟。</p>'}</div><div class="section green">${h('📖','延伸觀念與練習')}${done?`<p class="textline">${esc(q.extension||'延伸內容待補')}</p>${ehtml}`:'<p class="small">先完成題目，就會顯示延伸觀念與一題相似題。</p>'}</div><div class="section sourcebox"><h2>📚 本題教材參照</h2>${bk?`<p class="textline"><b>彰商曾使用版本：</b>${esc(bk.publisher)}《${esc(bk.title)}》</p><p class="small">依 113 學年度第 2 學期 ${esc(bk.class)} 公開選書紀錄。這只確認冊次，不代表本題已核對到第幾章。</p>`:''}<div class="warning">尚未取得可核對的課本目錄及確切章節頁碼，因此不會虛構章名、頁數。</div><a href="${ALL.schoolSource}" target="_blank" rel="noopener">彰化高商公開教科書書單 ↗</a>　·　<a href="${ALL.catalog}" target="_blank" rel="noopener">國教院審定教科書 ↗</a></div><div class="questionnav"><button id="prev2" ${ui.index===0?'disabled':''}>↑ 上一題</button><strong>${ui.index+1} / ${a.length}</strong><button id="next2" ${ui.index===a.length-1?'disabled':''}>下一題 ↓</button></div>`}
function clinic(){
 const ids=Object.keys(state.attempts).filter(id=>Array.isArray(state.attempts[id])&&state.attempts[id].length>0&&state.attempts[id][0].correct===false);
 const pending=ids.filter(id=>!state.attempts[id].at(-1)?.mastered);
 const filter=state.reviewFilter||'all',shown=ids.filter(id=>filter==='all'||(filter==='pending'?!state.attempts[id].at(-1)?.mastered:state.attempts[id].at(-1)?.mastered));
 return `<div class="section white"><h2>🧠 首次答錯｜重點複習與原題再測</h2><p class="small">首次答錯會永久保存。每題都能在此直接重新選 A～D，送出前不顯示正解；再測結果另存，不會覆蓋第一次答錯的紀錄。黑底白字是本題的重要觀念關鍵字。</p><div class="row"><b>首次答錯 ${ids.length} 題｜待複習 ${pending.length} 題</b><button class="btn light" id="clinicOnly">回到逐題學習</button></div><div class="clinicfilter"><button data-review-filter="all" class="${filter==='all'?'active':''}">全部 ${ids.length}</button><button data-review-filter="pending" class="${filter==='pending'?'active':''}">待複習 ${pending.length}</button><button data-review-filter="mastered" class="${filter==='mastered'?'active':''}">已掌握 ${ids.length-pending.length}</button></div>${shown.length?shown.map(id=>{
   const q=[...ALL.practice,...(ALL.officialQuestions||[])].find(x=>x.id===id);if(!q)return '';
   const history=state.attempts[id],first=history[0],wrong=history.filter(a=>a.correct===false).length,mastered=!!history.at(-1)?.mastered;
   const test=state.reviewAnswers?.[id];const tested=Number.isInteger(test?.choice)&&test.choice>=0&&test.choice<q.options.length;
   const misconception=q.wrongOptions?.[first.choice]||(q.official?'這份正式考題的錯誤原因尚未核實，請參照當年度官方試卷與標準答案。':'請對照這題的核心原理，找出第一次選錯的關鍵。');
   const bk=ALL.books[q.subject],p=q.practice||{},source=q.textbook?.chapter?`${esc(q.textbook.title||'教材')}｜${esc(q.textbook.chapter)}`:'尚未核實教科書的章節與頁碼，不能編造';
   const opts=q.options.map((x,i)=>`<button class="option ${tested?(i===q.answer?'right':i===test.choice?'wrong':''):''}" data-clinic-answer="${esc(id)}" data-choice="${i}" ${tested?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(x)}</span></button>`).join('');
   const reviewBox=`<section class="clinic-quiz"><h3>📝 再測一次原題（${esc(q.subject)}）</h3><p class="bodytext">${esc(q.question)}</p>${opts}${tested?`<div class="clinic-feedback"><b class="${test.correct?'correct':'incorrect'}">${test.correct?'這次答對了！':'這次還需要再複習'}</b>　你選 ${'ABCD'[test.choice]}；正確是 ${'ABCD'[q.answer]}。<div class="small">${keyHtml(q.wrongOptions?.[test.choice]||q.explanation,q)}</div><button class="btn light" data-clinic-reset="${esc(id)}">再次重測（隱藏答案）</button></div>`:'<p class="small">直接點選 A～D 作答；選之前不顯示答案。結果會記錄在本機瀏覽器。</p>'}</section>`;
   return `<article class="reviewitem"><div class="row"><h3>${esc(q.subject)}｜${esc(q.topic)}</h3><span class="tag ${mastered?'':'warn'}">${mastered?'已掌握':'待複習'}</span></div>${reviewBox}<p class="small">第一次選錯：${'ABCD'[first.choice]} ${esc(q.options[first.choice])}；累積答錯 ${wrong} 次。此紀錄不因重測答對而消失。</p><div class="section explainbox"><h2>🟧 白話解答與錯誤原理</h2>${tested?`<div class="clinic-detail"><b>正確答案 ${'ABCD'[q.answer]}：${esc(q.options[q.answer])}</b></div>`:''}<p class="textline"><b>第一次選錯原因：</b>${keyHtml(misconception,q)}</p><p class="textline"><b>小學生口語解說：</b>${keyHtml(q.explanation||'此題白話詳解尚待正式核實，暫不提供猜測的說明。',q)}</p><p class="textline"><b>原理與計算：</b>${keyHtml(q.steps||'原理待補',q)}</p>${suduAccountingTeacher(q)}</div><div class="section sourcebox"><h2>🟪 出處與教材章節</h2><p class="small">題目：${esc(q.source||'本站自編題')}。教材章節：${source}。</p>${bk?`<p class="small">彰商公開選書參照：${esc(bk.publisher)}《${esc(bk.title)}》（僅核實書單，非本題章節）。</p>`:''}<a href="${ALL.schoolSource}" target="_blank" rel="noopener">彰商書單 ↗</a></div><div class="section green"><h2>🟩 延伸觀念與反向題</h2><p class="textline">${keyHtml(q.extension||'延伸觀念待補',q)}</p>${p.question?`<div class="followup"><b>相似／反向練習</b><p class="textline">${esc(p.question)}</p><button class="btn light" data-extension-toggle="${esc(id)}">${state.extended[id]?'隱藏延伸題詳解':'作答後查看延伸題答案與說明'}</button>${state.extended[id]?`<p class="hint">${keyHtml(p.answer||'詳解待補',q)}</p>`:''}</div>`:''}</div><div class="actions"><button class="btn light" data-jump="${esc(id)}">回逐題速讀</button><button class="btn light" data-master="${esc(id)}">${mastered?'恢復待複習':'標記已掌握'}</button></div></article>`;
 }).join(''):'<div class="hint">目前沒有首次答錯的題目，先到逐題速讀練習。</div>'}</div>`;
}
function archive(){
 const index=ALL.officialIndex?.years||[];
 const cards=ALL.archive.map(x=>{
  const sum=index.find(z=>z.year===x.year)||{},detail=ALL.officialYearReports?.[x.year];
  const count=detail?.questionsFound??sum.questions??0,matched=detail?.officialAnswersMatched??sum.officialAnswers??0,teaching=sum.teachingVerified??0;
  return '<div class="archiveitem"><b>'+x.year+' 年</b><p>已擷取原題：'+count+' 題<br>官方答案已配對：'+matched+' 題<br>教學解析已核實：'+teaching+' 題</p><button class="btn light" data-year="'+x.year+'">進入該年度試卷</button></div>';
 }).join('');
 return '<div class="section white"><h2>📚 90～115 年官方試題實際匯入進度</h2><p class="small">GitHub Actions 自動取得官方試卷及答案，考生不需手動匯入。已擷取題目不等於逐題解析全部核實。舊制商業類題目會標示原群類，避免誤作現制考科。</p><div class="archivegrid">'+cards+'</div><div class="warning">缺題、圖表、OCR 不確定或教材未核實時保留官方原卷連結；不顯示虛構解答。</div></div>';
}
function source(){return `<div class="section white"><h2>🔎 課本章節來源怎麼確保可信？</h2><p>先查彰化高商公開教科書書單，對照學年度、部別、年級、班級與出版社冊次；再查該版本的目錄，才填入每一題的第幾章／節／頁。找不到時改查其他臺灣技高審定教材，但必須標明並非彰商選用版。</p><p><a target="_blank" href="${ALL.schoolSource}">彰化高商公開書單</a>　／　<a target="_blank" href="${ALL.catalog}">國教院審定教科書</a>　／　<a target="_blank" href="${ALL.curriculum}">商管群相關課綱</a></p><div class="warning">課綱的單元名稱，不等於特定教科書的章名；OCR 擷取成功，也不等於內容／答案核實成功。</div><h3>資料核實門檻</h3><p>完整題幹與選項、當年正式標準答案、解題思路、計算過程、四選項理由、來源證據、延伸閱讀、延伸題及其答案都具備，才可標為「正式題完整教學」。</p></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===ui.tab));$('screen').innerHTML=({learn,clinic,archive,source,dashboard}[ui.tab]||learn)();if(ui.tab!=='learn')$('bottom').style.display='none';progress();if(ui.tab==='dashboard'){suduWireDashboard();suduLoadAllOfficialYears()}if(ui.tab==='learn')suduWorkspaceApply();document.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>{let q=available()[ui.index];if(!q||q.official&&!q.answerVerified)return;let l=rec(q.id).slice(),choice=Number(x.dataset.answer);const accepted=q.acceptedAnswers?.length?q.acceptedAnswers:[q.answer];l.push({choice,correct:accepted.includes(choice),at:new Date().toISOString(),firstChoice:l.length===0?choice:undefined});state.attempts[q.id]=l;save();render()});document.querySelectorAll('[data-review-filter]').forEach(x=>x.onclick=()=>{state.reviewFilter=x.dataset.reviewFilter;save();render()});document.querySelectorAll('[data-clinic-answer]').forEach(x=>x.onclick=()=>{const id=x.dataset.clinicAnswer,q=[...ALL.practice,...(ALL.officialQuestions||[])].find(v=>v.id===id);if(!q||q.official&&!q.answerVerified)return;const choice=Number(x.dataset.choice);if(!Number.isInteger(choice)||choice<0||choice>=q.options.length||Number.isInteger(state.reviewAnswers?.[id]?.choice))return;state.reviewAnswers[id]={choice,correct:(q.acceptedAnswers?.length?q.acceptedAnswers:[q.answer]).includes(choice),at:new Date().toISOString()};state.reviewHistory=state.reviewHistory||{};(state.reviewHistory[id]||=[]).push({...state.reviewAnswers[id]});save();render()});document.querySelectorAll('[data-clinic-reset]').forEach(x=>x.onclick=()=>{delete state.reviewAnswers[x.dataset.clinicReset];save();render()});document.querySelectorAll('[data-extension-toggle]').forEach(x=>x.onclick=()=>{const id=x.dataset.extensionToggle;state.extended[id]=!state.extended[id];save();render()});document.querySelectorAll('[data-retest]').forEach(x=>x.onclick=()=>{state.reviewAnswers[x.dataset.retest]={response:x.dataset.response,at:new Date().toISOString()};save();render()});document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{let q=[...ALL.practice,...(ALL.officialQuestions||[])].find(z=>z.id===x.dataset.jump);if(!q)return;let i=(q.official?(ALL.officialQuestions||[]).filter(z=>z.year===q.year&&z.paper===q.paper):ALL.practice).findIndex(z=>z.id===q.id);ui.year=String(q.year);ui.paper=q.paper||'自編';ui.subject='全部科目';ui.tab='learn';ui.index=Math.max(0,i);filters();save();render()});document.querySelectorAll('[data-master]').forEach(x=>x.onclick=()=>{let id=x.dataset.master,l=rec(id);if(l.length){l[l.length-1].mastered=!l[l.length-1].mastered;save();render()}});document.querySelectorAll('[data-year]').forEach(x=>x.onclick=()=>{ui.year=x.dataset.year;ui.paper=Number(ui.year)<=91?'BIZ-2':'09-2';ui.tab='learn';ui.index=0;ui.subject='全部科目';filters();save();render();suduLoadOfficialYear(ui.year).then(()=>{filters();render()})});$('showExtension')?.addEventListener('click',()=>{let id=available()[ui.index].id;state.extended[id]=!state.extended[id];save();render()});$('prev2')?.addEventListener('click',()=>nav(-1));$('next2')?.addEventListener('click',()=>nav(1));$('clinicOnly')?.addEventListener('click',()=>switchTab('learn'))}
$('year').onchange=()=>{ui.year=$('year').value;ui.paper=ui.year==='自編'?'自編':'09-2';ui.subject='全部科目';ui.index=0;filters();save();render();suduLoadOfficialYear(ui.year).then(()=>{filters();render()})};$('paper').onchange=()=>{ui.paper=$('paper').value;ui.subject='全部科目';ui.index=0;filters();save();render()};$('subject').onchange=()=>{ui.subject=$('subject').value;ui.index=0;save();render()};document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>switchTab(x.dataset.tab));$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);$('export').onclick=suduExportBackup;$('quick-dashboard').onclick=()=>switchTab('dashboard');$('db-import-file').onchange=e=>{suduImportBackup(e.target.files?.[0]);e.target.value=''};document.addEventListener('keydown',e=>{if(ui.tab!=='learn'||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowDown'){e.preventDefault();nav(1)}else if(e.key==='ArrowUp'){e.preventDefault();nav(-1)}});suduBoot();suduWorkspaceInit();filters();render();suduLoadOfficialYear(ui.year).then(()=>{filters();render()});
</script></body></html>
