<!doctype html>
<html lang="zh-Hant" data-ui-variant="classic">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>速讀｜115 統測會計學第 2～6 題完整測試版</title>
<style>
:root{
  --bg:#f6f8fc;--card:#fff;--text:#101828;--muted:#667085;--line:#d9e0ec;
  --blue:#2f5bea;--green:#13795b;--red:#b4233f;--purple:#7c3aed;--yellow:#ffe58f;
  --sticky-bg:#111;--sticky-text:#fff;--safe-bottom:env(safe-area-inset-bottom,0px);
  --progress-sticky-h:0px;--memory-sticky-h:0px;
}
[data-theme="dark"]{
  --bg:#000;--card:#111;--text:#f7f7f8;--muted:#a7adbb;--line:#2f3036;
  --sticky-bg:#fff;--sticky-text:#111;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;padding-bottom:110px;overflow-x:hidden}
button,select{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.header{display:flex;align-items:center;gap:14px;padding:22px 20px 15px;max-width:820px;margin:auto}
.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#315df5,#6849e8);display:grid;place-items:center;color:#fff;font-weight:1000;font-size:21px;box-shadow:0 8px 20px rgba(47,91,234,.22)}
.brand{font-size:35px;font-weight:1000;line-height:1;white-space:nowrap}.sub{font-size:19px;color:var(--muted);margin-left:8px;font-weight:700;white-space:nowrap}.grow{flex:1}
.theme{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:24px}
.control-row{max-width:820px;margin:auto;padding:0 20px 19px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.count{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:18px 20px;color:var(--muted);font-size:18px;font-weight:800;min-width:0}
.count b{display:block;color:var(--text);font-size:27px;line-height:1.15;margin-top:5px;letter-spacing:.01em}
.count time{display:block;font-size:14px;margin-top:5px}
.selectors{display:flex;gap:8px}.selectors select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:15px;padding:14px 16px;min-height:58px;font-size:18px;font-weight:900}
.progress-shell{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.progress{max-width:820px;margin:auto;padding:8px 14px 9px;display:grid;grid-template-rows:auto auto;gap:5px}
.progress-actions{display:grid;grid-template-columns:max-content max-content minmax(0,1fr);gap:8px;align-items:center;min-width:0}
.progress .label{font-size:19px;font-weight:1000;line-height:1.1;white-space:nowrap}.round{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap}
.reset{border:1px solid #f0b5bf;background:color-mix(in srgb,var(--red) 7%,var(--card));color:var(--red);border-radius:15px;padding:10px 13px;min-height:46px;font-size:16px;font-weight:1000;white-space:nowrap}
.continue{justify-self:end;border:0;background:#edf1ff;color:var(--blue);border-radius:15px;padding:10px 14px;min-height:46px;font-size:16px;font-weight:1000;white-space:nowrap;max-width:100%}
.progress-chips{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));gap:8px;align-items:center;min-width:0}
.chip{width:100%;max-width:55px;justify-self:center;aspect-ratio:1/1;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:18px;font-weight:1000;line-height:1;white-space:nowrap}
.chip.ok{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 9%,var(--card))}.chip.bad{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--card))}.chip.recovered{outline:3px solid color-mix(in srgb,var(--purple) 65%,transparent)}.chip.current{box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 60%,transparent)}
main{max-width:820px;margin:auto;padding:18px 16px 34px}
.qcard,.explain,.review{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:24px;margin-bottom:14px;min-width:0}
.qmeta{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:18px;font-weight:800;line-height:1.1}.qnum{font-size:41px;color:var(--blue);font-weight:1000}.pill{border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px;white-space:nowrap}.source{margin-left:auto;border:0;background:transparent;color:var(--muted);font-weight:900;white-space:nowrap;padding:8px}
h1{font-size:32px;line-height:1.2;margin:13px 0 12px;word-break:normal;overflow-wrap:break-word}.hl{background:var(--yellow);color:#3a2b00;padding:0 .12em;border-radius:.18em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.statement-list{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:5px;font-size:21px;line-height:1.26}.statement-list li{padding-left:1.7em;text-indent:-1.7em;overflow-wrap:break-word;word-break:normal}
.option-list{display:grid;gap:9px}.opt{width:100%;display:flex;align-items:flex-start;gap:14px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:19px;padding:16px 18px;font-size:22px;line-height:1.25;min-height:72px}.letter{flex:0 0 47px;height:47px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:21px;font-weight:1000}.opt>span:last-child{min-width:0;white-space:normal;word-break:normal;overflow-wrap:break-word}.opt.correct{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 18%,transparent)}.opt.selected-wrong{border-color:var(--red);box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 20%,transparent)}
.result{display:none;margin-top:10px;font-size:20px;font-weight:1000}.result.show{display:block}.good{color:var(--green)}.badtxt{color:var(--red)}.source-note{font-size:15px;color:var(--muted);margin-top:11px;line-height:1.3}
.memory-wrap{display:none;position:sticky;top:calc(var(--progress-sticky-h) + 6px);z-index:40;margin:0 0 10px;overflow:visible}.memory-wrap.show{display:block}.memory{background:var(--sticky-bg);color:var(--sticky-text);border:2px solid color-mix(in srgb,var(--sticky-text) 18%,transparent);border-radius:22px;padding:15px 18px 16px;box-shadow:0 10px 28px rgba(0,0,0,.22);overflow:visible;max-height:none}.memory small{display:block;opacity:.75;font-size:16px;font-weight:900;line-height:1.05;margin-bottom:4px}.memory strong{display:block;font-size:24px;line-height:1.12;white-space:normal;word-break:normal;overflow-wrap:break-word}.memory .kw{display:inline-block;white-space:nowrap;background:#ffd84d;color:#231a00;padding:0 .12em;border-radius:.18em;line-height:1.08}
.memory-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid color-mix(in srgb,var(--sticky-text) 28%,transparent)}
.memory-action{min-width:0;min-height:60px;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border:2px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);font-size:17px;font-weight:1000;line-height:1;text-align:center;white-space:nowrap;word-break:keep-all}.memory-action-icon{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:9px;background:var(--tone);color:#fff;font-size:17px}.memory-action.active{box-shadow:0 0 0 3px var(--tone) inset}
.explain{display:none}.explain.show{display:block}.explain h2{font-size:28px;margin:0 0 11px;line-height:1.12}.detail-card{border:1px solid var(--line);border-radius:19px;padding:17px;margin:10px 0;scroll-margin-top:calc(var(--progress-sticky-h) + var(--memory-sticky-h) + 18px)}.detail-card.correct{border-color:var(--green)}.detail-card.wrong{border-color:var(--red)}.detail-card h3{font-size:25px;margin:0 0 8px;line-height:1.12}.detail-card p{font-size:19px;line-height:1.25;margin:5px 0;word-break:normal;overflow-wrap:break-word}.learn-section{border-radius:13px;padding:7px 9px;margin:3px -9px 5px;scroll-margin-top:calc(var(--progress-sticky-h) + var(--memory-sticky-h) + 16px)}.learn-section h4{font-size:20px;color:var(--blue);margin:0 0 3px;line-height:1.1}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:color-mix(in srgb,var(--blue) 6%,var(--card));border-radius:14px;padding:12px 13px;margin-top:7px;font-size:18px;line-height:1.22;white-space:normal;word-break:normal;overflow-wrap:break-word;scroll-margin-top:calc(var(--progress-sticky-h) + var(--memory-sticky-h) + 16px)}
.review{display:none}.review.show{display:block}.review h2{font-size:28px;margin:0 0 9px}.review-summary{color:var(--muted);font-size:16px;margin-bottom:9px}.review-item{border:1px solid var(--red);border-radius:17px;padding:13px;margin:8px 0}.review-item h3{font-size:21px;margin:0 0 5px}.review-item p{font-size:18px;line-height:1.24;margin:4px 0}.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.review-actions button{border:0;border-radius:13px;background:#edf1ff;color:var(--blue);min-height:46px;padding:9px 12px;font-weight:1000;white-space:nowrap}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 7px calc(7px + var(--safe-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bottom button{min-height:74px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:19px;font-size:16px;font-weight:1000;line-height:1.1}.bottom button.active,.bottom button:last-child{color:var(--blue);border-color:#b9c5ff;background:#eef2ff}.bottom button:disabled{opacity:.4}
.focus-flash{animation:focusFlash .9s ease}@keyframes focusFlash{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 34%,transparent)}}
@media(max-width:560px){.control-row{grid-template-columns:1fr}.selectors{display:grid;grid-template-columns:1fr 1fr}.selectors select{width:100%}.progress .label{font-size:17px}.reset,.continue{font-size:15px}.memory-action{flex-direction:column;gap:3px;min-height:64px}}
@media(max-width:420px){.header{padding:18px 14px 13px}.brand{font-size:31px}.sub{font-size:16px}.logo{width:56px;height:56px}.theme{width:54px;height:54px}.control-row{padding:0 14px 15px;gap:10px}.count{padding:16px}.count b{font-size:24px}.selectors select{font-size:17px;padding:12px;min-height:54px}.progress{padding:7px 9px 8px;gap:4px}.progress-actions{grid-template-columns:max-content max-content minmax(0,1fr);gap:6px}.progress .label{font-size:15px}.round{display:none}.reset,.continue{font-size:13.5px;padding:8px 9px;min-height:42px}.progress-chips{gap:6px}.chip{max-width:46px;font-size:15px}main{padding:14px 10px 28px}.qcard,.explain,.review{padding:20px;border-radius:22px}.qnum{font-size:37px}.qmeta{font-size:16px}.pill{font-size:14px;padding:7px 9px}h1{font-size:28px;line-height:1.17}.statement-list{font-size:19px;line-height:1.23}.opt{font-size:20px;padding:15px;min-height:68px}.letter{flex-basis:43px;height:43px;font-size:19px}.memory{padding:13px 14px 14px;border-radius:19px}.memory strong{font-size:20.5px;line-height:1.1}.memory-actions{gap:6px;margin-top:9px;padding-top:9px}.memory-action{font-size:15.5px;padding:6px 3px;min-height:60px}.memory-action-icon{width:27px;height:27px;flex-basis:27px}.detail-card{padding:14px}.detail-card h3{font-size:22px}.detail-card p{font-size:18px;line-height:1.22}.learn-section h4{font-size:19px}.formula{font-size:16.5px}.bottom button{min-height:69px;font-size:14px}}
@media(max-width:360px){.sub{display:none}.progress-actions{grid-template-columns:1fr 1fr}.continue{grid-column:1/-1;justify-self:stretch;text-align:center}.progress-chips{gap:4px}.chip{max-width:42px;font-size:14px}.qcard,.explain,.review{padding:17px}h1{font-size:26px}.statement-list{font-size:18px}.opt{font-size:19px}.memory strong{font-size:19px}.memory-action{font-size:14px}.bottom button{font-size:13px;min-height:66px}}

/* UI 版本比較器：經典大字／學習卡／考場專注 */
.variant-picker{max-width:820px;margin:0 auto;padding:0 20px 15px}
.variant-panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:9px;box-shadow:0 8px 24px rgba(16,24,40,.05)}
.variant-title{font-size:15px;font-weight:1000;color:var(--muted);line-height:1.1}
.variant-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.variant-btn{min-width:0;min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);font-size:16px;font-weight:1000;line-height:1.08;padding:8px 6px;white-space:normal;word-break:keep-all}
.variant-btn[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card));color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 18%,transparent)}
.variant-note{font-size:13px;color:var(--muted);line-height:1.25}

/* B：學習卡動態版 */
html[data-ui-variant="cards"]{
  --bg:#f3f1ff;--card:#ffffff;--text:#17132b;--muted:#665f7a;--line:#d8d1ff;
  --blue:#5b4ce8;--green:#0f8a68;--red:#c1254c;--purple:#8a3ffc;--yellow:#ffe57a;
  --sticky-bg:#24184d;--sticky-text:#fff;
}
html[data-ui-variant="cards"] .top{background:linear-gradient(180deg,#faf9ff 0%,#f3f1ff 100%)}
html[data-ui-variant="cards"] .logo{border-radius:22px;background:linear-gradient(135deg,#5b4ce8,#a855f7);box-shadow:0 12px 28px rgba(91,76,232,.28)}
html[data-ui-variant="cards"] .count,
html[data-ui-variant="cards"] .qcard,
html[data-ui-variant="cards"] .explain,
html[data-ui-variant="cards"] .review{box-shadow:0 14px 34px rgba(75,55,145,.10);border-color:#e0dbff}
html[data-ui-variant="cards"] .qcard,
html[data-ui-variant="cards"] .explain,
html[data-ui-variant="cards"] .review{border-radius:31px}
html[data-ui-variant="cards"] .opt{border-radius:23px;box-shadow:0 7px 18px rgba(75,55,145,.06);transition:transform .18s ease,box-shadow .18s ease}
html[data-ui-variant="cards"] .opt:active{transform:scale(.985)}
html[data-ui-variant="cards"] .memory{background:linear-gradient(135deg,#211846,#35206f);box-shadow:0 18px 40px rgba(45,31,98,.28)}
html[data-ui-variant="cards"] .bottom button{border-radius:24px;box-shadow:0 6px 18px rgba(75,55,145,.08)}
html[data-ui-variant="cards"] .chip{border-width:3px;box-shadow:0 4px 12px rgba(75,55,145,.08)}

/* C：考場專注版 */
html[data-ui-variant="exam"]{
  --bg:#fffdf5;--card:#fff;--text:#090909;--muted:#4b5563;--line:#111;
  --blue:#123ea8;--green:#006b4f;--red:#a90028;--purple:#5521a8;--yellow:#ffd83d;
  --sticky-bg:#000;--sticky-text:#fff;
}
html[data-ui-variant="exam"] .top{background:#fffdf5;border-bottom:2px solid #111}
html[data-ui-variant="exam"] .logo{background:#111;border-radius:12px;box-shadow:none}
html[data-ui-variant="exam"] .count,
html[data-ui-variant="exam"] .selectors select,
html[data-ui-variant="exam"] .qcard,
html[data-ui-variant="exam"] .explain,
html[data-ui-variant="exam"] .review,
html[data-ui-variant="exam"] .variant-panel{border:2px solid #111;box-shadow:none;border-radius:14px}
html[data-ui-variant="exam"] .qcard,
html[data-ui-variant="exam"] .explain,
html[data-ui-variant="exam"] .review{border-radius:16px}
html[data-ui-variant="exam"] .opt{border:2px solid #111;border-radius:12px;box-shadow:none}
html[data-ui-variant="exam"] .opt.correct{border-width:4px}
html[data-ui-variant="exam"] .opt.selected-wrong{border-width:4px}
html[data-ui-variant="exam"] .memory{border:3px solid #000;border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
html[data-ui-variant="exam"] .bottom{border-top:2px solid #111;backdrop-filter:none;background:#fffdf5}
html[data-ui-variant="exam"] .bottom button{border:2px solid #111;border-radius:12px;box-shadow:none}
html[data-ui-variant="exam"] .chip{border:2px solid #111;box-shadow:none}
html[data-ui-variant="exam"] .hl{border-radius:2px}

html[data-theme="dark"][data-ui-variant="cards"]{--bg:#000;--card:#151225;--text:#faf9ff;--muted:#b9b3cc;--line:#3d355f;--sticky-bg:#fff;--sticky-text:#17132b}
html[data-theme="dark"][data-ui-variant="exam"]{--bg:#000;--card:#0b0b0b;--text:#fff;--muted:#c9c9c9;--line:#fff;--sticky-bg:#fff;--sticky-text:#000}
@media(max-width:420px){.variant-picker{padding:0 14px 12px}.variant-panel{padding:10px}.variant-btn{font-size:14px;min-height:50px}.variant-note{font-size:12px}}

/* 作答專注模式：題號／進度列預設隱藏，靠近頂部時滑出 */
:root{--question-nav-h:0px}
.nav-hover-zone{position:fixed;top:0;left:0;right:0;height:24px;z-index:76;display:flex;justify-content:center;pointer-events:auto}
.nav-hover-zone::after{content:"題號";height:20px;min-width:82px;padding:1px 14px 0;border-radius:0 0 12px 12px;background:color-mix(in srgb,var(--blue) 88%,transparent);color:#fff;font-size:12px;font-weight:1000;line-height:18px;text-align:center;box-shadow:0 4px 14px rgba(47,91,234,.24);opacity:.78;transform:translateY(-13px);transition:transform .2s ease,opacity .2s ease}
.nav-hover-zone:hover::after,html.nav-open .nav-hover-zone::after{transform:translateY(0);opacity:1}
.progress-shell{position:fixed!important;top:0;left:0;right:0;z-index:75;transform:translateY(calc(-100% - 12px));transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease;box-shadow:0 16px 34px rgba(15,23,42,.16);will-change:transform}
html.nav-open .progress-shell{transform:translateY(0)}
.question-nav-toggle{position:fixed;right:14px;bottom:calc(94px + var(--safe-bottom));z-index:72;display:none;align-items:center;justify-content:center;min-height:52px;max-width:calc(100vw - 28px);padding:0 16px;border:2px solid color-mix(in srgb,var(--blue) 40%,var(--line));border-radius:999px;background:var(--card);color:var(--blue);font-size:16px;font-weight:1000;white-space:nowrap;box-shadow:0 10px 28px rgba(15,23,42,.18)}
.question-nav-toggle[aria-expanded="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.detail-card,.learn-section,.formula{scroll-margin-top:calc(var(--question-nav-h) + var(--memory-sticky-h) + 18px)!important}
.qcard{scroll-margin-top:16px}
@media(hover:none),(pointer:coarse),(max-width:1024px){
  .nav-hover-zone{display:none}
  .question-nav-toggle{display:flex}
  .progress-shell{max-height:min(72vh,620px);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
}
@media(max-width:560px){
  .question-nav-toggle{right:10px;bottom:calc(88px + var(--safe-bottom));min-height:50px;padding:0 14px;font-size:15px}
}
@media(max-width:360px){.question-nav-toggle{font-size:14px;padding:0 12px}}
@media(prefers-reduced-motion:reduce){.progress-shell,.nav-hover-zone::after{transition:none!important}}

</style>
</head>
<body>
<div class="top">
  <div class="header">
    <div class="logo">速</div>
    <div><span class="brand">速讀</span><span class="sub">統測學習卡</span></div>
    <div class="grow"></div>
    <button class="theme" id="themeBtn" aria-label="切換深淺色主題">☾</button>
  </div>
  <div class="control-row">
    <div class="count">距 116 統測 <b id="countdown">計算中…</b><time id="nowTime"></time></div>
    <div class="selectors"><select aria-label="年度"><option>115 年</option></select><select aria-label="科目"><option>會計學</option></select></div>
  </div>
</div>
<div class="nav-hover-zone" id="navHoverZone" aria-hidden="true"></div>
<div class="progress-shell" id="progressShell" aria-label="題號與作答進度">
  <div class="progress">
    <div class="progress-actions">
      <span class="label" id="progressLabel">已答 0/5 題</span>
      <button class="reset" id="resetBtn">↻ 重新作答</button>
      <button class="continue" id="continueBtn">續答第 2 題 →</button>
    </div>
    <div class="progress-chips" id="progressChips"></div>
  </div>
</div>
<button class="question-nav-toggle" id="questionNavToggle" aria-expanded="false" aria-controls="progressShell">題號 · 第 2 題</button>
<main>
  <section class="qcard" id="questionCard"></section>
  <div class="memory-wrap" id="memoryWrap"><div class="memory" id="memoryCard"></div></div>
  <section class="explain" id="explain"></section>

function renderExplain(){
 const q=currentQuestion();
 explain.innerHTML=`<h2>第 ${q.id} 題｜四個選項都弄懂</h2>${Object.entries(q.details).map(([key,d])=>`<article class="detail-card ${d.ok?'correct':'wrong'}" id="detail-${q.id}-${key}"><h3>${key} ${d.ok?'✅ 正確答案':'❌ 不正確'}</h3><p><b>為什麼：</b>${escapeHtml(d.explain)}</p><div class="learn-section" id="concept-${q.id}-${key}"><h4>觀念</h4><p>${escapeHtml(d.concept)}</p></div><div class="learn-section" id="extension-${q.id}-${key}"><h4>延伸觀念</h4><p>${escapeHtml(d.extension)}</p></div><div class="formula" id="formula-${q.id}-${key}"><b>公式／口訣</b><br>${escapeHtml(d.formula)}</div></article>`).join('')}`;
}
function renderReview(){
 const wrong=currentRound().wrong;el('reviewSummary').textContent=`第 ${state.round} 輪共有 ${wrong.length} 題曾答錯；後來答對也會保留到重新作答為止。`;
 el('reviewList').innerHTML=wrong.length?wrong.map(id=>{const q=qById(id),d=q.details[q.correct];return `<article class="review-item"><h3>第 ${id} 題｜${escapeHtml(q.topic)}</h3><p><b>正確答案：</b>${q.correct}　${escapeHtml(q.options[q.correct])}</p><p><b>一眼記住：</b>${q.memory}</p><p><b>核心觀念：</b>${escapeHtml(d.concept)}</p><div class="review-actions"><button data-review-q="${id}" data-mode="explain">看完整解說</button><button data-review-q="${id}" data-mode="retry">再答一次</button></div></article>`}).join(''):'<article class="review-item" style="border-color:var(--line)"><h3>目前沒有錯題</h3><p>本輪答錯的題目會自動出現在這裡。</p></article>';
 review.querySelectorAll('[data-review-q]').forEach(btn=>btn.onclick=()=>{goToQuestion(Number(btn.dataset.reviewQ));if(btn.dataset.mode==='explain')setTimeout(showExplain,80)});
}
function syncStickyOffsets(){const navOpen=document.documentElement.classList.contains('nav-open');const ph=navOpen?Math.ceil(progressShell.getBoundingClientRect().height||0):0;const mh=memoryWrap.classList.contains('show')?Math.ceil(memoryCard.getBoundingClientRect().height||0):0;document.documentElement.style.setProperty('--progress-sticky-h',ph+'px');document.documentElement.style.setProperty('--question-nav-h',ph+'px');document.documentElement.style.setProperty('--memory-sticky-h',mh+'px')}
function scrollBelowMemory(target,behavior='smooth'){if(!target)return;syncStickyOffsets();const styles=getComputedStyle(document.documentElement);const ph=parseFloat(styles.getPropertyValue('--progress-sticky-h'))||0;const mh=parseFloat(styles.getPropertyValue('--memory-sticky-h'))||0;const mt=parseFloat(getComputedStyle(memoryWrap).top)||(ph+6);const top=window.scrollY+target.getBoundingClientRect().top-(mt+mh+10);window.scrollTo({top:Math.max(0,top),behavior})}
function scrollCorrect(){const q=currentQuestion();requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>scrollBelowMemory(el(`detail-${q.id}-${q.correct}`)),35)))}
function scrollLearning(kind,btn){const q=currentQuestion();showExplain(false);memoryCard.querySelectorAll('.memory-action').forEach(x=>x.classList.toggle('active',x===btn));const target=el(`${kind}-${q.id}-${q.correct}`);if(target){target.classList.remove('focus-flash');void target.offsetWidth;target.classList.add('focus-flash');scrollBelowMemory(target);setTimeout(()=>target.classList.remove('focus-flash'),950)}}
let navCloseTimer=null;
function setQuestionNav(open){clearTimeout(navCloseTimer);document.documentElement.classList.toggle('nav-open',open);const toggle=el('questionNavToggle');if(toggle)toggle.setAttribute('aria-expanded',String(open));requestAnimationFrame(syncStickyOffsets)}
function scheduleQuestionNavClose(){clearTimeout(navCloseTimer);navCloseTimer=setTimeout(()=>setQuestionNav(false),520)}
function answer(ans){setQuestionNav(false);const q=currentQuestion();const ok=ans===q.correct;currentRound().selected[q.id]=ans;currentRound().status[q.id]=ok?'ok':'bad';if(!ok&&!currentRound().wrong.includes(q.id))currentRound().wrong.push(q.id);saveState();renderQuestion();renderMemory();renderExplain();showExplain(true)}
function showQuestion(){setQuestionNav(false);activeView='question';review.classList.remove('show');explain.classList.remove('show');memoryWrap.classList.remove('show');updateBottom();syncStickyOffsets();questionCard.scrollIntoView({behavior:'smooth',block:'start'})}
function showExplain(autoScroll=true){const q=currentQuestion();if(!currentRound().status[q.id]){alert('請先選擇答案，再查看解說。');return}activeView='explain';review.classList.remove('show');explain.classList.add('show');memoryWrap.classList.add('show');renderMemory();renderExplain();updateBottom();syncStickyOffsets();if(autoScroll)scrollCorrect()}
function showReview(){activeView='review';explain.classList.remove('show');memoryWrap.classList.remove('show');review.classList.add('show');renderReview();updateBottom();syncStickyOffsets();review.scrollIntoView({behavior:'smooth',block:'start'})}
function goToQuestion(id){const idx=IDS.indexOf(id);if(idx<0)return;setQuestionNav(false);currentIndex=idx;activeView='question';renderQuestion();renderMemory();renderExplain();review.classList.remove('show');explain.classList.remove('show');memoryWrap.classList.remove('show');syncStickyOffsets();questionCard.scrollIntoView({behavior:'smooth',block:'start'})}
function updateBottom(){el('prevBtn').disabled=currentIndex===0;el('nextBtn').disabled=currentIndex===QUESTIONS.length-1;el('qBtn').classList.toggle('active',activeView==='question');el('expBtn').classList.toggle('active',activeView==='explain');el('wrongBtn').classList.toggle('active',activeView==='review')}
function resetPaper(){const ok=confirm(`重新作答會封存第 ${state.round} 輪，清空畫面上的答題狀態與錯題，並開始新一輪。舊紀錄仍保留在歷史資料中。\n\n確定重新作答嗎？`);if(!ok)return;const now=new Date().toISOString();state.history.push({round:state.round,status:{...currentRound().status},selected:{...currentRound().selected},wrong:[...currentRound().wrong],startedAt:currentRound().startedAt,endedAt:now});state.round++;state.current={status:blankStatus(),selected:blankSelected(),wrong:[],startedAt:now};saveState();currentIndex=0;renderQuestion();renderMemory();renderExplain();showQuestion();setTimeout(()=>alert(`已開始第 ${state.round} 輪。上一輪已封存，本輪錯題會重新記錄。`),220)}
function updateCountdown(){const target=new Date('2027-04-24T00:00:00+08:00').getTime(),now=Date.now(),diff=Math.max(0,target-now),day=Math.floor(diff/86400000),hour=Math.floor(diff%86400000/3600000),min=Math.floor(diff%3600000/60000),sec=Math.floor(diff%60000/1000);el('countdown').textContent=`${day}天 ${hour}時 ${min}分 ${sec}秒`;el('nowTime').textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())+' · 臺灣'}
const navHoverZone=el('navHoverZone'),questionNavToggle=el('questionNavToggle');
navHoverZone?.addEventListener('mouseenter',()=>setQuestionNav(true));
progressShell.addEventListener('mouseenter',()=>setQuestionNav(true));
progressShell.addEventListener('mouseleave',scheduleQuestionNavClose);
progressShell.addEventListener('focusin',()=>setQuestionNav(true));
progressShell.addEventListener('focusout',e=>{if(!progressShell.contains(e.relatedTarget))scheduleQuestionNavClose()});
questionNavToggle?.addEventListener('click',()=>setQuestionNav(!document.documentElement.classList.contains('nav-open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setQuestionNav(false)});
document.addEventListener('pointerdown',e=>{if(document.documentElement.classList.contains('nav-open')&&!progressShell.contains(e.target)&&e.target!==questionNavToggle&&!navHoverZone?.contains(e.target))setQuestionNav(false)});
el('resetBtn').onclick=resetPaper;el('themeBtn').onclick=()=>{const root=document.documentElement,dark=root.dataset.theme==='dark';root.dataset.theme=dark?'':'dark';el('themeBtn').textContent=dark?'☾':'☀';setTimeout(syncStickyOffsets,40)};el('qBtn').onclick=showQuestion;el('expBtn').onclick=()=>showExplain(true);el('wrongBtn').onclick=showReview;el('prevBtn').onclick=()=>currentIndex>0&&goToQuestion(QUESTIONS[currentIndex-1].id);el('nextBtn').onclick=()=>currentIndex<QUESTIONS.length-1&&goToQuestion(QUESTIONS[currentIndex+1].id);
document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(['A','B','C','D'].includes(k)&&activeView==='question')answer(k)});
if('ResizeObserver'in window){const ro=new ResizeObserver(syncStickyOffsets);ro.observe(progressShell);ro.observe(memoryCard)}window.addEventListener('resize',syncStickyOffsets,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(syncStickyOffsets,120),{passive:true});

const UI_VARIANT_KEY='tvet-ui-variant-v1';
const UI_VARIANT_NOTES={
 classic:'A｜大字、留白充足，適合長時間閱讀與手機單手操作。',
 cards:'B｜圓潤、層次與動態較明顯，接近互動學習卡的感覺。',
 exam:'C｜黑白高對比、裝飾最少，適合模擬考場與快速判讀。'
};
function applyUiVariant(value){
 const valid=['classic','cards','exam'].includes(value)?value:'classic';
 document.documentElement.dataset.uiVariant=valid;
 document.querySelectorAll('[data-variant]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.variant===valid)));
 const note=document.getElementById('variantNote');if(note)note.textContent=UI_VARIANT_NOTES[valid];
 localStorage.setItem(UI_VARIANT_KEY,valid);
 setTimeout(syncStickyOffsets,60);
}
document.querySelectorAll('[data-variant]').forEach(btn=>btn.addEventListener('click',()=>applyUiVariant(btn.dataset.variant)));
applyUiVariant('classic');

renderQuestion();renderMemory();renderExplain();renderReview();syncStickyOffsets();updateCountdown();setInterval(updateCountdown,1000);if(document.fonts?.ready)document.fonts.ready.then(syncStickyOffsets).catch(()=>{});
</script>
</body>
</html>
