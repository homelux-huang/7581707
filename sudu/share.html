<!doctype html>
<html lang="zh-Hant" data-sudu-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7581707｜學習分享報告</title>
<style>
:root{color-scheme:dark;--page:#080b10;--surface:#172130;--text:#f4f7fc;--muted:#c6d1df;--line:#6b809b;--link:#a7d7ff;--button:#fff;--button-text:#131b27;--focus:#ffd26a;font:15px/1.7 system-ui,"Noto Sans TC",sans-serif}
:root[data-sudu-theme="light"]{color-scheme:light;--page:#f1f5f9;--surface:#fff;--text:#172235;--muted:#42516a;--line:#60738d;--link:#074b89;--button:#131b27;--button-text:#fff;--focus:#8c3e00}
*{box-sizing:border-box}body{background:var(--page);color:var(--text);margin:0;padding:14px}main{max-width:850px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}article,section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;overflow-wrap:anywhere}a{color:var(--link)}h1{font-size:22px}h2{font-size:18px}p{margin:5px 0;overflow-wrap:anywhere}.muted{color:var(--muted)}button{background:var(--button);color:var(--button-text);font:inherit;border:1px solid var(--line);border-radius:9px;min-height:44px;padding:8px 12px;cursor:pointer}button:hover{box-shadow:0 0 0 2px var(--line)}button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}img{display:block;max-width:100%;max-height:460px;object-fit:contain;margin:10px auto;background:white}@media(max-width:375px){body{padding:10px}article,section{padding:12px}h1{font-size:20px}}
</style></head><body><main><header><h1>7581707｜學生學習分享報告</h1><button id="theme" type="button">切換主題</button></header><p class="muted">此限期連結只提供學習報告，沒有管理權限。未核實配分或待人工閱卷時，不顯示整卷數字成績。</p><div id="report" role="status">檢查分享連結中…</div><p><a href="https://homelux-huang.github.io/7581707/sudu/">返回逐題學習</a></p></main>
<script>
"use strict";
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);return e}
function theme(next){document.documentElement.dataset.suduTheme=next;try{localStorage.setItem("sudu_theme_v1",next)}catch{}document.getElementById("theme").textContent=next==="dark"?"☀ 淺色主題":"☾ 深色主題"}
try{theme(localStorage.getItem("sudu_theme_v1")==="light"?"light":"dark")}catch{theme("dark")}
document.getElementById("theme").onclick=()=>theme(document.documentElement.dataset.suduTheme==="dark"?"light":"dark");
function niceDate(value){if(!value)return "N/A";const date=new Date(value);return Number.isNaN(date.getTime())?"N/A":date.toLocaleString("zh-TW",{timeZone:"Asia/Taipei"})+"（臺北）"}
function line(parent,label,value){parent.append(el("p",label+"："+(value??"N/A")))}
const panel=document.getElementById("report"),token=location.pathname.split("/").pop();
if(!/^[A-Za-z0-9_-]{30,120}$/.test(token)){panel.textContent="尚無有效分享連結；請使用私人後台產生的限期報告網址。"}
else fetch("/api/share/"+encodeURIComponent(token),{cache:"no-store",credentials:"omit"}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d}).then(({report:r,expiresAt})=>{
 panel.replaceChildren();const top=el("section");top.append(el("h2",r.nickname));line(top,"分享範圍",r.scope);line(top,"作答進度",r.answeredQuestions+" 題；曾錯選紀錄 "+r.firstWrongCount+" 題（含待核對）");line(top,"已核實錯誤事件",r.wrongEventCount);line(top,"待核對作答事件",r.pendingGradingEvents);line(top,"分享截止",niceDate(expiresAt));panel.append(top);
 for(const s of r.scores){const x=el("article");x.append(el("h2",s.paper));line(x,"狀態",s.scoreStatus);if(Number.isFinite(s.score))line(x,"依官方規則計算",s.score+" / "+s.maxScore);if(Number.isFinite(s.objectiveScore))line(x,"選擇題小計（非整卷）",s.objectiveScore+" / "+s.objectiveMax);line(x,"開始",niceDate(s.startedAt));line(x,"送出",niceDate(s.submittedAt));line(x,"經過時間",Number.isFinite(s.elapsedMs)?Math.round(s.elapsedMs/60000)+" 分鐘（含離開頁面；活躍時間 N/A）":"N/A");if(s.adjustedScore!==null)line(x,"管理員調整分數（另列，非官方）",s.adjustedScore);panel.append(x)}
 for(const q of r.firstWrong||[]){const x=el("article");x.append(el("h2",q.subject+" · "+q.id));line(x,"題目",q.question);for(let i=0;i<(q.options||[]).length;i++)line(x,"ABCD"[i],q.options[i]);line(x,"官方接受答案",Array.isArray(q.answer)?q.answer.map(a=>"ABCD"[a]).join("／"):"待核對");line(x,"首次錯選",Number.isInteger(q.firstChoice)?"ABCD"[q.firstChoice]:"N/A");line(x,"首次錯選日期",niceDate(q.firstAt));line(x,"已核實錯誤事件",q.wrongCount);line(x,"裝置歷史錯選（待核對）",q.reportedWrongCount);line(x,"白話解析",q.explanation);line(x,"觀念",q.principle);line(x,"步驟",q.steps);line(x,"教材",q.chapter);if(typeof q.source==="string"&&/^https:\/\/(?:[^/]+\.)?tcte\.edu\.tw\//.test(q.source)){const a=el("a","官方試題原卷");a.href=q.source;a.rel="noopener noreferrer";a.target="_blank";x.append(a)}for(const picture of q.originalImages||[]){const a=el("a");a.href=picture.url;a.target="_blank";a.rel="noopener noreferrer";const image=el("img");image.src=picture.url;image.alt="原卷第 "+picture.page+" 頁（"+picture.mapping+"）";image.loading="lazy";a.append(image);x.append(a)}panel.append(x)}
}).catch(e=>panel.textContent=e.message||"分享報告載入失敗，請稍後重試。");
</script></body></html>
